<!DOCTYPE html>
<!-- 🟢 F040 循環子分類（APPROVED — 2026-08-07 人類閘門通過）
     本檔已套用：第 13 列「循環別」改以 lifecycleDisplayName 呈現（銷售及收款循環（消金））。
     規格權威＝docs/specs/features/F040-lifecycle-subcategory.md -->
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>檢視 ICSOP 文件（唯讀）· 後台</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = { theme: { extend: {
    fontFamily: { sans: ['Inter','Noto Sans TC','sans-serif'] },
    colors: { primary: { 50:'#F3F7FC',100:'#EAF1FA',200:'#CFDFF3',300:'#98B6E4',400:'#6E96D4',500:'#4A72AE',600:'#365C97',700:'#2A4A7E' } }
  }}}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono&display=swap" rel="stylesheet" />
<script src="https://unpkg.com/lucide@latest"></script>
<style>
  body{font-family:'Inter','Noto Sans TC',sans-serif;color:#334155;background:#FFFFFF;}
  .mono{font-family:'JetBrains Mono',monospace;}
  /* admin shell sidebar */
  #sidebar{width:240px;transition:width .2s ease;}
  body{padding-left:240px;transition:padding-left .2s ease;}
  body.sb-collapsed{padding-left:60px;}
  body.sb-collapsed #sidebar{width:60px;}
  body.sb-collapsed .sb-label{display:none;}
  body.sb-collapsed #sidebarNav .sb-item{justify-content:center;padding-left:0;padding-right:0;}
</style>
</head>
<body data-role="supervisor" class="min-h-screen">

<!-- ===== Admin shell sidebar ===== -->
<aside id="sidebar" class="fixed left-0 top-0 bottom-0 z-50 bg-white border-r border-slate-200 flex flex-col">
  <a href="07-admin-shell.html" data-to="/admin" aria-label="回到後台首頁" title="回到後台首頁" class="h-14 flex items-center gap-2 px-3 border-b border-slate-200 shrink-0 hover:bg-slate-50 focus:outline-none focus:ring-2 focus:ring-inset focus:ring-primary-600">
    <div class="w-8 h-8 rounded-lg bg-primary-600 flex items-center justify-center text-white shrink-0"><i data-lucide="file-text" class="w-5 h-5"></i></div>
    <span class="sb-label font-bold text-slate-900 text-sm truncate">ICSOP 後台</span>
  </a>
  <nav id="sidebarNav" class="flex-1 overflow-y-auto py-2 px-2 space-y-0.5"></nav>
  <div class="border-t border-slate-200 p-2 shrink-0">
    <button onclick="openPublic()" title="瀏覽文件網頁（開新視窗）" class="sb-item w-full flex items-center gap-2.5 px-2.5 py-2 rounded-md text-sm text-slate-600 hover:bg-slate-50">
      <i data-lucide="external-link" class="w-4 h-4 shrink-0"></i><span class="sb-label truncate">瀏覽文件網頁</span></button>
  </div>
</aside>

<!-- Top bar -->
<header class="sticky top-0 z-30 bg-white border-b border-slate-200">
  <div class="h-14 px-4 flex items-center gap-3">
    <button onclick="toggleSidebar()" title="收合/展開選單" class="text-slate-400 hover:text-slate-600"><i data-lucide="panel-left" class="w-5 h-5"></i></button>
    <div class="leading-tight min-w-0">
      <div class="text-xs text-slate-400 flex items-center gap-1"><a href="13-document-list.html" data-to="/admin/documents" class="hover:text-primary-700 hover:underline focus:outline-none focus:ring-2 focus:ring-primary-600 rounded">ICSOP 文件管理</a><i data-lucide="chevron-right" class="w-3 h-3"></i><span>檢視（唯讀）</span></div>
      <div class="font-semibold text-slate-900 text-sm truncate">檢視文件 · <span class="mono text-slate-600">ICSOP-SRC-101-1-01</span></div>
    </div>
    <div class="ml-auto flex items-center gap-2">
      <button id="editEntry" onclick="gotoEdit()" class="hidden inline-flex items-center gap-1.5 px-3 py-1.5 rounded-md bg-primary-600 text-white text-sm font-medium hover:bg-primary-700"><i data-lucide="pencil" class="w-4 h-4"></i>前往編輯</button>
      <div class="flex items-center gap-1.5 pl-2 border-l border-slate-200">
        <i data-lucide="users" class="w-4 h-4 text-slate-400"></i>
        <select id="roleSel" onchange="setRole(this.value)" class="text-sm border border-slate-300 rounded-md px-2 py-1.5 bg-white">
          <option value="supervisor">主管（唯讀）</option>
          <option value="deptcontact">部門窗口（唯讀）</option>
          <option value="icsop_admin">ICSOP 管理員</option>
          <option value="sysadmin">系統管理員（唯讀）</option>
          <option value="user">一般使用者</option>
        </select>
      </div>
      <div class="hidden xl:flex items-center gap-1.5 text-sm text-slate-500 pl-2 border-l border-slate-200"><i data-lucide="user-circle" class="w-4 h-4"></i><span id="userName">王主管</span></div>
      <button title="登出" class="w-8 h-8 rounded-full hover:bg-slate-100 flex items-center justify-center text-slate-500"><i data-lucide="log-out" class="w-4 h-4"></i></button>
    </div>
  </div>
  <!-- readonly banner -->
  <div id="roBanner" class="bg-cyan-50 border-t border-cyan-200 text-cyan-800 text-sm px-4 py-2 flex items-center gap-2">
    <i data-lucide="eye" class="w-4 h-4"></i><span>唯讀模式 · <strong>此角色對 ICSOP 文件全欄位皆唯讀</strong>；附件可下載（燒錄浮水印），但不可上傳/取代（FIELD_WRITE_FORBIDDEN）。</span>
  </div>
  <!-- admin note -->
  <div id="adminNote" class="hidden bg-primary-50 border-t border-primary-100 text-primary-700 text-sm px-4 py-2 items-center gap-2">
    <i data-lucide="info" class="w-4 h-4"></i><span>您是 ICSOP 管理員 · 可修改此文件，請前往編輯頁（15-document-edit）。</span>
  </div>
</header>

<!-- blocked overlay -->
<div id="blockOverlay" class="hidden fixed inset-0 z-40 bg-slate-50/90 backdrop-blur-sm flex items-center justify-center">
  <div class="text-center max-w-xs">
    <div class="w-14 h-14 rounded-full bg-red-50 flex items-center justify-center mx-auto mb-3"><i data-lucide="lock" class="w-7 h-7 text-red-500"></i></div>
    <h3 class="font-semibold text-slate-900">無文件檢視權限</h3>
    <p class="text-sm text-slate-500 mt-1" id="blockMsg"></p>
    <p class="text-xs mono text-slate-400 mt-2">PERMISSION_DENIED · 403</p>
  </div>
</div>

<main class="max-w-4xl mx-auto px-4 py-6 space-y-5">
  <!-- 16 fields readonly -->
  <section class="bg-white border border-slate-200 rounded-xl p-5">
    <div class="flex items-center gap-2 mb-4"><i data-lucide="file-text" class="w-4 h-4 text-primary-600"></i><h2 class="font-semibold text-slate-900">文件欄位（唯讀）</h2></div>
    <dl id="fieldGrid" class="divide-y divide-slate-100"></dl>
  </section>

  <!-- attachments (download only) -->
  <section class="bg-white border border-slate-200 rounded-xl p-5">
    <div class="flex items-center gap-2 mb-1"><i data-lucide="paperclip" class="w-4 h-4 text-primary-600"></i><h2 class="font-semibold text-slate-900">附件（僅下載）</h2></div>
    <p class="text-xs text-slate-400 mb-3 flex items-center gap-1.5"><i data-lucide="shield" class="w-3.5 h-3.5"></i>下載/列印時伺服器端<strong class="text-slate-500">燒錄浮水印</strong>並寫入稽核；無上傳/取代入口。</p>
    <div id="attachList" class="space-y-2"></div>
  </section>
  <div class="h-4"></div>
</main>

<div id="toastWrap" class="fixed top-16 right-4 z-[60] space-y-2"></div>

<script>
  /* ===== admin shell sidebar ===== */
  const MENU=[
    {id:'account',label:'帳號管理',icon:'users',roles:{sysadmin:'CRUD',icsop_admin:'唯讀'}},
    {id:'lifecycle',label:'循環管理',icon:'workflow',roles:{sysadmin:'唯讀',icsop_admin:'CRUD',supervisor:'唯讀'}},
    {id:'document',label:'ICSOP 文件管理',icon:'file-text',roles:{sysadmin:'唯讀',icsop_admin:'CRUD',supervisor:'唯讀',deptcontact:'唯讀'}},
    {id:'usageform',label:'使用表單管理',icon:'files',roles:{sysadmin:'唯讀',icsop_admin:'CRUD'}},
    {id:'appendix',label:'附錄管理',icon:'paperclip',roles:{sysadmin:'唯讀',icsop_admin:'CRUD'}},
    {id:'docindex',label:'文件索引管理',icon:'database',roles:{sysadmin:'唯讀',icsop_admin:'CRUD'}},
    {id:'audit',label:'文件調閱歷程',icon:'history',roles:{sysadmin:'唯讀',icsop_admin:'唯讀'}},
    {id:'changehistory',label:'文件變更歷程',icon:'git-compare',roles:{sysadmin:'唯讀',icsop_admin:'唯讀'}},
    {id:'orgsync',label:'組織人員異動管理',icon:'refresh-cw',roles:{sysadmin:'CRUD',icsop_admin:'唯讀'}},
    {id:'settings',label:'系統參數設定',icon:'settings',roles:{sysadmin:'CRUD'}}
  ];
  const CURRENT_MODULE='document';
  /* 🔵 F002 AC-D1／AC-D5（2026-08-16 delta）：側欄最上方「首頁」項。
     刻意**不放進 MENU**——它不對映任何 F025 功能鍵、不經 canPerform 過濾，
     F025 功能矩陣逐格未動、未新增「首頁」列（AC-D5 回歸鎖定）。 */
  const HOME_ITEM={id:'home',label:'首頁',icon:'layout-dashboard',route:'/admin',href:'07-admin-shell.html'};
  function renderSidebar(){
    const role=document.body.dataset.role;
    const items=MENU.filter(m=>m.roles[role]);
    // 🔵 F002 AC-D1（2026-08-16 delta）：「首頁」恆為第一項、不經 F025 角色過濾（四種管理類角色一律顯示）
    const showHome = role!=='user', homeActive = CURRENT_MODULE==='home';
    const homeHtml = showHome ? `<a href="${HOME_ITEM.href}" data-to="${HOME_ITEM.route}" title="${HOME_ITEM.label}" class="sb-item flex items-center gap-2.5 px-2.5 py-2 rounded-md text-sm ${homeActive?'bg-primary-50 text-primary-700 font-medium':'text-slate-600 hover:bg-slate-50'}"><i data-lucide="${HOME_ITEM.icon}" class="w-4 h-4 shrink-0 ${homeActive?'text-primary-600':'text-slate-400'}"></i><span class="sb-label flex-1 truncate">${HOME_ITEM.label}</span></a>` : '';
    document.getElementById('sidebarNav').innerHTML = homeHtml + (items.length? items.map(m=>{
      const active=m.id===CURRENT_MODULE, acc=m.roles[role], ro=acc!=='CRUD';
      return `<a href="#" onclick="return navTo('${m.id}','${m.label}')" title="${m.label}" class="sb-item flex items-center gap-2.5 px-2.5 py-2 rounded-md text-sm ${active?'bg-primary-50 text-primary-700 font-medium':'text-slate-600 hover:bg-slate-50'}"><i data-lucide="${m.icon}" class="w-4 h-4 shrink-0 ${active?'text-primary-600':'text-slate-400'}"></i><span class="sb-label flex-1 truncate">${m.label}</span>${ro?`<span class="sb-label text-[10px] px-1 py-0.5 rounded bg-slate-100 text-slate-500">${acc}</span>`:''}</a>`;
    }).join('') : `<div class="sb-label px-2.5 py-3 text-xs text-slate-400">此角色無後台功能權限</div>`);
    lucide.createIcons();
  }
  function navTo(id,label){ if(id==='changehistory'&&CURRENT_MODULE!=='changehistory'){location.href='23-change-history.html';return false;} shellToast(id===CURRENT_MODULE?('目前已在「'+label+'」功能區'):('導向「'+label+'」（原型本輪未含此頁）')); return false; }
  function toggleSidebar(){ document.body.classList.toggle('sb-collapsed'); }
  function openPublic(){ shellToast('已於新視窗開啟前台瀏覽頁（03-public-list）'); }
  function shellToast(msg){ if(typeof toast==='function'){toast('info',msg);} else {alert(msg);} }

  /* ===== document (ICSOP-SRC-101-1-01) ===== 編號第 2 段 SRC＝銷售及收款循環 */
  /* F040 顯示名稱純函式（全站同一實作）：有子分類 → 名稱（子分類）（全形括號、前後無空白）；無 → 名稱 */
  function normalizeSubcategory(v){ const s=(v==null?'':String(v)).trim(); return s?s:null; }
  function lifecycleDisplayName(lc){ if(!lc) return ''; const s=normalizeSubcategory(lc.subcategory); return s?`${lc.name}（${s}）`:lc.name; }
  const doc={
    uuid:'a3f81c22-9e04-4b7a-8f2d-e2c9d1748e2f', status:'有效', number:'ICSOP-SRC-101-1-01',
    company:'和潤企業股份有限公司', dept:'企劃部', section:'車輛行銷室',
    primaryChief:'陳彥廷（企劃部 車輛行銷室 室長）', secondary:['林建宏（信用審查部 企金室 室長）'],
    using:['營業二本部 / 營運管理部 / 審查室','風險管理服務本部 / 信用審查部','營業一本部 / 供應商金融部 / 北區綜合處 / 醫療一課'], edition:"26'01", lifecycle:{id:'lc1',name:'銷售及收款循環',subcategory:'消金'}, node:'進件作業',
    links:[{n:'ICSOP-SRC-101-2-00 消金審核作業',status:'有效'},{n:'ICSOP-SRC-102-1-01 車輛分期對保作業',status:'有效'}],
    date:'2026-01-01', name:'車輛分期進件作業',
    summary:'規範車輛分期案件之進件收件、資格初審與建檔流程，明確各關卡負責人與檢核事項。',
    // 附錄（F039）：陣列順序＝sortOrder 1..N，與 15 編輯畫面排定之順序、04 前台詳情完全一致
    appendices:[
      {name:'作業流程對照表.xlsx',fmt:'excel'},
      {name:'名詞定義說明.pdf',fmt:'pdf'},
      {name:'共用名詞附錄.xlsx',fmt:'excel'}
    ]
  };
  function statusPill(s){const map={'有效':['#047857','#D1FAE5'],'失效':['#B45309','#FEF3C7'],'作廢':['#B91C1C','#FEE2E2']};const [t,b]=map[s]||map['有效'];return `<span class="px-2 py-0.5 rounded-full text-xs font-medium" style="color:${t};background:${b}">${s}</span>`;}

  function row(n,label,valueHtml,note){
    return `<div class="grid grid-cols-12 gap-3 items-center py-2.5">
      <dt class="col-span-12 sm:col-span-4 text-sm text-slate-500">${label}${note?`<span class="block text-[10px] text-slate-400">${note}</span>`:''}</dt>
      <dd class="col-span-12 sm:col-span-8 text-sm text-slate-800">${valueHtml}</dd></div>`;
  }
  function renderFields(){
    const linksHtml = doc.links.map(l=>`<button onclick="jumpLink()" class="inline-flex items-center gap-1 text-primary-600 hover:underline text-sm"><i data-lucide="link" class="w-3.5 h-3.5"></i>${l.n} · ${statusPill(l.status)}</button>`).join('<br/>');
    const nodeHtml = `<span class="inline-flex items-center gap-2">${doc.node} <button onclick="jumpNode()" class="inline-flex items-center gap-1 text-primary-600 hover:underline text-xs"><i data-lucide="external-link" class="w-3.5 h-3.5"></i>跳轉檢視畫布</button></span>`;
    document.getElementById('fieldGrid').innerHTML=[
      row(1,'系統 UUID',`<span class="mono text-slate-500">${doc.uuid}</span>`,'系統產生'),
      row(2,'文件狀態',statusPill(doc.status)),
      row(3,'制定公司',doc.company),
      row(4,'制定部門',doc.dept),
      row(5,'制定室別',doc.section),
      row(6,'程序書編號',`<span class="mono">${doc.number}</span>`),
      row(7,'程序書書名',doc.name),
      row(8,'版次',`<span class="mono">${doc.edition}</span>`),
      row(9,'內容摘要',doc.summary),
      row(10,'當責室長-主要',doc.primaryChief),
      row(11,'當責室長-次要',doc.secondary.join('、')||'—'),
      row(12,'文件使用部門',doc.using.join('、')),
      row(13,'循環別',lifecycleDisplayName(doc.lifecycle)),
      row(14,'所屬節點',nodeHtml,'唯讀 · 由節點抽屜維護'),
      row(15,'連結點程序書',linksHtml||'—'),
      row(16,'公告日期',`<span class="mono">${doc.date}</span>`)
    ].join('');
    lucide.createIcons();
  }
  function renderAttach(){
    const items=[
      {ic:'file-text',c:'text-red-500',label:'檔案（ICSOP PDF）',name:'車輛分期進件作業_v1.3.pdf',wm:true},
      {ic:'file-text',c:'text-red-500',label:'OJT 實體簽到表',name:'車輛分期進件作業_OJT簽到表.pdf',wm:false},
      {ic:'sheet',c:'text-emerald-600',label:'使用表單',name:'進件申請書.xlsx',wm:false},
      {ic:'sheet',c:'text-emerald-600',label:'使用表單',name:'支票託收登記表.xlsx',wm:false}
    ];
    // 附錄（F039）：依 sortOrder 遞增列出，與前台詳情（04）順序完全一致
    doc.appendices.forEach((a,i)=>items.push({
      ic:a.fmt==='excel'?'sheet':'file-text', c:a.fmt==='excel'?'text-emerald-600':'text-red-500',
      label:'附錄', name:a.name, wm:false, ord:i+1
    }));
    document.getElementById('attachList').innerHTML=items.map(f=>`
      <div class="flex items-center gap-3 rounded-lg border border-slate-200 px-3 py-2.5"${f.ord?` data-appendix-item data-appendix-order="${f.ord}"`:''}>
        ${f.ord?`<span class="w-5 h-5 rounded-full bg-primary-100 text-primary-700 text-[10px] font-bold flex items-center justify-center shrink-0">${f.ord}</span>`:''}
        <i data-lucide="${f.ic}" class="w-5 h-5 ${f.c} shrink-0"></i>
        <div class="min-w-0 flex-1"><div class="text-xs text-slate-400">${f.label}</div><div class="text-sm text-slate-700 truncate"${f.ord?' data-appendix-name':''}>${f.name}</div></div>
        ${f.wm?'<span class="text-[10px] px-1.5 py-0.5 rounded bg-primary-50 text-primary-700">下載燒錄浮水印</span>':''}
        <button onclick="download('${f.name}','${f.label}')" class="inline-flex items-center gap-1 px-2.5 py-1.5 rounded border border-slate-300 text-xs hover:bg-slate-50 shrink-0"><i data-lucide="download" class="w-3.5 h-3.5"></i>下載</button>
      </div>`).join('')
      + (doc.appendices.length?'':`<div data-appendix-empty class="flex items-center gap-2 rounded-lg border border-dashed border-slate-200 px-3 py-2.5 text-sm text-slate-400"><i data-lucide="paperclip" class="w-4 h-4 shrink-0"></i>無附錄</div>`);
    lucide.createIcons();
  }
  // 附錄下載：後台管理端存取，不燒錄浮水印（F039 已定案）、不寫前台調閱稽核
  function download(n,kind){
    if(kind==='附錄'){toast('success','下載附錄「'+n+'」（不燒錄浮水印；後台管理端存取不寫調閱稽核）');return;}
    toast('success','下載「'+n+'」（伺服器端已燒錄浮水印並寫入稽核 DOWNLOAD）');
  }
  function jumpNode(){shellToast('跳轉至 DAG 畫布檢視所屬節點（11 / 12）');}
  function jumpLink(){shellToast('跳轉至連結目標文件詳情');}
  function gotoEdit(){shellToast('前往編輯頁（15-document-edit）');}

  function setRole(r){
    document.body.dataset.role=r;
    const blocked=(r==='user');
    const admin=(r==='icsop_admin');
    const ro=(r==='supervisor'||r==='deptcontact'||r==='sysadmin');
    document.getElementById('blockOverlay').classList.toggle('hidden',!blocked);
    document.getElementById('roBanner').classList.toggle('hidden',!ro);
    document.getElementById('roBanner').classList.toggle('flex',ro);
    document.getElementById('adminNote').classList.toggle('hidden',!admin);
    document.getElementById('adminNote').classList.toggle('flex',admin);
    document.getElementById('editEntry').classList.toggle('hidden',!admin);
    document.getElementById('userName').textContent = admin?'陳管理':(r==='deptcontact'?'李窗口':'王主管');
    if(blocked)document.getElementById('blockMsg').textContent={user:'一般使用者無後台存取權（前台可瀏覽有效文件）。'}[r];
    renderSidebar(); lucide.createIcons();
  }

  function toast(type,msg,code){
    const map={success:['check-circle-2','#059669'],error:['alert-circle','#DC2626'],info:['info','#365C97']};
    const [ic,color]=map[type]||map.info;
    const el=document.createElement('div');
    el.className='flex items-start gap-2 bg-white border border-slate-200 shadow-lg rounded-lg px-4 py-3 text-sm max-w-sm';
    el.style.borderLeft='4px solid '+color;
    el.innerHTML=`<i data-lucide="${ic}" class="w-4 h-4 mt-0.5" style="color:${color}"></i><div><span class="text-slate-700">${msg}</span>${code?`<div class="text-[10px] mono text-slate-400 mt-0.5">${code}</div>`:''}</div>`;
    document.getElementById('toastWrap').appendChild(el);lucide.createIcons();
    setTimeout(()=>{el.style.transition='opacity .3s';el.style.opacity='0';setTimeout(()=>el.remove(),300);},4200);
  }

  // init
  renderFields(); renderAttach(); setRole('supervisor'); lucide.createIcons();
</script>
</body>
</html>
