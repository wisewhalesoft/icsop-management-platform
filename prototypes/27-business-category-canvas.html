     之版面、結構、文案與互動（節點卡片、底部連線圓點、拖曳、mini-map、縮放、提示卡、角色分流）。
     規格權威＝docs/specs/features/F043-business-function-category.md（§乙 AC-15～AC-19、AC-45／AC-46）。

     🔒 11 一字不改（AC-49）；本頁為**平行第二套**結構。
     🔴 **刻意使用專屬錯誤碼**（AC-16，理由不得刪）：BUSINESS_CATEGORY_SELF_LOOP／BUSINESS_CATEGORY_CYCLE_DETECTED，
        **不沿用** DAG_SELF_LOOP／DAG_CYCLE_DETECTED——那兩碼之使用者可見訊息為「此連線會造成**循環結構**成環」，
        而「循環」在本系統是**已被佔用的專有名詞**（LIFECYCLE）；沿用會讓本畫布宣稱使用者破壞了一個他根本
        沒在編輯的東西。⚠ 本頁之成環訊息因此**不得出現「循環」二字**。
     🔒 連線樣式＝**直角（orthogonal / elbow / step）箭頭**，與 11／22／23／29 全系統一致（非曲線，AC-15）。
     🔒 AC-18 逐字：刪除已掛載 N ≥ 1 份文件之節點時，提示**逐字含** `刪除後將一併移除 {N} 筆掛載關係` 並二次確認。
     🔒 AC-19：頁首標題＝businessCategoryDisplayName 之輸出（`授信（消金） · DAG 畫布`／無子分類則 `風險管理 · DAG 畫布`）。
     📌 與 11 之差異（僅此一項，屬導覽而非行為）：本頁吃 `?businessCategoryId=`（26 之列與「新增」後皆帶入），
        11 因 11 本身不吃參數而由 10 以 toast 代替。 -->

<script>
  /* ===== admin shell sidebar ===== */
  const MENU=[
    {id:'account',label:'帳號管理',icon:'users',roles:{sysadmin:'CRUD',icsop_admin:'唯讀'}},
    /* 🔴 2026-09-02 人類裁決（F025 delta）：「循環管理」自主管權限**移除**（唯讀 → 無）。
       權威＝backend/src/rbac/function-matrix.ts 之 LIFECYCLE_MANAGEMENT（主管＝NONE）；本檔先前落後於已上線程式碼。
       表達方式＝**移除 supervisor 鍵**（比照 settings 等主管無權項之既有寫法；renderSidebar 以 m.roles[role] 過濾）。
       📝 已作廢（僅供追溯，⚠ 不得復原）：OLD> supervisor:'唯讀'
       🔴 與下一項「業務/功能類別管理」（supervisor:'唯讀'）**刻意不同**——同日兩項裁決，一移出一放進（F025 `AC-B29`）；
          主管側欄自此**看得到「業務/功能類別管理」、看不到「循環管理」**，這個不對稱即該斷言之視覺權威。 */
    {id:'lifecycle',label:'循環管理',icon:'workflow',roles:{sysadmin:'唯讀',icsop_admin:'CRUD'}},
    /* 🔵 2026-09-02 F043 AC-43／人類裁決：新側選單項，**置於「循環管理」之後、「ICSOP 文件管理」之前**。 */
    {id:'businesscategory',label:'業務/功能類別管理',icon:'shapes',roles:{sysadmin:'唯讀',icsop_admin:'CRUD',supervisor:'唯讀'}},
    {id:'document',label:'ICSOP 文件管理',icon:'file-text',roles:{sysadmin:'唯讀',icsop_admin:'CRUD',supervisor:'唯讀',deptcontact:'唯讀'}},
    {id:'usageform',label:'使用表單管理',icon:'files',roles:{sysadmin:'唯讀',icsop_admin:'CRUD'}},
    {id:'appendix',label:'附錄管理',icon:'paperclip',roles:{sysadmin:'唯讀',icsop_admin:'CRUD'}},
    {id:'docindex',label:'文件索引管理',icon:'database',roles:{sysadmin:'唯讀',icsop_admin:'CRUD'}},
    /* 🟢 2026-08-28 F042 AC-27／OQ-E11-05=(A)：新功能列與側選單項（位置＝可寫管理群組之末，docindex 之後）。 */
    {id:'ojtprogress',label:'OJT 進度管理',icon:'graduation-cap',roles:{sysadmin:'唯讀',icsop_admin:'CRUD',supervisor:'受限CRUD',deptcontact:'受限CRUD'}},
    {id:'audit',label:'文件調閱歷程',icon:'history',roles:{sysadmin:'唯讀',icsop_admin:'唯讀'}},
    {id:'changehistory',label:'文件變更歷程',icon:'git-compare',roles:{sysadmin:'唯讀',icsop_admin:'唯讀'}},
    {id:'orgsync',label:'組織人員異動管理',icon:'refresh-cw',roles:{sysadmin:'CRUD',icsop_admin:'唯讀'}},
    {id:'settings',label:'系統參數設定',icon:'settings',roles:{sysadmin:'CRUD'}}
  ];
  const CURRENT_MODULE='businesscategory';
  /* 🔵 F002 AC-D1／AC-D5（2026-08-16 delta）：側欄最上方「首頁」項。
     刻意**不放進 MENU**——它不對映任何 F025 功能鍵、不經 canPerform 過濾，
     F025 功能矩陣逐格未動、未新增「首頁」列（AC-D5 回歸鎖定）。 */
  const HOME_ITEM={id:'home',label:'首頁',icon:'layout-dashboard',route:'/admin',href:'07-admin-shell.html'};
  function renderSidebar(){
    const role=document.body.dataset.role;
    const items=MENU.filter(m=>m.roles[role]);
    // 🔵 F002 AC-D1（2026-08-16 delta）：「首頁」恆為第一項、不經 F025 角色過濾（四種管理類角色一律顯示）
    const showHome = role!=='user', homeActive = CURRENT_MODULE==='home';
    const homeHtml = showHome ? `<a href="${HOME_ITEM.href}" data-to="${HOME_ITEM.route}" title="${HOME_ITEM.label}" class="sb-item flex items-center gap-2.5 px-2.5 py-2 rounded-md text-sm ${homeActive?'bg-primary-50 text-primary-700 font-medium':'text-slate-600 hover:bg-slate-50'}"><i data-lucide="${HOME_ITEM.icon}" class="w-4 h-4 shrink-0 ${homeActive?'text-primary-600':'text-slate-400'}"></i><span class="sb-label flex-1 truncate">${HOME_ITEM.label}</span></a>` : '';
    document.getElementById('sidebarNav').innerHTML = homeHtml + (items.length? items.map(m=>{
      const active=m.id===CURRENT_MODULE, acc=m.roles[role], ro=acc!=='CRUD';
      return `<a href="#" onclick="return navTo('${m.id}','${m.label}')" title="${m.label}" class="sb-item flex items-center gap-2.5 px-2.5 py-2 rounded-md text-sm ${active?'bg-primary-50 text-primary-700 font-medium':'text-slate-600 hover:bg-slate-50'}"><i data-lucide="${m.icon}" class="w-4 h-4 shrink-0 ${active?'text-primary-600':'text-slate-400'}"></i><span class="sb-label flex-1 truncate">${m.label}</span>${ro?`<span class="sb-label text-[10px] px-1 py-0.5 rounded bg-slate-100 text-slate-500">${acc}</span>`:''}</a>`;
    }).join('') : `<div class="sb-label px-2.5 py-3 text-xs text-slate-400">此角色無後台功能權限</div>`);
    lucide.createIcons();
  }
  function navTo(id,label){ if(id==='changehistory'&&CURRENT_MODULE!=='changehistory'){location.href='23-change-history.html';return false;} shellToast(id===CURRENT_MODULE?('目前已在「'+label+'」功能區'):('導向「'+label+'」（原型本輪未含此頁）')); return false; }
  function toggleSidebar(){ document.body.classList.toggle('sb-collapsed'); }
  function openPublic(){ shellToast('已於新視窗開啟前台瀏覽頁（03-public-list）'); }
  function shellToast(msg){ if(typeof toast==='function'){toast('info',msg);} else {alert(msg);} }

  /* ===== 顯示名稱純函式（全站同一實作；規則與 F040 lifecycleDisplayName 逐字相同，F043 AC-06）===== */
  function normalizeSubcategory(v){ const s=(v==null?'':String(v)).trim(); return s?s:null; }
  function businessCategoryDisplayName(bc){ if(!bc) return ''; const s=normalizeSubcategory(bc.subcategory); return s?`${bc.name}（${s}）`:bc.name; }

  const NODE_W=164, NODE_H=64;
  /* ===== 各業務/功能類別之節點與邊（🔒 與 26／28／29／30／13 之語料逐筆一致）=====
     ⚠ 掛載為 M:N：docs 陣列可在**不同類別、不同節點**重複出現同一個程序書編號，這是本功能的存在理由。
       · ICSOP-SRC-101-1-01 掛在 bc1 的 p2 與 p4（同類別兩節點）＋ bc2 q3 ＋ bc3 r4 ＋ bc6 u1
         ⇒ 5 筆掛載列、**4 個相異類別**（13 第 16 欄之去重語料，F017 AC-B3）
       · ICSOP-GCA-100-2-00 掛在 bc1／bc2／bc3／bc4 四個相異類別 ⇒ 第 16 欄 `+3` 之長尾語料 */
  const CATS={
    bc1:{name:'授信',subcategory:'消金',status:'active',
      nodes:[
        {id:'p1',name:'授信政策與額度管理',x:568,y:30, docs:['ICSOP-SRC-101-2-00']},
        {id:'p2',name:'徵信調查作業',      x:360,y:166,docs:['ICSOP-SRC-101-1-01']},
        {id:'p3',name:'擔保品管理作業',    x:776,y:166,docs:['ICSOP-GCA-100-2-00']},
        {id:'p4',name:'授信審核作業',      x:568,y:302,docs:['ICSOP-SRC-103-1-01','ICSOP-SRC-101-1-01']},
        {id:'p5',name:'撥貸與帳務作業',    x:568,y:438,docs:['ICSOP-PUC-101-1-01']}
      ],
      edges:[{id:'ep1',s:'p1',t:'p2'},{id:'ep2',s:'p1',t:'p3'},{id:'ep3',s:'p2',t:'p4'},{id:'ep4',s:'p3',t:'p4'},{id:'ep5',s:'p4',t:'p5'}]},
    bc2:{name:'授信',subcategory:'企金',status:'active',
      nodes:[
        {id:'q1',name:'企金授信受理作業',x:568,y:30, docs:['ICSOP-SRC-103-1-01']},
        {id:'q2',name:'企業徵信作業',    x:360,y:166,docs:['ICSOP-GCA-100-2-00']},
        {id:'q3',name:'授信核決作業',    x:776,y:166,docs:['ICSOP-SRC-101-1-01']},
        {id:'q4',name:'額度撥貸作業',    x:568,y:302,docs:[]}
      ],
      edges:[{id:'eq1',s:'q1',t:'q2'},{id:'eq2',s:'q1',t:'q3'},{id:'eq3',s:'q2',t:'q4'},{id:'eq4',s:'q3',t:'q4'}]},
    bc3:{name:'風險管理',subcategory:null,status:'active',
      nodes:[
        {id:'r1',name:'風險辨識作業',x:568,y:30, docs:['ICSOP-CIPS-104-1-01']},
        {id:'r2',name:'風險評估作業',x:360,y:166,docs:['ICSOP-FC-101-1-00']},
        {id:'r3',name:'風險監控作業',x:568,y:302,docs:['ICSOP-GCA-100-2-00']},
        {id:'r4',name:'風險報告作業',x:568,y:438,docs:['ICSOP-SRC-101-1-01']}
      ],
      edges:[{id:'er1',s:'r1',t:'r2'},{id:'er2',s:'r2',t:'r3'},{id:'er3',s:'r1',t:'r3'},{id:'er4',s:'r3',t:'r4'}]},
    bc4:{name:'帳務處理',subcategory:'子公司',status:'active',
      nodes:[
        {id:'s1',name:'子公司帳務結算作業',x:568,y:30, docs:['ICSOP-PUC-101-1-01']},
        {id:'s2',name:'子公司入帳覆核作業',x:568,y:166,docs:['ICSOP-IC-102-1-00','ICSOP-GCA-100-2-00']},
        {id:'s3',name:'子公司報表產出作業',x:568,y:302,docs:[]}
      ],
      edges:[{id:'es1',s:'s1',t:'s2'},{id:'es2',s:'s2',t:'s3'}]},
    bc5:{name:'帳務處理',subcategory:'消金',status:'inactive',
      nodes:[
        {id:'t1',name:'消金帳務結算作業',x:568,y:30, docs:[]},
        {id:'t2',name:'消金帳務覆核作業',x:568,y:166,docs:[]}
      ],
      edges:[{id:'et1',s:'t1',t:'t2'}]},
    bc6:{name:'授信',subcategory:'子公司',status:'inactive',
      nodes:[
        {id:'u1',name:'子公司授信受理作業',x:568,y:30, docs:['ICSOP-SRC-101-1-01']},
        {id:'u2',name:'子公司授信核決作業',x:568,y:166,docs:[]}
      ],
      edges:[{id:'eu1',s:'u1',t:'u2'}]}
  };
  const DEFAULT_ID='bc1';
  const qId=new URLSearchParams(location.search).get('businessCategoryId')||DEFAULT_ID;
  const CUR_ID=CATS[qId]?qId:DEFAULT_ID;
  const CUR=CATS[CUR_ID];
  // AC-19：頁首標題＝businessCategoryDisplayName 之輸出（無子分類者不含括號）
  document.querySelector('[data-business-category-title]').textContent=businessCategoryDisplayName(CUR)+' · DAG 畫布';
  document.title=businessCategoryDisplayName(CUR)+' DAG 畫布 · 後台';

  let seq=100;
  let nodes=CUR.nodes.map(n=>({...n,docs:[...n.docs]}));
  let edges=CUR.edges.map(e=>({...e}));
  let selected=null, zoom=1;
  const world=document.getElementById('world'), svg=document.getElementById('edges');

  function nodeById(id){return nodes.find(n=>n.id===id);}
  function reachable(from,to){ // path from->...->to following edges s->t
    const seen=new Set(); const stack=[from];
    while(stack.length){const cur=stack.pop(); if(cur===to) return true;
      edges.filter(e=>e.s===cur).forEach(e=>{if(!seen.has(e.t)){seen.add(e.t);stack.push(e.t);}});}
    return false;
  }

  function renderNodes(){
    // remove old node divs
    world.querySelectorAll('.node').forEach(n=>n.remove());
    nodes.forEach(n=>{
      const el=document.createElement('div');
      el.className='node'+(selected===n.id?' selected':'')+(n.docs.length?' has-docs':'')+(!n.name?' unnamed':'');
      el.style.left=n.x+'px'; el.style.top=n.y+'px'; el.dataset.id=n.id;
      el.innerHTML=`
        <div class="body p-2.5 relative">
          <div class="drag-handle flex items-center gap-1.5">
            <i data-lucide="circle-dot" class="w-3.5 h-3.5 text-slate-300"></i>
            <span class="font-medium text-slate-800 text-sm truncate">${n.name||'未命名節點'}</span>
          </div>
          <div class="mt-1.5 flex items-center gap-1 text-[11px] ${n.docs.length?'text-emerald-600':'text-slate-400'}">
            <i data-lucide="${n.docs.length?'file-check-2':'file-x-2'}" class="w-3.5 h-3.5"></i>
            ${n.docs.length? '掛載 '+n.docs.length+' 份文件' : '尚未掛載文件'}
          </div>
          <div class="connector" data-node="${n.id}" title="拖曳以建立連線"></div>
        </div>`;
      world.appendChild(el);
    });
    bindNodeEvents();
    lucide.createIcons();
  }

  // 直角 elbow（垂直→水平→垂直），全站 DAG 一致（比照 11/22/23/29；AC-15）
  function edgePath(s,t){
    const sx=s.x+NODE_W/2, sy=s.y+NODE_H, tx=t.x+NODE_W/2, ty=t.y;
    const my=sy+(ty-sy)/2;
    return `M ${sx} ${sy} L ${sx} ${my} L ${tx} ${my} L ${tx} ${ty}`;
  }
  function renderEdges(){
    // clear all path except temp/defs
    [...svg.querySelectorAll('path.edge')].forEach(p=>p.remove());
    edges.forEach(e=>{
      const s=nodeById(e.s),t=nodeById(e.t); if(!s||!t)return;
      const p=document.createElementNS('http://www.w3.org/2000/svg','path');
      p.setAttribute('class','edge'); p.setAttribute('d',edgePath(s,t));
      p.setAttribute('fill','none'); p.setAttribute('stroke','#94A3B8'); p.setAttribute('stroke-width','2');
      p.setAttribute('marker-end','url(#arrow)');
      svg.appendChild(p);
    });
  }

  function renderMini(){
    const mm=document.getElementById('minimap'); const W=1300,H=820, mw=150,mh=96;
    const sx=mw/W, sy=mh/H;
    let s='';
    edges.forEach(e=>{const a=nodeById(e.s),b=nodeById(e.t);if(!a||!b)return;
      s+=`<line x1="${(a.x+NODE_W/2)*sx}" y1="${(a.y+NODE_H)*sy}" x2="${(b.x+NODE_W/2)*sx}" y2="${b.y*sy}" stroke="#CBD5E1" stroke-width="1"/>`;});
    nodes.forEach(n=>{const c=n.docs.length?'#059669':'#94A3B8';
      s+=`<rect x="${n.x*sx}" y="${n.y*sy}" width="${NODE_W*sx}" height="${NODE_H*sy}" rx="2" fill="${c}" opacity="${selected===n.id?1:.55}"/>`;});
    mm.innerHTML=s;
  }

  function renderAll(){renderEdges();renderNodes();renderMini();}

  /* ---- drag node & create edge ---- */
  let drag=null, edgeDrag=null;
  const isAdmin=()=>document.body.dataset.role==='icsop_admin';

  function worldPoint(clientX,clientY){
    const r=world.getBoundingClientRect();
    return {x:(clientX-r.left)/zoom, y:(clientY-r.top)/zoom};
  }

  function bindNodeEvents(){
    world.querySelectorAll('.node').forEach(el=>{
      const id=el.dataset.id;
      el.addEventListener('mousedown',ev=>{
        if(ev.target.classList.contains('connector')) return; // handled below
        select(id);
        if(!isAdmin()) return;
        const n=nodeById(id); const p=worldPoint(ev.clientX,ev.clientY);
        drag={id, offx:p.x-n.x, offy:p.y-n.y};
        ev.preventDefault();
      });
      const c=el.querySelector('.connector');
      if(c) c.addEventListener('mousedown',ev=>{
        if(!isAdmin())return;
        ev.stopPropagation(); ev.preventDefault();
        edgeDrag={source:id};
      });
    });
  }

  document.addEventListener('mousemove',ev=>{
    if(drag){
      const p=worldPoint(ev.clientX,ev.clientY); const n=nodeById(drag.id);
      n.x=Math.max(0,Math.min(1300-NODE_W, p.x-drag.offx));
      n.y=Math.max(0,Math.min(820-NODE_H, p.y-drag.offy));
      // update just this node position + edges + mini
      const el=world.querySelector(`.node[data-id="${drag.id}"]`); el.style.left=n.x+'px'; el.style.top=n.y+'px';
      renderEdges(); renderMini();
    } else if(edgeDrag){
      const s=nodeById(edgeDrag.source); const p=worldPoint(ev.clientX,ev.clientY);
      const sx=s.x+NODE_W/2, sy=s.y+NODE_H;
      const tp=document.getElementById('tempEdge');
      const my=sy+(p.y-sy)/2; // 拖曳中的暫時連線亦為直角 elbow
      tp.style.display=''; tp.setAttribute('d',`M ${sx} ${sy} L ${sx} ${my} L ${p.x} ${my} L ${p.x} ${p.y}`);
    }
  });

  document.addEventListener('mouseup',ev=>{
    if(edgeDrag){
      document.getElementById('tempEdge').style.display='none';
      const targetEl=ev.target.closest('.node');
      if(targetEl){ attemptEdge(edgeDrag.source, targetEl.dataset.id); }
      edgeDrag=null;
    }
    if(drag){drag=null;}
  });

  /* AC-16／AC-17：前端即時基本防環提示 → **後端於交易內權威驗證**（本原型僅示意前端側）。
     🔴 訊息**刻意不含「循環」二字**——見檔頭；錯誤碼亦為本功能專屬。 */
  function attemptEdge(s,t){
    if(s===t){ toast('error','節點不可連向自己','BUSINESS_CATEGORY_SELF_LOOP'); return; }
    if(edges.some(e=>e.s===s&&e.t===t)){ toast('info','此連線已存在'); return; }
    // adding s->t creates cycle if t can already reach s
    if(reachable(t,s)){ toast('error','此連線會使本業務/功能類別的結構成環，請重新確認方向','BUSINESS_CATEGORY_CYCLE_DETECTED'); return; }
    edges.push({id:'e'+(++seq), s, t});
    renderAll();
    toast('success','已建立連線：'+(nodeById(s).name)+' → '+(nodeById(t).name));
  }

  /* ---- node ops ---- */
  function addNode(){
    if(!isAdmin())return;
    const id='n'+(++seq);
    nodes.push({id, name:'', x:80+Math.random()*120, y:60+Math.random()*80, docs:[]});
    renderAll(); select(id);
    toast('success','已新增未命名節點，可拖曳調整位置');
  }
  function select(id){
    selected=id;
    world.querySelectorAll('.node').forEach(el=>el.classList.toggle('selected',el.dataset.id===id));
    const del=document.getElementById('delBtn');
    if(isAdmin()){del.disabled=false;del.classList.remove('text-slate-400','cursor-not-allowed');del.classList.add('text-slate-700','hover:bg-slate-50');}
    renderMini();
  }
  /* 🔒 AC-18 逐字：N ≥ 1 時提示**逐字含** `刪除後將一併移除 N 筆掛載關係`；確認後於同一交易內刪除
     節點、其全部相關邊、其全部 BUSINESS_CATEGORY_DOC 列；取消則一筆未動。
     ⚠ 此處之 N ＝ **本節點之掛載列數**（非相異文件數）——被刪掉的是「掛載關係」這些列。 */
  function deleteSelected(){
    if(!isAdmin()||!selected)return;
    const n=nodeById(selected);
    const cnt=n.docs.length;
    openConfirm('刪除節點「'+(n.name||'未命名節點')+'」？',
      cnt? `刪除後將一併移除 ${cnt} 筆掛載關係，且相關連線會被移除。被解除掛載之程序書本身不受影響（不刪除、不改狀態、其循環節點掛載一格不動）。` : '刪除後相關連線將一併移除。',
      ()=>{ nodes=nodes.filter(x=>x.id!==selected); edges=edges.filter(e=>e.s!==selected&&e.t!==selected); selected=null; document.getElementById('delBtn').disabled=true; renderAll(); toast('success','節點已刪除'); });
  }
  function save(){ if(!isAdmin())return; toast('success','DAG 已儲存（節點座標與連線已持久化）'); }

  /* ---- zoom ---- */
  function applyZoom(){world.style.transform='scale('+zoom+')';document.getElementById('zoomLabel').textContent=Math.round(zoom*100)+'%';}
  function zoomBy(d){zoom=Math.max(0.5,Math.min(1.6,+(zoom+d).toFixed(2)));applyZoom();}
  function fitView(){zoom=1;applyZoom();document.getElementById('viewport').scrollTo({left:120,top:0,behavior:'smooth'});}

  /* ---- role ---- */
  function setRole(r){
    document.body.dataset.role=r;
    const blocked=(r==='deptcontact'||r==='user');
    const ro=(r==='supervisor'||r==='sysadmin');
    document.getElementById('blockOverlay').classList.toggle('hidden',!blocked);
    document.getElementById('roBanner').classList.toggle('hidden',!ro);
    document.getElementById('roBanner').classList.toggle('flex',ro);
    if(blocked){
      const msg={
                 deptcontact:'部門窗口對「業務/功能類別管理」為「無」，無法存取此頁。',
                 user:'一般使用者無後台存取權。'}[r];
      document.getElementById('blockMsg').textContent=msg;
    }
    renderSidebar();
    lucide.createIcons();
  }

  /* ---- confirm & toast ---- */
  function openConfirm(title,body,onOk){document.getElementById('cfTitle').textContent=title;document.getElementById('cfBody').textContent=body;
    const m=document.getElementById('confirmModal');m.classList.remove('hidden');m.classList.add('flex');
    const ok=document.getElementById('cfOk');const clone=ok.cloneNode(true);ok.parentNode.replaceChild(clone,ok);
    clone.addEventListener('click',()=>{closeConfirm();onOk();});}
  function closeConfirm(){const m=document.getElementById('confirmModal');m.classList.add('hidden');m.classList.remove('flex');}

  function toast(type,msg,code){
    const map={success:['check-circle-2','#059669'],error:['alert-circle','#DC2626'],info:['info','#365C97']};
    const [ic,color]=map[type]||map.info;
    const el=document.createElement('div');
    el.className='flex items-start gap-2 bg-white border border-slate-200 shadow-lg rounded-lg px-4 py-3 text-sm max-w-sm';
    el.style.borderLeft='4px solid '+color;
    el.innerHTML=`<i data-lucide="${ic}" class="w-4 h-4 mt-0.5" style="color:${color}"></i><div><span class="text-slate-700">${msg}</span>${code?`<div class="text-[10px] mono text-slate-400 mt-0.5">${code}</div>`:''}</div>`;
    document.getElementById('toastWrap').appendChild(el);lucide.createIcons();
    setTimeout(()=>{el.style.transition='opacity .3s';el.style.opacity='0';setTimeout(()=>el.remove(),300);},4200);
  }
  document.addEventListener('keydown',e=>{if(e.key==='Escape')closeConfirm();});

  applyZoom(); renderAll(); renderSidebar();
</script>
</body>
</html>
