    const k=document.getElementById('qKind').value;
    const p=document.getElementById('qPerson').value.trim().toLowerCase();
    const d=document.getElementById('qDoc').value.trim().toLowerCase();
    const from=document.getElementById('qFrom').value, to=document.getElementById('qTo').value;
    let rows=scopeRecords().filter(r=>{
      if(k && r.kind!==k) return false;
      if(p && !((r.name.toLowerCase().includes(p))||(r.emp.toLowerCase().includes(p)))) return false;
      if(d && !((r.num.toLowerCase().includes(d))||(r.doc.toLowerCase().includes(d)))) return false;
      if(from && r.time.slice(0,10) < from) return false;
      if(to && r.time.slice(0,10) > to) return false;
      return true;
    });
    rows.sort((a,b)=> a.time<b.time?1:a.time>b.time?-1:0);
    renderRows(rows);
  }
  function clearQuery(){ ['qKind','qPerson','qDoc','qFrom','qTo'].forEach(id=>document.getElementById(id).value=''); document.getElementById('defaultNote').classList.add('hidden'); expandedIdx=-1; renderRows(scopeRecords().slice().sort((a,b)=>a.time<b.time?1:-1)); }
  function doExport(){ if(['deptcontact','user'].includes(document.body.dataset.role))return; toast('success','已匯出查詢結果（CSV，草案格式）'); }

  function setRole(r){
    document.body.dataset.role=r;
    const blocked=(r==='deptcontact'||r==='user'||r==='supervisor');
    document.getElementById('blockOverlay').classList.toggle('hidden',!blocked);
    if(blocked) document.getElementById('blockMsg').textContent={supervisor:'主管對「文件調閱歷程查詢」為「無」，無法存取。',deptcontact:'部門窗口對「文件調閱歷程查詢」為「無」，無法存取。',user:'一般使用者無後台存取權。'}[r];
    // scope note
    const note=document.getElementById('scopeNote');
    if(!blocked){ note.className='mb-4 flex items-start gap-2 rounded-lg px-3 py-2 text-sm border bg-primary-50 border-primary-100 text-primary-700';
      note.innerHTML='<i data-lucide="globe" class="w-4 h-4 mt-0.5"></i><span>查詢範圍：<b>全公司</b>（系統管理員 / ICSOP 管理員）。</span>'; }
    document.getElementById('topUser').textContent={sysadmin:'黃俊傑',icsop_admin:'李慧玲',supervisor:'陳彥廷',deptcontact:'林建宏',user:'王小明'}[r];
    if(!blocked){ expandedIdx=-1; renderRows(scopeRecords().slice().sort((a,b)=>a.time<b.time?1:-1)); }
    renderSidebar();
    lucide.createIcons();
  }

  function toast(type,msg,code){
    const map={success:['check-circle-2','#059669'],error:['alert-circle','#DC2626'],info:['info','#365C97']};
    const [ic,color]=map[type]||map.info;
    const el=document.createElement('div');
    el.className='flex items-start gap-2 bg-white border border-slate-200 shadow-lg rounded-lg px-4 py-3 text-sm max-w-sm';
    el.style.borderLeft='4px solid '+color;
    el.innerHTML=`<i data-lucide="${ic}" class="w-4 h-4 mt-0.5" style="color:${color}"></i><div><span class="text-slate-700">${msg}</span>${code?`<div class="text-[10px] mono text-slate-400 mt-0.5">${code}</div>`:''}</div>`;
    document.getElementById('toastWrap').appendChild(el);lucide.createIcons();
    setTimeout(()=>{el.style.transition='opacity .3s';el.style.opacity='0';setTimeout(()=>el.remove(),300);},4200);
  }

  // safelist dynamic pill colors: bg-slate-50 text-slate-700 border-slate-100 bg-blue-50 text-blue-700 border-blue-100 bg-violet-50 text-violet-700 border-violet-100 bg-emerald-50 text-emerald-700 border-emerald-100 bg-amber-50 text-amber-700 border-amber-100
  setRole('sysadmin');
</script>
</body>
</html>
