<!DOCTYPE html>
<!-- 🔵 2026-09-22 UX16 delta（項 1／2／3）——規格權威＝docs/specs/features/F002-role-based-routing.md §UX16 delta
     （AC-UX1～AC-UX6；裁決＝docs/specs/open-questions.md#ux16-2026-09-22，OQ-UX16-01～04，🟢 全數 APPROVED）。

     ① 項 1（AC-UX1）前台卡片：標題逐字 `ICSOP 文件`、說明逐字 `作業程序書瀏覽、搜尋、下載、列印`。
        🔒 說明字串**末尾無句號**（使用者原文即無）；🔒 卡內行動文字 `前往前台` 一字不改。
        📝 已作廢（⚠ 不得復原、不得用於斷言）：
           OLD> 標題 `前台瀏覽`
           OLD> 說明 `以您的身分與部門瀏覽、搜尋、下載、列印 ICSOP 文件（含浮水印）。`
        📌 範圍逐字限於本卡片：前台清單頁 header 之 `ICSOP 文件瀏覽`（03-public-list）**不動**，
           🔒 兩處字樣自此並存且刻意不同（入口的名字 vs 那一頁的名字）。

     ② 項 2（AC-UX2）後台卡片：標題逐字 `管理平台`、說明逐字 `儀表板、OJT進度、相關維護作業(依權限顯示)`
        ——**四種角色所見之說明文字完全相同**。🔒 括號為半形 `(` `)`、`OJT進度` 中間無空白、末尾無句號。
        🔴 **逐角色說明之查表機制整個刪除**（本檔為 ROLE_META 各列之 `admin` 欄與 setRole() 之寫入點），
           改為單一常數 ADMIN_CARD_DESC。🔒 卡內行動文字 `進入後台` 一字不改。
        📝 已作廢（⚠ 不得復原、不得用於斷言）——本檔原有之四段逐角色說明：
           OLD> SysAdmin    `帳號/角色管理、組織同步、系統參數、調閱歷程（依權限顯示）。`
           OLD> ICSOPAdmin  `維護循環 DAG、ICSOP 文件、使用表單、附錄、調閱歷程（依權限顯示）。`
           OLD> Supervisor  `循環／ICSOP 文件全公司唯讀（無使用表單管理、附錄管理與調閱歷程）。`
           OLD> DeptContact `ICSOP 文件唯讀檢視。`
           OLD> 卡片內預設說明 `維護循環 DAG、ICSOP 文件、帳號權限、組織同步與調閱歷程（依權限顯示）。`
        🔒 **`管理平台` 與 `ICSOP 管理後台` 兩個名字並存是刻意的**（AC-UX3）：卡片上的是**分流頁上的入口名稱**，
           後台各頁麵包屑首段的 `ICSOP 管理後台` 是**後台導覽樹的根節點名稱**——🔴 不得順手統一（那會推翻 AC-D6／AC-D7）。

     ③ 項 3（AC-UX4）兩張卡片左右對調：DOM 順序＝管理平台（左）→ ICSOP 文件（右）。
        📝 已作廢（⚠ 不得復原）：OLD> DOM 順序＝前台瀏覽卡片在前、管理後台卡片在後。
        🔴 明文禁止以 CSS `order`／`flex-direction: row-reverse` 達成——那會讓 DOM 順序與視覺順序分歧。

     ④ AC-UX5 ①：兩張卡片各自帶 `aria-label`，其值逐字等於該卡之標題（`管理平台`／`ICSOP 文件`）。
        🔴 理由（非美化）：本頁 header 之可見文字為 `ICSOP 文件管理平台`，它**同時包含**兩個標題字串
           ⇒ 任何以 getByText／正規表示式為基礎之定位在本頁結構上失去鑑別力。 -->
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>登入後導向 · ICSOP 文件管理平台</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = { theme: { extend: {
    fontFamily: { sans: ['Inter','Noto Sans TC','sans-serif'] },
    colors: { primary: { 50:'#F3F7FC',100:'#EAF1FA',200:'#CFDFF3',300:'#98B6E4',400:'#6E96D4',500:'#4A72AE',600:'#365C97',700:'#2A4A7E' } }
  }}}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono&display=swap" rel="stylesheet" />
<script src="https://unpkg.com/lucide@latest"></script>
<style>
  body{font-family:'Inter','Noto Sans TC',sans-serif;background:#FFFFFF;color:#334155;}
  .mono{font-family:'JetBrains Mono',monospace;}
</style>
</head>
<body class="min-h-screen flex flex-col">

<!-- Top bar -->
<header class="sticky top-0 z-30 bg-white border-b border-slate-200">
  <div class="max-w-4xl mx-auto px-4 h-14 flex items-center gap-3">
    <div class="w-8 h-8 rounded-lg bg-primary-600 flex items-center justify-center text-white shrink-0"><i data-lucide="file-text" class="w-5 h-5"></i></div>
    <span class="font-bold text-slate-900 truncate">ICSOP 文件管理平台</span>
    <div class="ml-auto flex items-center gap-2">
      <!-- role simulator -->
      <div class="flex items-center gap-1.5">
        <i data-lucide="users" class="w-4 h-4 text-slate-400"></i>
        <select id="roleSel" onchange="setRole(this.value)" class="text-sm border border-slate-300 rounded-md px-2 py-1.5 bg-white focus:outline-none focus:ring-2 focus:ring-primary-600">
          <option value="SysAdmin">系統管理員</option>
          <option value="ICSOPAdmin" selected>ICSOP 管理員</option>
          <option value="Supervisor">主管</option>
          <option value="DeptContact">部門窗口</option>
          <option value="User">一般使用者</option>
        </select>
      </div>
      <button class="w-8 h-8 rounded-full bg-slate-100 flex items-center justify-center text-slate-500 hover:bg-slate-200"><i data-lucide="log-out" class="w-4 h-4"></i></button>
    </div>
  </div>
</header>

<main class="flex-1 flex items-center justify-center px-4 py-10">
  <div class="w-full max-w-2xl">

    <!-- greeting -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full text-sm font-medium mb-4" id="roleBadge"></div>
      <h1 class="text-2xl font-bold text-slate-900">登入成功，歡迎回來</h1>
      <p class="text-sm text-slate-500 mt-1" id="subline">請選擇要前往的介面。</p>
    </div>

    <!-- choice cards (management roles) -->
    <div id="choiceCards" class="grid sm:grid-cols-2 gap-4">
      <!-- 🔵 AC-UX4：**管理平台在前（左）**；AC-UX2：標題／說明逐字，四種角色相同。 -->
      <a href="07-admin-shell.html" aria-label="管理平台" class="group block bg-white border border-slate-200 rounded-2xl p-6 hover:border-primary-300 hover:shadow-md transition focus:outline-none focus:ring-2 focus:ring-primary-600">
        <div class="w-12 h-12 rounded-xl bg-primary-50 flex items-center justify-center mb-4 group-hover:bg-primary-100 transition">
          <i data-lucide="layout-dashboard" class="w-6 h-6 text-primary-600"></i>
        </div>
        <h2 class="font-bold text-slate-900 text-lg">管理平台</h2>
        <p class="text-sm text-slate-500 mt-1 leading-relaxed" id="adminDesc"></p>
        <span class="inline-flex items-center gap-1 text-sm text-primary-600 font-medium mt-4">進入後台<i data-lucide="arrow-right" class="w-4 h-4"></i></span>
      </a>

      <!-- 🔵 AC-UX4：**ICSOP 文件在後（右）**；AC-UX1：標題／說明逐字，說明末尾無句號。 -->
      <a href="03-public-list.html" aria-label="ICSOP 文件" class="group block bg-white border border-slate-200 rounded-2xl p-6 hover:border-primary-300 hover:shadow-md transition focus:outline-none focus:ring-2 focus:ring-primary-600">
        <div class="w-12 h-12 rounded-xl bg-primary-50 flex items-center justify-center mb-4 group-hover:bg-primary-100 transition">
          <i data-lucide="panels-top-left" class="w-6 h-6 text-primary-600"></i>
        </div>
        <h2 class="font-bold text-slate-900 text-lg">ICSOP 文件</h2>
        <p class="text-sm text-slate-500 mt-1 leading-relaxed">作業程序書瀏覽、搜尋、下載、列印</p>
        <span class="inline-flex items-center gap-1 text-sm text-primary-600 font-medium mt-4">前往前台<i data-lucide="arrow-right" class="w-4 h-4"></i></span>
      </a>
    </div>

    <!--
      user (no choice)
      🔴 2026-08-26 已作廢，⚠ 不得移植為實作：本區塊只是一張「唯一選項的選擇卡」，逼一般使用者
         多按一次；F002 `AC1` 逐字要求「直接導向前台瀏覽頁，**不顯示選擇畫面**」，連本頁副標
         （`subline`）自己都寫著「一般使用者將直接進入前台」。真人於 2026-08-26 回報「很多餘」，
         實作已改為 `RoleLanding` 於無後台功能權限時直接 `<Navigate to="/public" replace />`。
         本區塊**僅保留供原型演示切換角色時看得出差異**，不再是任何實作之權威來源。
    -->
    <div id="userDirect" class="hidden">
      <div class="bg-white border border-slate-200 rounded-2xl p-8 text-center">
        <div class="w-14 h-14 rounded-full bg-primary-50 flex items-center justify-center mx-auto mb-4">
          <i data-lucide="panels-top-left" class="w-7 h-7 text-primary-600"></i>
        </div>
        <h2 class="font-bold text-slate-900 text-lg">前往前台瀏覽</h2>
        <a href="03-public-list.html" class="inline-flex items-center justify-center gap-1.5 mt-5 w-full sm:w-auto px-6 py-2.5 rounded-md bg-primary-600 text-white text-sm font-semibold hover:bg-primary-700 transition">
          <i data-lucide="arrow-right" class="w-4 h-4"></i>前往前台瀏覽
        </a>
      </div>
    </div>

  </div>
</main>

<script>
  /* 🔴 AC-UX2：後台卡片說明之**唯一定義點**（四種角色共用同一段文字）。
     📝 已作廢（⚠ 不得復原、不得用於斷言）：OLD> ROLE_META 各列之 `admin` 欄＝逐角色差異化說明
        （四段字面逐字保留於本檔檔頭 ②）。
     🔒 半形括號 `(` `)`、`OJT進度` 中間無空白、末尾無句號——最可能的偏差就是「順手補上句號、把括號改全形」。 */
  const ADMIN_CARD_DESC = '儀表板、OJT進度、相關維護作業(依權限顯示)';

  const ROLE_META = {
    SysAdmin:   { label:'系統管理員', color:'#4338CA', icon:'shield-check' },
    ICSOPAdmin: { label:'ICSOP 管理員', color:'#7C3AED', icon:'file-cog' },
    Supervisor: { label:'主管', color:'#0891B2', icon:'user-cog' },
    DeptContact:{ label:'部門窗口', color:'#475569', icon:'contact' },
    User:       { label:'一般使用者', color:'#64748B', icon:'user' }
  };

  function setRole(code){
    const m = ROLE_META[code];
    // badge
    const badge = document.getElementById('roleBadge');
    badge.style.color = '#fff'; badge.style.background = m.color;
    badge.innerHTML = `<i data-lucide="${m.icon}" class="w-3.5 h-3.5"></i>${m.label}`;

    const isUser = code === 'User';
    document.getElementById('choiceCards').classList.toggle('hidden', isUser);
    document.getElementById('userDirect').classList.toggle('hidden', !isUser);
    document.getElementById('subline').textContent = isUser
      ? '一般使用者將直接進入前台。'
      : '您具備後台權限，請選擇要前往的介面。';
    // 🔴 AC-UX2：說明不再隨角色改變 —— 常數寫入一次即可，切換角色不重算（查表機制已刪除）。
    document.getElementById('adminDesc').textContent = ADMIN_CARD_DESC;
    lucide.createIcons();
  }

  setRole('ICSOPAdmin');
  lucide.createIcons();
</script>
</body>
</html>
