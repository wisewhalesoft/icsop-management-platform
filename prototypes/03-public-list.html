<!-- 🟢 F041 一般使用者子分類「業務／其他」（APPROVED — 2026-08-11 人類閘門通過）
     本檔已套用：頁首「示範視角」切換器（原型示範用，非正式 UI）＋ 業務子分類之可見性過濾（F019 AC-U1～AC-U3）。
     **預設視角＝「其他」＝本 delta 導入前之行為，逐欄不變**（F019 AC-U5 回歸鎖定）；切到「業務」才套用限縮。
     人類裁決結果（已落實）：
       OQ-E08-04 → B 子分類旗標（ACCOUNT.userSubtype，不新增第 6 種角色）
       OQ-E08-05 → A 子樹展開（重用既有比對邏輯，INV-4）
       OQ-E08-07 4a → A 保留置頂／其餘兩區塊（其餘區恆空＝預期退化，無前端特判）
       OQ-E08-07 4b → A 使用部門篩選下拉不限縮（維持完整選項）
       OQ-E08-07 4c → A 空狀態沿用既有「查無符合結果」逐字，**不因子分類分支**
       OQ-E08-08 → 孤兒帳號 deny-by-default（清單為空、非錯誤、不提示帳號異常）
       AC-02 → 未知 userSubtype 收斂為 'other'（fail-open）
     **頂部說明句於業務視角換為專屬文案**（2026-08-11 人類裁決新增；逐字內容＝ SCOPE_NOTICE_BUSINESS，
     下游 test-generator 會逐字斷言）——空狀態文案仍為「查無符合結果」逐字、不分支。
     規格權威＝docs/specs/features/F041-user-subtype-business-scope.md（AC-12～AC-19、AC-33） -->

<script>
  // 登入者組織路徑（王小明 · 營業二本部 / 營運管理部 / 審查室；部門代碼 JAC00）
  const USER_DEPT = '營運管理部 / 審查室';
  // §9.1/§9.2 定案：文件使用部門可指定任意層級，選上層自動涵蓋其下所有單位
  // → 「您部門相關」＝文件使用部門命中登入者組織路徑上任一層級（含全公司）
  const USER_SCOPE = ['全公司','營業二本部','營業二本部 / 營運管理部','營業二本部 / 營運管理部 / 審查室'];

  /* ===== 🟢 F041（APPROVED — 2026-08-11 人類閘門通過）：一般使用者子分類「業務／其他」之純函式 =====
     規格權威＝docs/specs/features/F041-user-subtype-business-scope.md（AC-01～AC-04、AC-12、AC-31～AC-33）
     ＋ F019 delta AC-U1～AC-U6。OQ-E08-04 裁決 B（子分類旗標）、OQ-E08-05 裁決 A（子樹展開）。
     函式名稱逐字採規格「本規格鎖定之命名」表，前後端語意須一致。

     INV-4「全系統不得存在第二套部門比對邏輯」：本頁之 isUsingDeptMatched 即既有置頂判定
     inScope 之唯一實作（inScope 改為委派呼叫），故 AC-10「isUsingDeptMatched 與 isPinned
     逐案相等」在原型層面亦成立——「業務視角下其餘區恆空」（AC-15）由此自然成立，非特判。
     原型以組織路徑字串代表 orgCode 之前綴子樹展開（本檔自 2026-07-20 起之既有慣例），
     語意等同後端 org-hierarchy.ts 之 isWithinSubtree。 */
  function normalizeUserSubtype(v){ return v === 'business' ? 'business' : 'other'; }                 // AC-01／AC-02：未知值一律收斂為 other
  function userSubtypeLabel(v){ return normalizeUserSubtype(v) === 'business' ? '業務' : '其他'; }     // AC-31（顯示標籤逐字）
  function isSubtypeApplicable(roleCode){ return roleCode === 'User'; }                               // AC-32：僅一般使用者適用
  function isDeptScopedViewer(v){ return v.roleCode === 'User' && normalizeUserSubtype(v.userSubtype) === 'business'; } // AC-03／AC-04
  function isUsingDeptMatched(usingDepts, scope){                                                     // AC-05～AC-12
    return Array.isArray(scope) && scope.length > 0 && usingDepts.some(u => scope.includes(u));       // scope 缺值＝孤兒帳號 → false（deny-by-default）
  }
  function isDocVisibleToViewer(usingDepts, v){                                                       // AC-05～AC-13
    return isDeptScopedViewer(v) ? isUsingDeptMatched(usingDepts, v.scope) : true;                    // AC-13：不受限者恆可見
  }

  // 目前示範之 viewer（預設＝其他子分類＝本 delta 導入前之行為，F019 AC-U5 回歸鎖定）
  const VIEWER = { roleCode:'User', userSubtype:'other', scope: USER_SCOPE };
  const inScope = use => isUsingDeptMatched(use, VIEWER.scope);   // 置頂判定＝與可見性判定同一份實作（AC-10）

  /* ===== 🟢 頂部說明句（依子分類切換）——2026-08-11 人類閘門新增之裁決 =====
     下列兩條字串為**逐字定稿之 UI 文案權威**（下游 test-generator 會逐字斷言），修改前須經人類再裁決。
     · 其他子分類：沿用本 delta 導入前之既有文案，一字未改（F019 AC-U5 回歸鎖定）。
     · 業務子分類：專屬文案，須讓使用者理解「這是受限範圍」而非「全公司就這些」，並給出後續動作。
       孤兒帳號（部門資料缺值）之業務使用者**沿用同一條**——不得因帳號異常而換句，
       否則以文案差異即可區分「無文件」與「帳號異常」（error-handling.md#dept-restriction 共通要求）。
     ⚠ 空狀態文案不在本裁決範圍：仍為「查無符合結果」逐字、不因子分類分支（OQ-E08-07 4c 裁決 A）。 */
  const SCOPE_NOTICE_OTHER   = '一般使用者僅顯示「已公告」文件（進度中/失效/作廢由後端過濾隱藏）；您所屬部門相關文件會自動置頂。';
  const SCOPE_NOTICE_BUSINESS = '業務使用者僅顯示「已公告」且使用部門為您所屬部門（含其下所有單位）之文件（進度中/失效/作廢由後端過濾隱藏）；其餘部門之文件不在您的瀏覽範圍內，如需調閱請洽該部門窗口。';

  /* 原型示範用：三種 viewer 視角（非正式 UI，實作時不得移植） */
  const VIEWER_MODES = {
    other:    { userSubtype:'other',    scope:USER_SCOPE, dept:'營運管理部 / 審查室', notice:SCOPE_NOTICE_OTHER,
                note:'子分類「其他」＝本 delta 導入前之行為：使用部門僅影響置頂排序、不影響可見性（F041 AC-13／AC-19）。' },
    business: { userSubtype:'business', scope:USER_SCOPE, dept:'營運管理部 / 審查室', notice:SCOPE_NOTICE_BUSINESS,
                note:'子分類「業務」＝僅可見「使用部門相符（子樹展開）」之已公告文件；全部結果落在置頂區、其餘區恆空＝預期退化非缺陷（F041 AC-14／AC-15）。使用部門下拉不限縮（4b 裁決 A）；選到範圍外單位時交集為空、顯示既有空狀態、非錯誤。頂部說明句換為業務專屬文案（2026-08-11 裁決）。' },
    orphan:   { userSubtype:'business', scope:[],         dept:'—',                   notice:SCOPE_NOTICE_BUSINESS,
                note:'孤兒帳號（部門資料缺值）＝deny-by-default，清單為空且非錯誤，沿用既有「查無符合結果」空狀態、不提示帳號異常（F041 AC-12／AC-33）；頂部說明句亦與一般業務使用者相同，不另換句。' }
  };
  function setViewer(mode){
    const m = VIEWER_MODES[mode] || VIEWER_MODES.other;
    VIEWER.userSubtype = m.userSubtype;
    VIEWER.scope = m.scope;
    document.body.dataset.viewerSubtype = normalizeUserSubtype(VIEWER.userSubtype);
    document.getElementById('hdrDept').textContent = m.dept;
    document.getElementById('scopeNotice').textContent = m.notice;
    document.getElementById('viewerNote').textContent = m.note;
    render();
  }
  // 所屬循環＝ICSOP 編號第 2 段代碼對應（SRC=銷售及收款循環, PUC=採購及付款循環, PPC=產品企劃循環,
  // LWC=薪工循環, FC=融資循環, FAC=不動產、廠房及設備循環, IC=投資循環, CIPS=電腦化資訊系統控制作業, GCA=管理性控制作業）
  /* ===== F040 循環子分類：循環池與純函式（全站同一實作）=====
     循環之業務身分＝(name, subcategory) 組合；同名不同子分類＝彼此獨立的循環。
     顯示字串一律由 lifecycleDisplayName 產生，前台與後台（13）完全一致（F019 AC-S1）。 */
  const LIFECYCLE_POOL=[
    {id:'lc1', name:'銷售及收款循環',      subcategory:'消金'},
    {id:'lc10',name:'銷售及收款循環',      subcategory:'企金'},
    {id:'lc11',name:'銷售及收款循環',      subcategory:'子公司'},
    {id:'lc2', name:'採購及付款循環',      subcategory:null},
    {id:'lc3', name:'產品企劃循環',        subcategory:null},
    {id:'lc4', name:'薪工循環',            subcategory:null},
    {id:'lc5', name:'融資循環',            subcategory:null},
    {id:'lc6', name:'不動產、廠房及設備循環',subcategory:null},
    {id:'lc7', name:'投資循環',            subcategory:null},
    {id:'lc8', name:'電腦化資訊系統控制作業',subcategory:null},
    {id:'lc9', name:'管理性控制作業',       subcategory:null}
  ];
  function normalizeSubcategory(v){ const s=(v==null?'':String(v)).trim(); return s?s:null; }
  function lifecycleDisplayName(lc){ if(!lc) return ''; const s=normalizeSubcategory(lc.subcategory); return s?`${lc.name}（${s}）`:lc.name; }
  const lcById=id=>LIFECYCLE_POOL.find(l=>l.id===id)||null;
  const lcName=id=>lifecycleDisplayName(lcById(id));
  const DOCS = [
    // 使用部門刻意涵蓋不同層級（全公司／本部／部／處室／課），示範「任意層級皆可指定」
    {n:'ICSOP-SRC-101-2-00',name:'消金審核作業',acc:'信用審查部',use:['營業二本部'],status:'有效',lcId:'lc1',date:'2025-12-01',summary:'規範消費金融案件之信用審核政策、額度核定權限與例外簽核程序。'},
    {n:'ICSOP-SRC-103-1-01',name:'企業金融授信作業',acc:'信用審查部',use:['風險管理服務本部 / 信用審查部'],status:'有效',lcId:'lc10',date:'2026-06-01',summary:'規範企業金融客戶之授信申請、額度核定與擔保品管理之控制程序。'},
    {n:'ICSOP-SRC-101-1-06',name:'消費分期特約通路作業',acc:'消費分期營業部',use:['營業二本部 / 營運管理部'],status:'有效',lcId:'lc1',date:'2025-10-01',summary:'說明特約商店通路之合作建立、案件收件與拆帳對帳作業流程。'},
    {n:'ICSOP-PPC-101-2-02',name:'消費分期產品政策及規範作業',acc:'消費分期營業部',use:['營業二本部 / 營運管理部 / 審查室','營業二本部 / 消費分期營業部'],status:'有效',lcId:'lc3',date:'2026-03-01',summary:'訂定消費分期產品之定價策略、風險胃納與上下架審議機制。'},
    {n:'ICSOP-PPC-101-1-03',name:'消費分期-月目標設定作業',acc:'消費分期營業部',use:['營業二本部 / 消費分期營業部 / 商品北一處'],status:'有效',lcId:'lc3',date:'2026-04-01',summary:'規範各業務單位月度目標之擬定、彙總與核定流程與績效追蹤節點。'},
    {n:'ICSOP-SRC-101-1-01',name:'車輛分期進件作業',acc:'企劃部',use:['營業二本部 / 營運管理部 / 審查室','風險管理服務本部 / 信用審查部','營業一本部 / 供應商金融部 / 北區綜合處 / 醫療一課'],status:'有效',lcId:'lc1',date:'2026-01-01',summary:'規範車輛分期案件之進件收件、資格初審與建檔流程，明確各關卡負責人與檢核事項。'},
    {n:'ICSOP-PUC-101-1-01',name:'和潤-費用請款作業',acc:'財會部',use:['全公司'],status:'有效',lcId:'lc2',date:'2026-05-01',summary:'說明各類營運費用之請款申請、單據審核與付款排程之控制程序。'},
    {n:'ICSOP-LWC-101-1-02',name:'招募管理作業',acc:'管理部',use:['經營企劃管理本部 / 管理部 / 人力資源室'],status:'有效',lcId:'lc4',date:'2025-10-01',summary:'規範職缺申請、招募甄選、任用核定與到職報到之作業與權責。'},
    {n:'ICSOP-IC-102-1-00',name:'短期投資買賣、保管及會計作業',acc:'財會部',use:['財務資訊本部 / 財會部'],status:'有效',lcId:'lc7',date:'2026-05-01',summary:'訂定短期投資之交易授權、部位保管與會計入帳之控制與覆核機制。'},
    {n:'ICSOP-GCA-100-2-00',name:'法遵作業',acc:'經企公關部',use:['經營企劃管理本部 / 經企公關部 / 法遵及公司治理室'],status:'有效',lcId:'lc9',date:'2026-03-01',summary:'建立法令遵循之辨識、評估、宣導與缺失追蹤之管理性控制流程。'},
    {n:'ICSOP-FC-101-1-00',name:'銀行融資作業',acc:'財會部',use:['財務資訊本部 / 財會部'],status:'有效',lcId:'lc5',date:'2026-02-01',summary:'說明銀行額度申請、動撥與還款之作業流程及資金部位控管。'},
    {n:'ICSOP-FAC-101-1-01',name:'不動產請購/採購/驗收',acc:'管理部',use:['經營企劃管理本部 / 管理部 / 總務室'],status:'有效',lcId:'lc6',date:'2025-10-01',summary:'規範不動產及設備之請購申請、採購比議價與驗收入帳之控制程序。'},
    {n:'ICSOP-CIPS-104-1-01',name:'使用者權限管理與覆核',acc:'資訊部',use:['財務資訊本部 / 資訊部 / 應用發展室'],status:'有效',lcId:'lc8',date:'2026-04-01',summary:'規範資訊系統帳號權限之申請、核准、定期覆核與離職註銷程序。'},
    // 進度中（有效但公告日期未到 today）→ 前台隱藏、僅後台可見
    {n:'ICSOP-SRC-102-1-00',name:'車輛分期對保作業（新制）',acc:'企劃部',use:['營業二本部 / 營運管理部 / 審查室'],status:'有效',lcId:'lc1',date:'2026-09-01',summary:'（將於 2026-09-01 公告生效）規範車輛分期對保程序之新制作業。'},
    // 以下為失效/作廢，將由「後端」強制過濾，不顯示於前台
    {n:'ICSOP-SRC-101-1-05',name:'進件作業-消費分期進件作業（舊版）',acc:'消費分期營業部',use:['營業二本部 / 消費分期營業部'],status:'失效',lcId:'lc1',date:'2025-05-01',summary:'（舊版）消費分期進件作業，已由新版特約通路作業取代。'},
    {n:'ICSOP-LWC-101-1-03',name:'任用管理作業（作廢）',acc:'管理部',use:['經營企劃管理本部 / 管理部 / 人力資源室'],status:'作廢',lcId:'lc4',date:'2025-04-01',summary:'（作廢）任用管理作業，因組織調整不再適用。'}
  ];
  // 使用部門篩選選項＝實際出現之使用部門（含全公司／本部／部／處室／課四層＋全域）
  // 🔴 F041 AC-16／OQ-E08-07 4b 選項 A：業務子分類**不限縮**此下拉之選項（推導方式刻意不變）；
  // 選到子樹範圍外之單位時交集為空、顯示既有空狀態，非錯誤。
  const DEPTS = [...new Set(DOCS.flatMap(d => d.use))].sort((a,b)=>a.localeCompare(b,'zh-Hant'));

  // populate selects
  function fillOpts(id,arr,val){const s=document.getElementById(id);arr.forEach(v=>{const o=document.createElement('option');o.value=v;o.textContent=v;s.appendChild(o);});}
  ['fDept','fDeptM'].forEach(id=>fillOpts(id,DEPTS));
  // 循環篩選：選項值＝lifecycleId、顯示＝lifecycleDisplayName（F019 AC-S2）
  // 「銷售及收款循環（消金／企金／子公司）」為三個相異選項，選定其一不含同名其他子分類之文件
  function fillCycleOpts(id){const s=document.getElementById(id);LIFECYCLE_POOL.forEach(l=>{const o=document.createElement('option');o.value=l.id;o.textContent=lifecycleDisplayName(l);s.appendChild(o);});}
  ['fCycle','fCycleM'].forEach(fillCycleOpts);

  function statusPill(s){
    const map={'有效':['#047857','#D1FAE5'],'失效':['#B45309','#FEF3C7'],'作廢':['#B91C1C','#FEE2E2']};
    const [t,b]=map[s];return `<span class="px-2 py-0.5 rounded-full text-xs font-medium" style="color:${t};background:${b}">${s}</span>`;
  }
  function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;');}

  function card(d){
    const pinnedUse = d.use.map(u=>VIEWER.scope.includes(u)?`<span class="text-primary-700 font-medium">${u}</span>`:u).join('、');
    return `<article tabindex="0" onclick="openDoc('${d.n}')" class="bg-white border border-slate-200 rounded-xl p-4 hover:border-primary-300 hover:shadow-sm transition cursor-pointer focus:outline-none focus:ring-2 focus:ring-primary-600">
      <div class="flex items-start justify-between gap-3">
        <div class="min-w-0">
          <div class="flex items-center gap-2 flex-wrap">
            <span class="mono text-xs text-slate-500">${d.n}</span>${statusPill(d.status)}
          </div>
          <h3 class="font-semibold text-slate-900 mt-1 leading-snug">${esc(d.name)}</h3>
        </div>
        <i data-lucide="chevron-right" class="w-5 h-5 text-slate-300 shrink-0"></i>
      </div>
      <dl class="grid grid-cols-2 gap-x-4 gap-y-1.5 mt-3 text-xs">
        <div><dt class="text-slate-400 inline">制定部門：</dt><dd class="text-slate-600 inline">${d.acc}</dd></div>
        <div><dt class="text-slate-400 inline">公告日期：</dt><dd class="text-slate-600 inline mono">${d.date}</dd></div>
        <div class="col-span-2"><dt class="text-slate-400 inline">使用部門：</dt><dd class="text-slate-600 inline">${pinnedUse}</dd></div>
        <div class="col-span-2"><dt class="text-slate-400 inline">循環別：</dt><dd class="text-slate-600 inline">${lcName(d.lcId)}</dd></div>
        ${d.summary?`<div class="col-span-2"><dt class="text-slate-400 inline">內容摘要：</dt><dd class="text-slate-500 inline">${esc(d.summary)}</dd></div>`:''}
      </dl>
    </article>`;
  }

  function currentFilters(){
    return { kw:document.getElementById('kw').value.trim().toLowerCase(),
             dept:document.getElementById('fDept').value, status:'有效', cyc:document.getElementById('fCycle').value };
  }

  function render(){
    const f=currentFilters();
    // 後端強制：一般使用者僅「已公告」＝有效且公告日期已過（進度中/失效/作廢隱藏）
    const TODAY='2026-07-17';
    const visible = DOCS.filter(d=>d.status==='有效' && d.date <= TODAY);
    // AC-18／F019 AC-U4：hiddenCount 之計算式刻意不動——插入點在基底條件之後，
    // 故「因業務限制被過濾者」天然不計入，不以計數洩漏他部門文件之存在數。
    const hiddenCount = DOCS.length - visible.length;
    // 🔴 F041 AC-14／F019 AC-U1：於「已公告」基底條件之後、其餘篩選之前套用可見性過濾。
    // 不相符者不出現於清單、不計入總筆數；與部門／循環／關鍵字條件為 AND（AC-17／F019 AC-U3）。
    const scoped = visible.filter(d=>isDocVisibleToViewer(d.use, VIEWER));
    let rows = scoped.filter(d=>{
      if(f.dept && !d.use.includes(f.dept)) return false;
      if(f.cyc && d.lcId!==f.cyc) return false;   // 以 lifecycleId 比對：同名另一子分類之文件不納入
      if(f.kw && !(d.n.toLowerCase().includes(f.kw) || d.name.toLowerCase().includes(f.kw))) return false;
      return true;
    });
    // sort by number desc
    // 🔴 OQ-E08-07 4a 選項 A：置頂／其餘兩區塊之拆分邏輯完全不變、無子分類特判。
    // 業務視角下 rest 必為空（AC-10 等價之數學推論），空區塊由既有「空則隱藏」通則收合。
    const byNumDesc=(a,b)=> a.n<b.n?1:a.n>b.n?-1:0;
    const pinned = rows.filter(d=>inScope(d.use)).sort(byNumDesc);
    const rest = rows.filter(d=>!inScope(d.use)).sort(byNumDesc);

    document.getElementById('pinnedList').innerHTML = pinned.map(card).join('');
    document.getElementById('restList').innerHTML = rest.map(card).join('');
    document.getElementById('pinnedWrap').style.display = pinned.length? '' : 'none';
    document.querySelector('#restList').parentElement.style.display = rest.length? '' : 'none';

    const total=rows.length;
    document.getElementById('emptyState').classList.toggle('hidden', total>0);
    document.getElementById('pager').style.display = total>0? 'flex':'none';
    document.getElementById('countText').textContent = `共 ${total} 筆`;
    document.getElementById('hiddenNote').textContent = hiddenCount? `另有 ${hiddenCount} 筆（進度中/失效/作廢）文件已由後端隱藏` : '';

    const active = f.kw||f.dept||f.cyc;
    document.getElementById('clearBtnD').classList.toggle('hidden', !active);
    document.getElementById('filterDot').classList.toggle('hidden', !(f.dept||f.cyc));
    lucide.createIcons();
  }

  function clearFilters(){document.getElementById('kw').value='';document.getElementById('fDept').value='';document.getElementById('fCycle').value='';document.getElementById('fDeptM').value='';document.getElementById('fCycleM').value='';render();}
  function applyMobile(){document.getElementById('fDept').value=document.getElementById('fDeptM').value;document.getElementById('fCycle').value=document.getElementById('fCycleM').value;closeSheet();render();}
  function openSheet(){document.getElementById('sheetOverlay').classList.remove('hidden');document.getElementById('sheet').classList.remove('translate-y-full');}
  function closeSheet(){document.getElementById('sheetOverlay').classList.add('hidden');document.getElementById('sheet').classList.add('translate-y-full');}
  function openDoc(n){alert('進入文件詳情 / 檢視器（04 / 05）：'+n+'\n（本輪未產出，僅示意導向）');}
  document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet();});

  setViewer('other');   // 🔴 F041：預設＝其他子分類＝本 delta 導入前之行為（內部呼叫 render()）
</script>
</body>
