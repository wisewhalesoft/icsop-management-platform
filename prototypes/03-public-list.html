  <!-- 🔵 `AC-B12`：**恰兩個**瀏覽模式之切換控制項，可見文字與無障礙名稱逐字為
       `業務/功能類別樹狀圖` 與 `文件清單`（半形斜線、前後無空白；順序＝樹狀圖在前）；
       任一時刻**恰一個** aria-pressed="true"。🔒 **不得**出現第三種模式或「全部」之類的選項。 -->
  <div data-browse-mode-switch role="group" aria-label="瀏覽模式" class="inline-flex rounded-lg border border-slate-300 overflow-hidden mb-3">
    <button type="button" data-browse-mode="tree" aria-pressed="false" aria-label="業務/功能類別樹狀圖" onclick="switchMode('tree')"
            class="px-3 py-2 text-base bg-white text-slate-600 hover:bg-slate-50 focus:outline-none focus:ring-2 focus:ring-inset focus:ring-primary-600">業務/功能類別樹狀圖</button>
    <button type="button" data-browse-mode="list" aria-pressed="true" aria-label="文件清單" onclick="switchMode('list')"
            class="px-3 py-2 text-base bg-primary-600 text-white font-medium border-l border-slate-300 focus:outline-none focus:ring-2 focus:ring-inset focus:ring-primary-700">文件清單</button>
  </div>
  <script>
    /* 🔒 `AC-B14`：模式解析之**單一具名述詞**（本檔與 30 同名同語意；切換器與初始渲染共用，全檔不得出現第二套）。
       🔴 不可辨識分支必須以真的不在值域內的字串測（如 `?mode=grid`）；用空字串測不到值域檢查缺失。 */
    const BROWSE_MODES=['tree','list'];
    function resolveBrowseMode(raw){ return BROWSE_MODES.includes(raw) ? raw : 'tree'; }
    const PROTOTYPE_TREE_HREF='30-public-category-tree.html?mode=tree';   // 實作端＝同一頁之 ?mode=tree
    function switchMode(mode){
      const m=resolveBrowseMode(mode);
      if(m==='list') return;                    // 已在文件清單模式：不動任何狀態
      location.href=PROTOTYPE_TREE_HREF;         // 🔒 `AC-B15`：不寫入任何儲存（不記憶模式）
    }
    /* 🔒 `AC-B13`：以任何方式進入（側欄／登入後導向／不帶 mode 之網址）皆以樹狀圖為預設。
       原型以 replace（非 push）轉址，使上一頁仍是使用者真正的來源頁。 */
    (function initMode(){
      if(resolveBrowseMode(new URLSearchParams(location.search).get('mode'))==='tree'){
        location.replace(PROTOTYPE_TREE_HREF);
      }
    })();
  </script>

    {n:'ICSOP-SRC-102-1-00',name:'車輛分期對保作業（新制）',company:'和潤企業股份有限公司',dept:'企劃部',section:'車輛行銷室',chief:'陳彥廷（企劃部 車輛行銷室 室長）',sec:[],edition:"26'02",use:['營業二本部 / 營運管理部 / 審查室'],status:'有效',lcId:'lc1',date:'2026-09-01',summary:'（將於 2026-09-01 公告生效）規範車輛分期對保程序之新制作業。'},

    {n:'ICSOP-SRC-101-1-05',name:'進件作業-消費分期進件作業（舊版）',company:'和潤企業股份有限公司',dept:'消費分期營業部',section:'商品北一處',chief:'黃雅琪（消費分期營業部 商品北一處 室長）',sec:[],edition:"24'03",use:['營業二本部 / 消費分期營業部'],status:'失效',lcId:'lc1',date:'2025-05-01',summary:'（舊版）消費分期進件作業，已由新版特約通路作業取代。'},
    {n:'ICSOP-LWC-101-1-03',name:'任用管理作業（作廢）',company:'和潤企業股份有限公司',dept:'管理部',section:'人力資源室',chief:'周淑芬（管理部 人力資源室 室長）',sec:[],edition:"24'01",use:['經營企劃管理本部 / 管理部 / 人力資源室'],status:'作廢',lcId:'lc4',date:'2025-04-01',summary:'（作廢）任用管理作業，因組織調整不再適用。'}
  ];

  const TODAY='2026-07-17';
  const uniq=a=>[...new Set(a)].filter(v=>v!=='' && v!=null);
  const shortName=s=>(s||'').split('（')[0];

  /* 🔴 F019 AC-D5（2026-08-16 delta）：五項可搜尋下拉之**選項來源**
     ＝「全域 distinct」（自全體文件衍生，**非**當前結果集——避免「篩了就選不回來」之死鏈），
     **且必須先經與清單相同之 isDocVisibleToViewer 過濾**——下拉選項本身不得洩漏他部門文件之存在
     （與 AC-U4 hiddenCount 不洩漏原則同源）。切換示範視角至「業務」即可觀察選項隨之收斂。
     📌 與 OQ-E08-07 4b「不限縮下拉」不矛盾：4b 所指之「使用部門下拉」選項來自組織主檔
        （與文件存在與否無關），本頁五項選項則來自**文件衍生值**，故必須過濾。 */
  function visibleDocs(){
    return DOCS.filter(d=>d.status==='有效' && d.date<=TODAY)
               .filter(d=>isDocVisibleToViewer(d.use, VIEWER));
  }

  /* 🔴 F019 AC-D1／AC-D2：篩選器**恰 6 項**，順序逐字為
     制定公司／制定部門／制定室別／當責室長／狀態／循環別；各控制項之 aria-label ＝ 該逐字字串。
     · 五項為**可搜尋下拉（combobox）**——輸入關鍵字即時縮小選項（比照後台 13 之既有慣例）。
     · `狀態` 維持既有**原生 select**、**不改為 combobox**（AC-D2 明文），且維持既有裝飾性 no-op
       （基底條件已鎖「已公告」，OQ-F019-04）。
     🔴 已移除「使用部門」篩選器；DOM 內不存在該控制項之 aria-label，亦無其「所有…」預留選項文字。 */
  const FILTER={company:'',mkdept:'',section:'',chief:'',status:'有效',cyc:''};
  const FILTERS=[
    {key:'company',label:'制定公司',type:'combo', opts:()=>uniq(visibleDocs().map(d=>d.company))},
    {key:'mkdept', label:'制定部門',type:'combo', opts:()=>uniq(visibleDocs().map(d=>d.dept))},
    {key:'section',label:'制定室別',type:'combo', opts:()=>uniq(visibleDocs().map(d=>d.section))},
    // AC-D7：選項清單＝全體可見文件之 primaryChiefId ∪ secondaryChiefIds 之 distinct
    {key:'chief',  label:'當責室長',type:'combo', opts:()=>uniq(visibleDocs().flatMap(d=>[d.chief,...d.sec]).map(shortName))},
    {key:'status', label:'狀態',    type:'select',opts:()=>['有效']},
    // 循環別：選項值＝lifecycleId、顯示＝lifecycleDisplayName（F019 AC-S2）；同名不同子分類為相異選項
    {key:'cyc',    label:'循環別',  type:'combo', opts:()=>uniq(visibleDocs().map(d=>d.lcId)), optLabel:id=>lcName(id)}
  ];
  const cbCfg=k=>FILTERS.find(f=>f.key===k);
  const optText=(key,v)=>{const c=cbCfg(key);return c&&c.optLabel?c.optLabel(v):v;};

  /* 桌面：3 欄 grid 逐列換行（左→右、上→下）；行動：底部 sheet 由上而下。兩者共用同一 FILTERS 順序。 */
  function controlHtml(f,scope){
    const id=`${scope}_${f.key}`;
    if(f.type==='select'){
      return `<div>
        <label for="${id}" class="block text-sm font-medium text-slate-500 mb-1">${f.label}</label>
        <select id="${id}" aria-label="${f.label}" onchange="pickSelect('${f.key}',this.value)" class="w-full px-3 py-2 rounded-lg border border-slate-300 bg-white text-base focus:outline-none focus:ring-2 focus:ring-primary-600">
          ${f.opts().map(o=>`<option value="${esc(o)}" ${FILTER[f.key]===o?'selected':''}>${esc(o)}</option>`).join('')}
        </select></div>`;
    }
    return `<div>
      <label for="${id}_input" class="block text-sm font-medium text-slate-500 mb-1">${f.label}</label>
      <div class="relative">
        <i data-lucide="search" class="w-3.5 h-3.5 text-slate-400 absolute left-2.5 top-1/2 -translate-y-1/2"></i>
        <input id="${id}_input" aria-label="${f.label}" role="combobox" aria-expanded="false" aria-autocomplete="list" autocomplete="off" placeholder="全部"
               oninput="comboFilter('${f.key}','${scope}')" onfocus="comboFilter('${f.key}','${scope}')" onblur="comboClose('${f.key}','${scope}')"
               value="${esc(FILTER[f.key]?optText(f.key,FILTER[f.key]):'')}"
               class="w-full pl-8 pr-7 py-2 rounded-lg border border-slate-300 text-base bg-white focus:outline-none focus:ring-2 focus:ring-primary-600" />
        <button id="${id}_clear" onclick="clearOne('${f.key}')" aria-label="清除${f.label}" class="${FILTER[f.key]?'':'hidden'} absolute right-2 top-1/2 -translate-y-1/2 w-4 h-4 rounded-full hover:bg-slate-200 flex items-center justify-center text-slate-400"><i data-lucide="x" class="w-3 h-3"></i></button>
        <div id="${id}_list" class="hidden absolute z-30 mt-1 w-full max-h-52 overflow-auto bg-white border border-slate-200 rounded-md shadow-lg text-base"></div>
      </div></div>`;
  }
  function buildFilters(){
    document.getElementById('filterBar').innerHTML       = FILTERS.map(f=>controlHtml(f,'cbD')).join('');
    document.getElementById('filterSheetBody').innerHTML = FILTERS.map(f=>controlHtml(f,'cbM')).join('');
    lucide.createIcons();
  }
  function comboFilter(key,scope){
    const list=document.getElementById(`${scope}_${key}_list`); list.classList.remove('hidden');
    const kw=(document.getElementById(`${scope}_${key}_input`).value||'').trim().toLowerCase();
    const items=cbCfg(key).opts().filter(o=>optText(key,o).toLowerCase().includes(kw));
    list.innerHTML = items.length ? items.map(o=>{
      const sel=FILTER[key]===o, label=optText(key,o);
      return `<div class="combo-opt px-3 py-2 cursor-pointer hover:bg-primary-50 ${sel?'bg-primary-50 text-primary-700 font-medium':''}" data-v="${esc(o)}">${esc(label)}${sel?' ✓':''}</div>`;
    }).join('') : `<div class="px-3 py-2 text-slate-400">查無符合結果</div>`;
    list.querySelectorAll('.combo-opt').forEach(el=>el.addEventListener('mousedown',e=>{e.preventDefault();comboPick(key,el.dataset.v);}));
  }
  function comboClose(key,scope){ setTimeout(()=>{const l=document.getElementById(`${scope}_${key}_list`); if(l)l.classList.add('hidden');},150); }
  function comboPick(key,v){ FILTER[key]=v; buildFilters(); render(); }
  function clearOne(key){ FILTER[key]=''; buildFilters(); render(); }
  function pickSelect(key,v){ FILTER[key]=v; render(); }

  function statusPill(s){
    const map={'有效':['#047857','#D1FAE5'],'失效':['#B45309','#FEF3C7'],'作廢':['#B91C1C','#FEE2E2']};
    const [t,b]=map[s];return `<span class="px-2 py-0.5 rounded-full text-sm font-medium" style="color:${t};background:${b}">${s}</span>`;
  }
  function esc(s){return (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');}

  /* 🔴 F019 AC-D8（2026-08-16 delta；🔴 2026-08-27 AC-Y5 就地改寫）：清單卡之**欄位標籤**集合恰為**八項**——
     程序書編號／程序書書名／文件狀態／制定公司／制定部門／制定室別／版次／公告日期
     （內容摘要仍顯示，但**已無標籤**：它是書名的副標題，不再是一個「欄位」）。
     編號、書名、狀態徽章維持於卡片標頭、位置不變；<dl> 區塊之標籤順序逐字為
     制定公司：／制定部門：／制定室別：／版次：／公告日期：（**五列**）。
     📝 OLD>（2026-08-16～2026-08-27）標籤集合九項含「內容摘要」，<dl> 六列、末列為「內容摘要：」。
     🔴 卡片 DOM **不得出現**「使用部門：」與「循環別：」兩個標籤（AC-D8 雙重 queryByText 斷言）。
     📌 「使用部門逐段高亮」（G-PUB-016）隨欄位移除一併移除——此為 AC-D12 已接受之代價。
     版次以等寬字（mono）呈現，格式 {YY}'{NN}。 */
  function card(d){
    return `<article tabindex="0" onclick="openDoc('${d.n}')" class="bg-white border border-slate-200 rounded-xl p-4 hover:border-primary-300 hover:shadow-sm transition cursor-pointer focus:outline-none focus:ring-2 focus:ring-primary-600">
      <div class="flex items-start justify-between gap-3">
        <div class="min-w-0">
          <div class="flex items-center gap-2 flex-wrap">
            <span class="mono text-sm text-slate-500">${d.n}</span>${statusPill(d.status)}
          </div>
          <h3 class="font-semibold text-slate-900 mt-1 leading-snug">${esc(d.name)}</h3>
          ${d.summary?`<p class="text-slate-500 text-base mt-1 leading-snug" data-summary>${esc(d.summary)}</p>`:''}
        </div>
        <i data-lucide="chevron-right" class="w-5 h-5 text-slate-300 shrink-0"></i>
      </div>
      <dl class="grid grid-cols-2 2xl:grid-cols-3 gap-x-4 gap-y-1.5 mt-3 text-sm">
        <div><dt class="text-slate-400 inline">制定公司：</dt><dd class="text-slate-600 inline">${esc(d.company)}</dd></div>
        <div><dt class="text-slate-400 inline">制定部門：</dt><dd class="text-slate-600 inline">${esc(d.dept)}</dd></div>
        <div><dt class="text-slate-400 inline">制定室別：</dt><dd class="text-slate-600 inline">${d.section?esc(d.section):'<span class="text-slate-300" title="此部之下無處/室，制定組織掛於部層">—</span>'}</dd></div>
        <div><dt class="text-slate-400 inline">版次：</dt><dd class="text-slate-600 inline mono">${esc(d.edition)}</dd></div>
        <div class="col-span-2"><dt class="text-slate-400 inline">公告日期：</dt><dd class="text-slate-600 inline mono">${d.date}</dd></div>
      </dl>
    </article>`;
  }

  function render(){
    const kw=document.getElementById('kw').value.trim().toLowerCase();
    // 後端強制：一般使用者僅「已公告」＝有效且公告日期已過（進度中/失效/作廢隱藏）
    const visible = DOCS.filter(d=>d.status==='有效' && d.date <= TODAY);
    // AC-18／F019 AC-U4：hiddenCount 之計算式刻意不動——插入點在基底條件之後，
    // 故「因業務限制被過濾者」天然不計入，不以計數洩漏他部門文件之存在數。
    const hiddenCount = DOCS.length - visible.length;
    // 🔴 F041 AC-14／F019 AC-U1：於「已公告」基底條件之後、其餘篩選之前套用可見性過濾。
    // 不相符者不出現於清單、不計入總筆數；與六項篩選／關鍵字條件為 AND（AC-17／F019 AC-U3／AC-D6）。
    const scoped = visible.filter(d=>isDocVisibleToViewer(d.use, VIEWER));
    /* AC-D4／AC-D6：制定公司／制定部門／制定室別／循環別皆為**等值比對**（比對鍵為 id，非顯示名稱）；
       `狀態` 維持既有裝飾性 no-op；任一未提供即不施加該限制；多項並用為 AND。 */
    let rows = scoped.filter(d=>{
      if(FILTER.company && d.company!==FILTER.company) return false;
      if(FILTER.mkdept  && d.dept!==FILTER.mkdept) return false;
      if(FILTER.section && d.section!==FILTER.section) return false;
      // 🔴 AC-D7：當責室長之比對範圍＝**主要 ∪ 次要**（命中任一即納入）；與後台 F017 AC-D7 同語意
      if(FILTER.chief && ![d.chief,...d.sec].map(shortName).includes(FILTER.chief)) return false;
      if(FILTER.cyc && d.lcId!==FILTER.cyc) return false;   // 以 lifecycleId 比對：同名另一子分類之文件不納入
      if(kw && !(d.n.toLowerCase().includes(kw) || d.name.toLowerCase().includes(kw))) return false;
      return true;
    });
    // sort by number desc
    // 🔴 OQ-E08-07 4a 選項 A：置頂／其餘兩區塊之拆分邏輯完全不變、無子分類特判。
    // 業務視角下 rest 必為空（AC-10 等價之數學推論），空區塊由既有「空則隱藏」通則收合。
    const byNumDesc=(a,b)=> a.n<b.n?1:a.n>b.n?-1:0;
    const pinned = rows.filter(d=>inScope(d.use)).sort(byNumDesc);
    const rest = rows.filter(d=>!inScope(d.use)).sort(byNumDesc);

    document.getElementById('pinnedList').innerHTML = pinned.map(card).join('');
    document.getElementById('restList').innerHTML = rest.map(card).join('');
    document.getElementById('pinnedWrap').style.display = pinned.length? '' : 'none';
    document.querySelector('#restList').parentElement.style.display = rest.length? '' : 'none';

    const total=rows.length;
    document.getElementById('emptyState').classList.toggle('hidden', total>0);
    document.getElementById('pager').style.display = total>0? 'flex':'none';
    document.getElementById('countText').textContent = `共 ${total} 筆`;
    document.getElementById('hiddenNote').textContent = hiddenCount? `另有 ${hiddenCount} 筆（進度中/失效/作廢）文件已由後端隱藏` : '';

    // AC-D3：「清除篩選」之範圍擴及新增之四項；`狀態` 之預設值為既有 no-op，不計入 active
    const anyFilter = ['company','mkdept','section','chief','cyc'].some(k=>FILTER[k]);
    document.getElementById('clearBtnD').classList.toggle('hidden', !(kw||anyFilter));
    document.getElementById('filterDot').classList.toggle('hidden', !anyFilter);
    lucide.createIcons();
  }

  /* 🔴 F019 AC-D3：清除篩選＝**6 項篩選與關鍵字同時清空**、清單回復未篩選狀態與預設排序。
     （`狀態` 回到既有預設值「有效」——其為裝飾性 no-op，基底條件已鎖「已公告」。） */
  function clearFilters(){
    document.getElementById('kw').value='';
    Object.keys(FILTER).forEach(k=>{FILTER[k]='';});
    FILTER.status='有效';
    buildFilters(); render();
  }
  function openSheet(){document.getElementById('sheetOverlay').classList.remove('hidden');document.getElementById('sheet').classList.remove('translate-y-full');}
  function closeSheet(){document.getElementById('sheetOverlay').classList.add('hidden');document.getElementById('sheet').classList.add('translate-y-full');}
  function openDoc(n){alert('進入文件詳情 / 檢視器（04 / 05）：'+n+'\n（本輪未產出，僅示意導向）');}
  document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet();});

  setViewer('other');   // 🔴 F041：預設＝其他子分類＝本 delta 導入前之行為（內部呼叫 render()）
</script>
</body>
</html>
