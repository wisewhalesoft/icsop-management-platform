       權威＝backend/src/rbac/function-matrix.ts 之 LIFECYCLE_MANAGEMENT（主管＝NONE）；本檔先前落後於已上線程式碼。

     固定向量：總和恆為周長／單一值佔滿整圈／零值不產生可見段。 */
  function donutSegments(values){
    const total=values.reduce(function(a,b){return a+b;},0);
    let acc=0;
    return values.map(function(v){
      const length = total>0 ? (v/total)*DONUT_C : 0;
      const seg={offset:acc,length:length};
      acc+=length;
      return seg;
    });
  }

     固定向量：`X===0`（空環，length 0）／`X===Y`（滿環，length ＝ 周長）／中間值（`3/4` ⇒ 0.75×周長）。

  const OJT_DONUT_R=26, OJT_DONUT_C=2*Math.PI*OJT_DONUT_R;
  function ojtOnTimeArc(numerator,denominator){
    if(!(denominator>0)) return {length:0,rest:OJT_DONUT_C};
    const ratio=Math.max(0,Math.min(1,numerator/denominator));
    const length=ratio*OJT_DONUT_C;
    return {length:length,rest:OJT_DONUT_C-length};
  }

  function barWidths(announced,inProgress,max){

    return {announced:(announced/max)*100,inProgress:(inProgress/max)*100};
  }

    const parts=[co];

    parts.push(orgUnitDisplayName(unit));
    return {key:orgGroupKeyOf(doc.co,unit.code),label:parts.join(ORG_PATH_SEPARATOR)};

    return order.map(function(k){ return map[k]; }).sort(function(a,b){

      return a.id<b.id?-1:a.id>b.id?1:0;

    return sorted.slice(0,limit);
  }

  /* 🔒 `AC-G61`：統計單位＝**類別**（非節點），同一份文件在同一類別內**只計一次**（相異 documentId）。
     🔒 `AC-G62`：僅 `status==='active'` 之文件計入，並依 `deriveDisplayStatus` 分兩色；
        `inactive`／`void` **完全不計入**（雙色既然逐字就是那兩種，第三、四種狀態沒有可落之色）。
     🔒 `AC-G63`：停用之類別不顯示；掛載文件數為 0 之類別不顯示。
     🔒 `AC-G64`：總數降冪 → 顯示名昇冪（序數）→ categoryId 昇冪（絕對決定性），**禁 localeCompare**。 */
  function categoryDistribution(docs,cats){
    const byCat={};
    cats.forEach(function(c){ byCat[c.id]={}; });
    docs.forEach(function(d){
      if(d.status!=='active') return;
      (d.cats||[]).forEach(function(m){ if(byCat[m[0]]) byCat[m[0]][d.id]=1; });
    });
    cats.forEach(function(c){
      (c.demoDocs||[]).forEach(function(id){ const d=DOC_INDEX[id]; if(d&&d.status==='active') byCat[c.id][id]=1; });
    });
    const rows=[];
    cats.forEach(function(c){
      if(c.status!=='active') return;
      let a=0,p=0;
      Object.keys(byCat[c.id]).forEach(function(id){
        const d=DOC_INDEX[id];
        if(deriveDisplayStatus(d.status,d.date,TODAY)==='announced') a++; else p++;
      });
      if(a+p===0) return;
      rows.push({id:c.id,label:businessCategoryDisplayName(c),announced:a,inProgress:p,total:a+p});
    });
    return rows.sort(function(x,y){
      if(y.total!==x.total) return y.total-x.total;
      if(x.label!==y.label) return x.label<y.label?-1:1;
      return x.id<y.id?-1:x.id>y.id?1:0;
    });
  }

  /* 📌 `AC-G9`～`AC-G15` 之可測形狀：純函式 `ojtOnTimeRate(rows, today)`。
     🔴 分母＝相異 `(companyCode, orgCode)` **複合鍵**（單以 orgCode 分組會把不同公司的兩個部併成一組）；
        分子＝該單位在窗口內之**全部**應完成文件皆已完成者（部分完成不算）。
     🔴 `denominator === 0` 時**省略 `rate` 鍵**（比照 F042 `coverage.rate` 之既有紀律）。 */
  function ojtOnTimeRate(rows,today){
    const from=addMonthsClamped(today,-1);
    const ex={inactive:0,orphaned:0,noDate:0};
    const units={}, keys=[];
    rows.forEach(function(r){
      if(r.isActive===false){ ex.inactive++; return; }
      if(r.orphaned){ ex.orphaned++; return; }
      if(!r.announcedDate){ ex.noDate++; return; }
      const due=addMonthsClamped(r.announcedDate,1);
      if(due<from||due>today) return;                 /* 窗口外：不排除、也不計入（不是「被排除」） */
      const k=orgGroupKeyOf(r.co,r.org);
      if(!units[k]){ units[k]={total:0,done:0}; keys.push(k); }
      units[k].total++;
      if(r.completed) units[k].done++;
    });
    let numerator=0;
    keys.forEach(function(k){ if(units[k].total>0&&units[k].done===units[k].total) numerator++; });
    const out={numerator:numerator,denominator:keys.length,windowFrom:from,windowTo:today,
      excludedInactive:ex.inactive,excludedOrphaned:ex.orphaned,excludedNoAnnouncedDate:ex.noDate};
    if(out.denominator>0) out.rate=coveragePercent(numerator,out.denominator);
    return out;
  }
  /* 🔒 **可見排除數之單一推導點**（2026-09-21 第二次就地更正，`ring-f044` 提報之口徑錯誤）：
     `excludedUnitCount(stats)` ＝ `excludedInactive + excludedOrphaned` —— **恰前兩項**。
     🔴 **可見文字一律委派本函式**，明文禁止在渲染處再寫一次加法：否則日後有人把第三項加回去，
        而「有一份加法」與「有兩份加法」在畫面上完全相同 ⇒ **兩處都會綠**。
     🔴 **為什麼第三項不能加進來**（缺一不可的兩個理由）：
        ① **單位不同**——前兩項數的是「單位」，第三項數的是「文件」；相加得到一個沒有意義的數。
        ② **語意不同**——前兩項是「進了母體又被拿掉」，第三項是「**從來沒進過母體**」
           （無公告日 ⇒ 無從推算應完成日 ⇒ 根本不會落進這張卡的時間窗口，`OQ-D44-12b`）。
           ⇒ 把它叫「排除」本身就是錯的，所以它在 ⓘ 內**獨立成句**、不串入上一句的加總。 */
  function excludedUnitCount(stats){
    return stats.excludedInactive + stats.excludedOrphaned;
  }

  /* ═════════════════ F044 · 渲染 ═════════════════ */

  /* ═════ ⓘ 說明（`AC-G94`／`AC-G95`；2026-09-21 人類裁決第二輪）═════
     🔴 **人類原話**：「實作邏輯和技術細節不需要出現在 UI 上給使用者看，如果要留也應該用 hover 的方式保留」。
     🔒 `LESSON-G2`：**「不變式需要可驗證的載體」≠「不變式需要可見的文案」**——載體可以是
        `data-*`／`aria-label`／popover 內的文字；把不變式的**理由**寫成畫面上的常駐說明，
        等於把驗收標準洩漏給使用者。
     🔒 分工判準＝**「這句話在回答使用者的哪一個問題」**，不是「技術性與否」：
        · 「我接下來該做什麼／這裡為什麼是空的」⇒ 🟢 可見（🔴 **空狀態尤其必須可見**，收進 ⓘ 等於把空狀態變成死路）
        · 「這個數字為什麼這樣算／為什麼兩處對不起來」⇒ ⓘ popover
        · 「這條驗收標準是什麼」⇒ 🔴 刪除
     🔴 **`AC-G71` 不放寬、且更嚴**：改的是**理由**的位置，不是**數字**的位置。
        每一個圖表數值仍須留在**可見**文字中——使用者不應該要展開說明才看得到數字。
     ── DOM 契約（🔒 鎖定）──
     · 觸發器：`<button type="button">` ＋ `data-testid="info-trigger"` ＋ `data-info-for="{key}"`
       ＋ `aria-label` 逐字 `說明` ＋ `aria-expanded` ＋ `aria-describedby`；**本身不承載任何資訊**。
     · 內容：`data-testid="info-content"` ＋ 穩定 `id`；🔴 **恆在 DOM**（未展開時僅以視覺方式隱藏），
       故 `getByTestId('info-content')` 可直接讀取、不需先觸發 hover。
     🔴 **明文禁止以 `title` 屬性實作**——`title` 在觸控裝置不可達、螢幕閱讀器支援不一致、RTL 難以穩定斷言。
     🔴 hover／focus／點擊三種皆可展開；`Esc` 收合。
     ⚠ **全頁多個 ⓘ 共用 `aria-label="說明"`** ⇒ 斷言**必須先限定容器或以 `data-info-for` 區辨**，
        明文禁止全域 `getByRole('button', { name: '說明' })`（會命中多個）。
     📌 點擊刻意是「開啟」而非「切換」：`user-event.click()` 會先 focus，若 focus 開啟、click 再切換，
        `aria-expanded` 會在一次點擊後回到 `false`，使「`false` → `true`」那條斷言恆紅。
        收合路徑＝移開游標／`Tab` 離開／`Esc`。 */
  const INFO_LABEL='說明';
  const infoState={};
  function infoStateOf(k){ return infoState[k]||(infoState[k]={hover:false,focus:false,pinned:false}); }
  function applyInfo(k){
    const s=infoStateOf(k), on=s.hover||s.focus||s.pinned;
    const btn=document.querySelector('[data-info-for="'+k+'"]');
    const box=document.querySelector('[data-info-content="'+k+'"]');
    if(!btn||!box) return;
    btn.setAttribute('aria-expanded', on?'true':'false');
    box.classList.toggle('hidden',!on);
  }
  function infoHover(k,on){ infoStateOf(k).hover=on; applyInfo(k); }
  function infoFocus(k,on){ const s=infoStateOf(k); s.focus=on; if(!on) s.pinned=false; applyInfo(k); }
  function infoOpen(k){ infoStateOf(k).pinned=true; applyInfo(k); }
  function closeAllInfo(){
    Object.keys(infoState).forEach(function(k){ infoState[k]={hover:false,focus:false,pinned:false}; applyInfo(k); });
    const a=document.activeElement; if(a&&a.getAttribute&&a.getAttribute('data-info-for')) a.blur();
  }
  /* 重繪會換掉 popover 的 DOM ⇒ 同步把狀態歸零，避免「狀態說開著、畫面已關閉」。 */
  function infoReset(){ Object.keys(infoState).forEach(function(k){ delete infoState[k]; }); }
  /* paragraphs ＝ 🔒 逐字鎖定之段落（見 F044 §癸四 逐處處置表），**不得自行潤飾**。 */
  function infoNote(key,paragraphs){
    const id='info-'+key;
    return `<span class="relative inline-flex align-middle shrink-0" onmouseenter="infoHover('${key}',true)" onmouseleave="infoHover('${key}',false)"
      ><button type="button" data-testid="info-trigger" data-info-for="${key}" aria-label="${INFO_LABEL}" aria-expanded="false" aria-describedby="${id}"
        onclick="infoOpen('${key}')" onfocus="infoFocus('${key}',true)" onblur="infoFocus('${key}',false)"
        class="w-4 h-4 rounded-full border border-slate-300 text-slate-400 hover:text-primary-600 hover:border-primary-300 focus:outline-none focus:ring-2 focus:ring-primary-600 flex items-center justify-center shrink-0"
        ><i data-lucide="info" class="w-3 h-3" aria-hidden="true"></i></button
      ><span id="${id}" data-testid="info-content" data-info-content="${key}" role="note"
        class="hidden absolute left-0 top-full mt-1 z-50 w-64 max-w-[16rem] rounded-lg border border-slate-200 bg-white shadow-lg p-3 text-[11px] leading-relaxed text-slate-600 text-left font-normal whitespace-normal"
        >${paragraphs.map(function(p,i){ return '<span class="block'+(i?' mt-1.5':'')+'">'+p+'</span>'; }).join('')}</span></span>`;
  }


  function emptyState(text,hint){
    return `<div data-testid="empty-state" class="text-center py-8 px-4">

      ${hint?`<p class="text-xs text-slate-400 mt-1">${esc(hint)}</p>`:''}

  }

    renderSidebar();
    if(r!=='user') renderDash();
    lucide.createIcons();
  }

  function toast(type,msg,code){
    const map={success:['check-circle-2','#059669'],error:['alert-circle','#DC2626'],info:['info','#365C97']};
    const [ic,color]=map[type]||map.info;
    const el=document.createElement('div');
    el.className='flex items-start gap-2 bg-white border border-slate-200 shadow-lg rounded-lg px-4 py-3 text-sm max-w-sm';
    el.style.borderLeft='4px solid '+color;
    el.innerHTML=`<i data-lucide="${ic}" class="w-4 h-4 mt-0.5" style="color:${color}"></i><div><span class="text-slate-700">${msg}</span>${code?`<div class="text-[10px] mono text-slate-400 mt-0.5">${code}</div>`:''}</div>`;
    document.getElementById('toastWrap').appendChild(el);lucide.createIcons();
    setTimeout(()=>{el.style.transition='opacity .3s';el.style.opacity='0';setTimeout(()=>el.remove(),300);},4000);
  }

  /* 🔒 `AC-G95`：`Esc` 收合全部 ⓘ（鍵盤可達之收合路徑）。 */
  document.addEventListener('keydown',function(e){ if(e.key==='Escape') closeAllInfo(); });

  renderSidebar(); renderDash(); lucide.createIcons();
</script>
</body>
</html>
