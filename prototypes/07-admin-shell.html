<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>後台首頁 · ICSOP 管理後台</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = { theme: { extend: {
    fontFamily: { sans: ['Inter','Noto Sans TC','sans-serif'] },
    colors: { primary: { 50:'#F3F7FC',100:'#EAF1FA',200:'#CFDFF3',300:'#98B6E4',400:'#6E96D4',500:'#4A72AE',600:'#365C97',700:'#2A4A7E' } }
  }}}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono&display=swap" rel="stylesheet" />
<script src="https://unpkg.com/lucide@latest"></script>
<style>
  body{font-family:'Inter','Noto Sans TC',sans-serif;color:#334155;background:#F8FAFC;}
  .mono{font-family:'JetBrains Mono',monospace;}
  /* admin shell sidebar */
  #sidebar{width:240px;transition:width .2s ease;}
  body{padding-left:240px;transition:padding-left .2s ease;}
  body.sb-collapsed{padding-left:60px;}
  body.sb-collapsed #sidebar{width:60px;}
  body.sb-collapsed .sb-label{display:none;}
  body.sb-collapsed #sidebarNav .sb-item{justify-content:center;padding-left:0;padding-right:0;}
</style>
</head>
<body data-role="icsop_admin" class="min-h-screen">

<!-- ===== Admin shell sidebar ===== -->
<aside id="sidebar" class="fixed left-0 top-0 bottom-0 z-50 bg-white border-r border-slate-200 flex flex-col">
  <a href="07-admin-shell.html" data-to="/admin" aria-label="回到後台首頁" title="回到後台首頁" class="h-14 flex items-center gap-2 px-3 border-b border-slate-200 shrink-0 hover:bg-slate-50 focus:outline-none focus:ring-2 focus:ring-inset focus:ring-primary-600">
    <div class="w-8 h-8 rounded-lg bg-primary-600 flex items-center justify-center text-white shrink-0"><i data-lucide="file-text" class="w-5 h-5"></i></div>
    <span class="sb-label font-bold text-slate-900 text-sm truncate">ICSOP 後台</span>
  </a>
  <nav id="sidebarNav" class="flex-1 overflow-y-auto py-2 px-2 space-y-0.5"></nav>
  <div class="border-t border-slate-200 p-2 shrink-0">
    <button onclick="openPublic()" title="瀏覽文件網頁（開新視窗）" class="sb-item w-full flex items-center gap-2.5 px-2.5 py-2 rounded-md text-sm text-slate-600 hover:bg-slate-50">
      <i data-lucide="external-link" class="w-4 h-4 shrink-0"></i><span class="sb-label truncate">瀏覽文件網頁</span></button>
  </div>
</aside>

<!-- Top bar -->
<header class="sticky top-0 z-30 bg-white border-b border-slate-200">
  <div class="h-14 px-4 flex items-center gap-3">
    <button onclick="toggleSidebar()" title="收合/展開選單" class="text-slate-400 hover:text-slate-600"><i data-lucide="panel-left" class="w-5 h-5"></i></button>
    <div class="leading-tight min-w-0">
      <div class="text-xs text-slate-400 flex items-center gap-1"><span>ICSOP 管理後台</span><i data-lucide="chevron-right" class="w-3 h-3"></i><span>首頁</span></div>
      <div class="font-semibold text-slate-900 text-sm truncate">後台首頁 / 儀表板</div>
    </div>
    <div class="ml-auto flex items-center gap-2">
      <div class="flex items-center gap-1.5 mr-1">
        <i data-lucide="users" class="w-4 h-4 text-slate-400"></i>
        <select id="roleSel" onchange="setRole(this.value)" class="text-sm border border-slate-300 rounded-md px-2 py-1.5 bg-white">
          <option value="icsop_admin">ICSOP 管理員</option>
          <option value="sysadmin">系統管理員</option>
          <option value="supervisor">主管</option>
          <option value="deptcontact">部門窗口</option>
          <option value="user">一般使用者</option>
        </select>
      </div>
      <!-- 🔵 F044 `AC-G42`／`AC-G43`（2026-09-21 架構定案後就地更新）：環圖之**預設維度頁籤**
           由**後端端點直接回傳 `defaultDimension`**——職位名之解析與逐字白名單整份落在後端。
           🔴 故 prototype **刻意不複製第二份白名單**（複製出來的那份遲早與後端漂移，而兩份初始
              碰巧相同 ⇒ 漂移前兩份都會綠）。本控制項只是「假裝端點回了哪一個值」的示意開關，
              與左側角色模擬器同性質，皆為 **原型專用**；正式站畫面上沒有這個下拉。
           🔵 括號內為「會產生該預設值的職位」，僅供閱讀；其判定載體在**後端純函式層**：
              · `本處長（和潤興業）⇒ 依制定部門` 是「禁以 code 直接比對」之關鍵向量（`B01` 於 AS/AE
                ＝本部長、於 AD ＝本處長；AD 沒有本部層，落到「依制定部門」是**正確**，不是將就）；
              · `副本部長` 為人工 fixture（上游已記錄之 75 列職位名稱中無此值）——🔴 不得宣稱實機驗過。
           📝 已作廢（僅供追溯，⚠ 不得復原）：OLD> <select id="jobSel" onchange="setJobPosition(this.value)"> 之
              七個 `{公司}|{職位代碼}` 選項；連帶移除檔尾 JOB_POSITIONS／resolveJobPositionName／
              DIM_COMPANY_TITLES／DIM_DIVISION_TITLES／defaultOrgDimension 五個前端白名單常數與函式。 -->
      <div class="flex items-center gap-1.5 mr-1">
        <i data-lucide="contact" class="w-4 h-4 text-slate-400"></i>
        <select id="defaultDimSel" onchange="setDefaultDimension(this.value)" title="端點回傳之 defaultDimension（原型專用示意開關）" class="text-sm border border-slate-300 rounded-md px-2 py-1.5 bg-white">
          <option value="company">預設維度：依制定公司（董事長／總經理）</option>
          <option value="division">預設維度：依制定本部（本部長／副本部長）</option>
          <option value="department" selected>預設維度：依制定部門（部長／處長／和潤興業之本處長／查無職位）</option>
        </select>
      </div>
      <div class="hidden xl:flex items-center gap-1.5 text-sm text-slate-500 pl-2 border-l border-slate-200"><i data-lucide="user-circle" class="w-4 h-4"></i><span id="userName">李慧玲</span></div>
      <button title="登出" class="w-8 h-8 rounded-full hover:bg-slate-100 flex items-center justify-center text-slate-500"><i data-lucide="log-out" class="w-4 h-4"></i></button>
    </div>
  </div>
</header>

<!-- blocked overlay (User has no backend) -->
<div id="blockOverlay" class="hidden fixed inset-0 z-40 bg-slate-50/95 backdrop-blur-sm flex items-center justify-center">
  <div class="text-center max-w-sm">
    <div class="w-14 h-14 rounded-full bg-primary-50 flex items-center justify-center mx-auto mb-3"><i data-lucide="external-link" class="w-7 h-7 text-primary-600"></i></div>
    <h3 class="font-semibold text-slate-900">一般使用者無後台</h3>
    <p class="text-sm text-slate-500 mt-1">依角色分流（F002），一般使用者登入後直接導向前台瀏覽頁，不顯示管理後台。</p>
    <button onclick="openPublic()" class="mt-4 inline-flex items-center gap-1.5 px-4 py-2 rounded-md bg-primary-600 text-white text-sm hover:bg-primary-700"><i data-lucide="arrow-right" class="w-4 h-4"></i>前往前台瀏覽</button>
  </div>
</div>

<main class="max-w-6xl mx-auto px-5 py-6">
  <!-- welcome -->
  <div class="flex items-start justify-between flex-wrap gap-3 mb-5">
    <div>
      <h1 class="text-2xl font-bold text-slate-900">歡迎回來，李慧玲</h1>
      <p class="text-sm text-slate-500 mt-1">目前角色：<span id="roleBadge"></span> · <span class="mono">2026-07-16（週四）</span></p>
    </div>
    <!-- 🔵 示範情境切換（原型專用，比照 `25-ojt-progress.html` 之 `setDemoState`）。
         🔴 **存在理由**：`AC-G14`（OJT 分母為 0）／`AC-G46`（環圖空）／`AC-G57`（清單空）／`AC-G68`（類別空）
            四個空狀態，在完整示範語料之下**完全不可達**；沒有這個切換器，那四條 AC 在本頁就沒有任何
            可觀察的路徑，而它們在正式站是常態（`AC-G7` 之已接受代價、每月 1 日之必然狀態）。 -->
    <div class="flex items-center gap-1.5">
      <i data-lucide="database" class="w-4 h-4 text-slate-400"></i>
      <select id="demoSel" onchange="setDemoScenario(this.value)" title="示範語料切換（原型專用）" class="text-sm border border-slate-300 rounded-md px-2 py-1.5 bg-white">
        <option value="full">示範語料：完整</option>
        <option value="ojtZero">示範語料：OJT 母體為 0</option>
        <option value="empty">示範語料：全站尚無文件</option>
      </select>
    </div>
  </div>

  <!-- ═══ F044 ① · 上方四張統計卡（`AC-G1`～`AC-G24`）═══
       🔴 2026-09-21 人類裁決 `OQ-D44-03`＝甲：舊 5 張 KPI 待辦卡**完全取代**為本列 4 張。
          📝 已作廢（僅供追溯，⚠ 不得復原）：
             OLD> <div id="todoRow" class="grid grid-cols-2 sm:grid-cols-4 gap-3 mb-6"></div>
             OLD> 其逐字標題＝待確認組織異動／未指派節點文件／停用帳號待覆核／調閱紀錄（近7日）／待公布的文件
          ⚠ 明確後果（人類已授權）：系統管理員失去「停用帳號待覆核」之首頁入口、
            系統管理員與 ICSOP 管理員失去「待確認組織異動」之首頁入口；🔒 該兩項之**側欄入口一字不動**。
       🔒 容器語意鎖定（`AC-G1`）：`role="group"` ＋ `aria-label="統計資訊"`（取代既有 `aria-label="待辦提示"`）。 -->
  <div id="statCards" role="group" aria-label="統計資訊" data-testid="dashboard-stat-cards" class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4 gap-3 mb-6"></div>

  <!-- ═══ F044 ② · 「快速進入功能區」整區移除（`AC-G25`／`AC-G27`）═══
       📝 已作廢（僅供追溯，⚠ 不得復原）：
          OLD> <h2 class="text-sm font-semibold text-slate-700 mb-2 flex items-center gap-1.5"><i data-lucide="layout-grid" ...></i>快速進入功能區</h2>
          OLD> <div id="cardGrid" class="grid sm:grid-cols-2 lg:grid-cols-3 gap-4 mb-8"></div>
       🔒 移除理由＝與左側邊選單重複；故側欄 `MENU` 常數**一行未改**（`AC-G27`）。
       🔒 `受限CRUD` 徽章之載體不因此消失——它在側欄 `renderSidebar()` 另有一份（`AC-G26`）。 -->

  <!-- ═══ F044 ③ · 兩張環圖（`AC-G29`～`AC-G50`）═══
       🔴 環之**每一段＝一個組織**（隨頁籤為公司／本部／部門），**不是**「已公告 vs 進度中」兩段
          ——後者不隨頁籤改變，三個維度頁籤會整個失去意義（`AC-G30`）。
       🔴 `AC-G45`／`A-G2` 之裁量結果＝**兩個區塊各自獨立切換**（各有一組 `role="tablist"`，
          `data-testid` 同為 `org-dimension-tabs`）。理由：兩區回答的是不同問題（「這個月」vs「到目前為止」），
          使用者常需要一邊看公司、一邊看部門；連動會強迫兩邊同維度而少掉一半資訊。
          ⚠ 後果（規格已明載）：下游斷言**必須先以 `within(getByTestId('donut-month'))` 限定容器**，
             全域 `getByRole('tab', {name:'依制定公司'})` 會命中兩個元素。
       🔴 `AC-G71`（本輪之簡化環無 e2e、無視覺回歸）：SVG 一律 `aria-hidden="true"`，
          每一段之組織名與兩個數字皆由**圖例之文字節點**承載；被 Top N 合併之「其他」段，其份數與
          被合併之組織數由**圖形下方之說明行**承載 ⇒ 沒有任何數字之唯一載體是弧長。 -->
  <div class="grid lg:grid-cols-2 gap-4 mb-4">
    <section id="donutMonth" role="region" aria-label="當月已公告" data-testid="donut-month" class="bg-white border border-slate-200 rounded-xl p-5"></section>
    <section id="donutCumulative" role="region" aria-label="累積已公告" data-testid="donut-cumulative" class="bg-white border border-slate-200 rounded-xl p-5"></section>
  </div>

  <!-- ═══ F044 ④ · 最新公告（ICSOP 版本更新）（`AC-G51`～`AC-G58`）═══
       🔴 恰四欄（公告日／版次／程序書書名／狀態），**不得**順手加第五欄。
       ⚠ 母體含「公告日在未來」之進度中文件（`AC-G52`）：依公告日降冪 ⇒ 未來公告日排在最上方。
          這是刻意的——若只含已公告，`狀態` 欄將恆為同一值、零資訊量。 -->
  <section id="latestAnnouncements" role="region" aria-label="最新公告（ICSOP 版本更新）" data-testid="latest-announcements" class="bg-white border border-slate-200 rounded-xl p-5 mb-4"></section>

  <!-- ═══ F044 ⑤ · 依業務/功能類別分布（`AC-G60`～`AC-G68`）═══
       🔴 本區塊之可見性閘門**直接讀功能矩陣**（`canPerform(role,'BUSINESS_CATEGORY_MANAGEMENT','read')`），
          明文禁止寫成角色清單。部門窗口在該功能鍵為 `NONE` ⇒ 整個 `<section>` **完全不進 DOM**
          （不是 `hidden`、不是 `disabled`）⇒ 故以 host 容器承載，由 `renderCategory()` 決定是否產生。 -->
  <div id="categoryHost" class="mb-8"></div>

  <!-- recent activity -->
  <h2 class="text-sm font-semibold text-slate-700 mb-2 flex items-center gap-1.5"><i data-lucide="activity" class="w-4 h-4 text-slate-400"></i>最近活動</h2>
  <div class="bg-white border border-slate-200 rounded-xl divide-y divide-slate-100" id="activityList"></div>
</main>

<div id="toastWrap" class="fixed top-16 right-4 z-[60] space-y-2"></div>

<script>
  /* ===== admin shell sidebar ===== */
  const MENU=[
    {id:'account',label:'帳號管理',icon:'users',roles:{sysadmin:'CRUD',icsop_admin:'唯讀'}},
    /* 🔴 2026-09-02 人類裁決（F025 delta）：「循環管理」自主管權限**移除**（唯讀 → 無）。
       權威＝backend/src/rbac/function-matrix.ts 之 LIFECYCLE_MANAGEMENT（主管＝NONE）；本檔先前落後於已上線程式碼。
       表達方式＝**移除 supervisor 鍵**（比照 settings 等主管無權項之既有寫法；renderSidebar 以 m.roles[role] 過濾）。
       📝 已作廢（僅供追溯，⚠ 不得復原）：OLD> supervisor:'唯讀'
       🔴 與下一項「業務/功能類別管理」（supervisor:'唯讀'）**刻意不同**——同日兩項裁決，一移出一放進（F025 `AC-B29`）；
          主管側欄自此**看得到「業務/功能類別管理」、看不到「循環管理」**，這個不對稱即該斷言之視覺權威。 */
    {id:'lifecycle',label:'循環管理',icon:'workflow',roles:{sysadmin:'唯讀',icsop_admin:'CRUD'}},
    /* 🔵 2026-09-02 F043 AC-43／人類裁決：新側選單項，**置於「循環管理」之後、「ICSOP 文件管理」之前**。 */
    {id:'businesscategory',label:'業務/功能類別管理',icon:'shapes',roles:{sysadmin:'唯讀',icsop_admin:'CRUD',supervisor:'唯讀'}},
    {id:'document',label:'ICSOP 文件管理',icon:'file-text',roles:{sysadmin:'唯讀',icsop_admin:'CRUD',supervisor:'唯讀',deptcontact:'唯讀'}},
    {id:'usageform',label:'使用表單管理',icon:'files',roles:{sysadmin:'唯讀',icsop_admin:'CRUD'}},
    {id:'appendix',label:'附錄管理',icon:'paperclip',roles:{sysadmin:'唯讀',icsop_admin:'CRUD'}},
    {id:'docindex',label:'文件索引管理',icon:'database',roles:{sysadmin:'唯讀',icsop_admin:'CRUD'}},
    /* 🟢 2026-08-28 F042 AC-27／OQ-E11-05=(A)：新功能列與側選單項（位置＝可寫管理群組之末，docindex 之後）。 */
    {id:'ojtprogress',label:'OJT 進度管理',icon:'graduation-cap',roles:{sysadmin:'唯讀',icsop_admin:'CRUD',supervisor:'受限CRUD',deptcontact:'受限CRUD'}},
    {id:'audit',label:'文件調閱歷程',icon:'history',roles:{sysadmin:'唯讀',icsop_admin:'唯讀'}},
    {id:'changehistory',label:'文件變更歷程',icon:'git-compare',roles:{sysadmin:'唯讀',icsop_admin:'唯讀'}},
    {id:'orgsync',label:'組織人員異動管理',icon:'refresh-cw',roles:{sysadmin:'CRUD',icsop_admin:'唯讀'}},
    {id:'settings',label:'系統參數設定',icon:'settings',roles:{sysadmin:'CRUD'}}
  ];
  const CURRENT_MODULE='home';
  /* 🔵 F002 AC-D1／AC-D5（2026-08-16 delta）：側欄最上方「首頁」項。
     刻意**不放進 MENU**——它不對映任何 F025 功能鍵、不經 canPerform 過濾，
     F025 功能矩陣逐格未動、未新增「首頁」列（AC-D5 回歸鎖定）。 */
  const HOME_ITEM={id:'home',label:'首頁',icon:'layout-dashboard',route:'/admin',href:'07-admin-shell.html'};
  function renderSidebar(){
    const role=document.body.dataset.role;
    const items=MENU.filter(m=>m.roles[role]);
    // 🔵 F002 AC-D1（2026-08-16 delta）：「首頁」恆為第一項、不經 F025 角色過濾（四種管理類角色一律顯示）
    const showHome = role!=='user', homeActive = CURRENT_MODULE==='home';
    const homeHtml = showHome ? `<a href="${HOME_ITEM.href}" data-to="${HOME_ITEM.route}" title="${HOME_ITEM.label}" class="sb-item flex items-center gap-2.5 px-2.5 py-2 rounded-md text-sm ${homeActive?'bg-primary-50 text-primary-700 font-medium':'text-slate-600 hover:bg-slate-50'}"><i data-lucide="${HOME_ITEM.icon}" class="w-4 h-4 shrink-0 ${homeActive?'text-primary-600':'text-slate-400'}"></i><span class="sb-label flex-1 truncate">${HOME_ITEM.label}</span></a>` : '';
    document.getElementById('sidebarNav').innerHTML = homeHtml + (items.length? items.map(m=>{
      const active=m.id===CURRENT_MODULE, acc=m.roles[role], ro=acc!=='CRUD';
      return `<a href="#" onclick="return navTo('${m.id}','${m.label}')" title="${m.label}" class="sb-item flex items-center gap-2.5 px-2.5 py-2 rounded-md text-sm ${active?'bg-primary-50 text-primary-700 font-medium':'text-slate-600 hover:bg-slate-50'}"><i data-lucide="${m.icon}" class="w-4 h-4 shrink-0 ${active?'text-primary-600':'text-slate-400'}"></i><span class="sb-label flex-1 truncate">${m.label}</span>${ro?`<span class="sb-label text-[10px] px-1 py-0.5 rounded bg-slate-100 text-slate-500">${acc}</span>`:''}</a>`;
    }).join('') : `<div class="sb-label px-2.5 py-3 text-xs text-slate-400">此角色無後台功能權限</div>`);
    lucide.createIcons();
  }
  function navTo(id,label){ if(id==='changehistory'&&CURRENT_MODULE!=='changehistory'){location.href='23-change-history.html';return false;} shellToast(id===CURRENT_MODULE?('目前已在「'+label+'」功能區'):('導向「'+label+'」（原型：對應頁面）')); return false; }
  function toggleSidebar(){ document.body.classList.toggle('sb-collapsed'); }
  function openPublic(){ shellToast('已於新視窗開啟前台瀏覽頁（03-public-list）'); }
  function shellToast(msg){ if(typeof toast==='function'){toast('info',msg);} else {alert(msg);} }

  /* ===== dashboard ===== */
  const ROLE_META={

  function orgSegmentOf(doc,dim){
    if(!doc.dept) return {key:SEG_UNSPECIFIED_KEY,label:SEG_UNSPECIFIED};
    const unit=orgUnit(doc.co,doc.dept);
    if(!unit) return {key:SEG_UNSPECIFIED_KEY,label:SEG_UNSPECIFIED};

    if(dim==='company') return {key:doc.co,label:co};
    const div=divisionOf(doc.co,doc.dept);

      if(!div) return {key:SEG_NO_DIVISION_KEY,label:SEG_NO_DIVISION};
      return {key:orgGroupKeyOf(doc.co,div.code),label:[co,orgUnitDisplayName(div)].join(ORG_PATH_SEPARATOR)};
    }
    const parts=[co];
    if(div) parts.push(orgUnitDisplayName(div));
    parts.push(orgUnitDisplayName(unit));
    return {key:orgGroupKeyOf(doc.co,unit.code),label:parts.join(ORG_PATH_SEPARATOR)};

    });
    /* 🔒 **排序規則（2026-09-21 架構定案；此前沒有任何 AC 定義它）**：
         `announced` 降冪 → `label` **序數**昇冪 → `key` 昇冪。
       🔴 **序數比較（`a<b?-1:a>b?1:0`），不是 `localeCompare`**——中文定序隨執行環境之 ICU 版本漂移，
          本 repo 已記錄「同一份資料在不同機器排出不同順序、測試一邊綠一邊紅」之缺陷。
          📌 示範語料**刻意**安排兩組「改用 locale 比較就會換位」之並列，使這條規則有鑑別力：
             · 部門維度、`announced` 同為 3：`和潤企業 / 管理本部 / 財會部` 與 `和潤企業 / 風險本部 / 信用審查部`
               —— 序數：財會部在前（管 U+7BA1 ＜ 風 U+98A8）；zh-TW locale：信用審查部在前（feng ＜ guan）。
             · 本部維度、`announced` 同為 2：`和潤電能 / 能源本部` 與 `未指定`
               —— 序數：能源本部在前（和 U+548C ＜ 未 U+672A）；zh-TW locale：未指定在前。
       🔴 **`未指定`／`無本部` 兩個 sentinel 段參與同一排序，刻意 _不_ 置底**——依 `announced` 數量落在
          該落的位置（本語料：部門維度之 `未指定` 排第 7／共 11，後面還有四個真實組織；本部維度之
          `無本部` 排第 4／共 6）。這與直覺相反，但釘在最後會讓「它們也是一筆資料」這件事消失，
          且下游會據以寫出一條與規則相反的斷言。
       ⚠ **第三段（`key` 序數）在本語料下從不觸發**：`label` 逐段唯一，比較在第二段就分出勝負。
          ⇒ sentinel 段的位置由 **`label`**（`未指定`／`無本部`）決定，**不是**由 `__unspecified__`／
            `__no_division__` 的低序數決定；上面兩張表列的位置即實際渲染結果（已由煙霧測試逐列斷言）。
          🔴 日後若出現兩個 `label` 相同的段，第三段才會生效，屆時 `__` 開頭之鍵會排在中日文字之前。 */
    return order.map(function(k){ return map[k]; }).sort(function(a,b){
      if(b.announced!==a.announced) return b.announced-a.announced;
      if(a.label!==b.label) return a.label<b.label?-1:1;
      return a.key<b.key?-1:a.key>b.key?1:0;
    });
  }
  /* 圖形上之弧（Top N ＋ `其他`）。🔴 `其他` 之值＝被合併各組織已公告數之**總和**，不四捨五入、不省略。 */
  function donutArcs(rows){
    const arcs=rows.slice(0,DONUT_TOP_N).map(function(r,i){
      return {label:r.label,value:r.announced,color:DONUT_PALETTE[i%DONUT_PALETTE.length],merged:0};
    });
    const rest=rows.slice(DONUT_TOP_N);
    if(rest.length){
      arcs.push({label:SEG_OTHER,color:DONUT_OTHER_COLOR,merged:rest.length,
        value:rest.reduce(function(a,r){ return a+r.announced; },0)});
    }
    return arcs;
  }

  /* 🔒 `AC-G53`／`AC-G54`：依 `announcedDate` 降冪；同日以 `documentNumber` 昇冪、仍同值以 id 昇冪收尾
     （完全決定性）。🔴 比較子為**序數比較**，明文禁止 `localeCompare`。**先排序、再截斷**。 */
  function latestAnnouncements(docs,limit){
    const pool=docs.filter(function(d){ return d.status==='active' && d.date; });
    const sorted=pool.slice().sort(function(a,b){
      if(a.date!==b.date) return a.date<b.date?1:-1;
      if(a.num!==b.num) return a.num<b.num?-1:1;
      return a.id<b.id?-1:a.id>b.id?1:0;
    });
    return sorted.slice(0,limit);
  }

  /* 🔒 `AC-G61`：統計單位＝**類別**（非節點），同一份文件在同一類別內**只計一次**（相異 documentId）。
     🔒 `AC-G62`：僅 `status==='active'` 之文件計入，並依 `deriveDisplayStatus` 分兩色；
        `inactive`／`void` **完全不計入**（雙色既然逐字就是那兩種，第三、四種狀態沒有可落之色）。
     🔒 `AC-G63`：停用之類別不顯示；掛載文件數為 0 之類別不顯示。
     🔒 `AC-G64`：總數降冪 → 顯示名昇冪（序數）→ categoryId 昇冪（絕對決定性），**禁 localeCompare**。 */
  function categoryDistribution(docs,cats){
    const byCat={};
    cats.forEach(function(c){ byCat[c.id]={}; });
    docs.forEach(function(d){
      if(d.status!=='active') return;
      (d.cats||[]).forEach(function(m){ if(byCat[m[0]]) byCat[m[0]][d.id]=1; });
    });
    cats.forEach(function(c){
      (c.demoDocs||[]).forEach(function(id){ const d=DOC_INDEX[id]; if(d&&d.status==='active') byCat[c.id][id]=1; });
    });
    const rows=[];
    cats.forEach(function(c){
      if(c.status!=='active') return;
      let a=0,p=0;
      Object.keys(byCat[c.id]).forEach(function(id){
        const d=DOC_INDEX[id];
        if(deriveDisplayStatus(d.status,d.date,TODAY)==='announced') a++; else p++;
      });
      if(a+p===0) return;
      rows.push({id:c.id,label:businessCategoryDisplayName(c),announced:a,inProgress:p,total:a+p});
    });
    return rows.sort(function(x,y){
      if(y.total!==x.total) return y.total-x.total;
      if(x.label!==y.label) return x.label<y.label?-1:1;
      return x.id<y.id?-1:x.id>y.id?1:0;
    });
  }

  /* 📌 `AC-G9`～`AC-G15` 之可測形狀：純函式 `ojtOnTimeRate(rows, today)`。
     🔴 分母＝相異 `(companyCode, orgCode)` **複合鍵**（單以 orgCode 分組會把不同公司的兩個部併成一組）；
        分子＝該單位在窗口內之**全部**應完成文件皆已完成者（部分完成不算）。
     🔴 `denominator === 0` 時**省略 `rate` 鍵**（比照 F042 `coverage.rate` 之既有紀律）。 */
  function ojtOnTimeRate(rows,today){
    const from=addMonthsClamped(today,-1);
    const ex={inactive:0,orphaned:0,noDate:0};
    const units={}, keys=[];
    rows.forEach(function(r){
      if(r.isActive===false){ ex.inactive++; return; }
      if(r.orphaned){ ex.orphaned++; return; }
      if(!r.announcedDate){ ex.noDate++; return; }
      const due=addMonthsClamped(r.announcedDate,1);
      if(due<from||due>today) return;                 /* 窗口外：不排除、也不計入（不是「被排除」） */
      const k=orgGroupKeyOf(r.co,r.org);
      if(!units[k]){ units[k]={total:0,done:0}; keys.push(k); }
      units[k].total++;
      if(r.completed) units[k].done++;
    });
    let numerator=0;
    keys.forEach(function(k){ if(units[k].total>0&&units[k].done===units[k].total) numerator++; });
    const out={numerator:numerator,denominator:keys.length,windowFrom:from,windowTo:today,
      excludedInactive:ex.inactive,excludedOrphaned:ex.orphaned,excludedNoAnnouncedDate:ex.noDate};
    if(out.denominator>0) out.rate=coveragePercent(numerator,out.denominator);
    return out;
  }

  /* ═════════════════ F044 · 渲染 ═════════════════ */

  function emptyState(text,hint){
    return `<div data-testid="empty-state" class="text-center py-8 px-4">

      <p class="text-sm text-slate-500">${esc(text)}</p>
      ${hint?`<p class="text-xs text-slate-400 mt-1">${esc(hint)}</p>`:''}
    </div>`;
  }

  /* ───── ① 四張統計卡 ───── */

       ——四種角色對「ICSOP 文件管理」皆有 READ 以上，看得到清單卻看不到其總數會是說不通的不對稱。 */
    const cards=[

  /* 卡④：OJT 準時完成率(1個月內)
     🔒 `AC-G17`：**僅** ICSOPAdmin／SysAdmin 進 DOM（不是 hidden、不是 disabled）——主管與部門窗口
        連同「查看明細」連結一起看不到。述詞＝既有之 `canViewDashboard`。
     🔒 `AC-G13`：數值句逐字 `已完成 {X} / 應完成 {Y}（{Z}%）`——`/` 兩側各恰一個半形空格、括號為全形、% 為半形。
     🔒 `AC-G14`：分母為 0 ⇒ 省略比率並顯示明確空狀態；🔴 明文禁止 `NaN%`／`0%`／`100%`／空白
        （`0%` 與「全部未完成」無從分辨，`100%` 是謊報）。
     🔒 `AC-G15`：排除註記**恆顯示**（含排除 0 筆時之明確說明），比照 25-ojt-progress 之 `#inactiveNote`。 */
  function ojtCardHtml(role){
    const r=ojtOnTimeRate(scenarioOjtRows(),TODAY);
    const showLink=canPerform(role,'OJT_PROGRESS_MANAGEMENT','read');
    const value = r.denominator>0
      ? `<div data-testid="stat-value" class="mt-2 text-xl font-bold text-slate-900"><span data-testid="ojt-ontime-value" class="mono">已完成 ${r.numerator} / 應完成 ${r.denominator}（${r.rate}%）</span></div>`
      : `<div data-testid="empty-state" class="mt-2 flex items-start gap-1.5 text-sm text-slate-500"><i data-lucide="info" class="w-4 h-4 mt-0.5 shrink-0 text-slate-400"></i><span data-testid="ojt-ontime-value">近 1 個月內無應完成之 OJT 單位</span></div>`;
    const exTotal=r.excludedInactive+r.excludedOrphaned+r.excludedNoAnnouncedDate;
    const head = r.denominator>0
      ? `母體＝應完成訓練日期落在 <span class="mono">${r.windowFrom}</span> ～ <span class="mono">${r.windowTo}</span> 之使用單位，共 <span class="mono">${r.denominator}</span> 個，其中 <span class="mono">${r.numerator}</span> 個已全部完成`
      : `母體＝應完成訓練日期落在 <span class="mono">${r.windowFrom}</span> ～ <span class="mono">${r.windowTo}</span> 之使用單位，目前為 <span class="mono">0</span> 個，故<strong class="text-slate-600">不計算比率</strong>`;
    const exPart = exTotal>0
      ? `；本次共排除 <span class="mono">${exTotal}</span> 列——<strong class="text-slate-600">已裁撤單位</strong> ${r.excludedInactive} 列、<strong class="text-slate-600">單位已移出使用部門</strong> ${r.excludedOrphaned} 列、<strong class="text-slate-600">無公告日期</strong> ${r.excludedNoAnnouncedDate} 列`
      : `；已裁撤單位、已移出使用部門與無公告日期之列皆不計入，目前無任何進度列因此被排除`;
    return `<div data-testid="stat-card-ojt-ontime" class="bg-white border border-slate-200 rounded-xl p-4">
      <div class="flex items-center gap-2">
        <span class="w-8 h-8 rounded-lg flex items-center justify-center shrink-0" style="background:#FEF3C7"><i data-lucide="graduation-cap" class="w-4 h-4" style="color:#B45309"></i></span>
        <span class="text-sm font-medium text-slate-700">OJT 準時完成率</span><span class="text-xs text-slate-400">(1個月內)</span>
      </div>
      ${value}
      <p data-testid="ojt-ontime-exclusion-note" class="mt-2 text-[11px] leading-relaxed text-slate-500">${head}${exPart}。被排除之進度列於「OJT 資料清單」分頁<strong class="text-slate-600">仍然呈現</strong>，故兩處數字不相等屬正常。</p>
      ${showLink?`<a role="link" href="25-ojt-progress.html?tab=sessions&amp;sort=incomplete-first" class="mt-2 inline-flex items-center gap-1 text-xs text-primary-600 hover:text-primary-700 hover:underline">查看明細<i data-lucide="arrow-right" class="w-3.5 h-3.5"></i></a>`:''}
    </div>`;
  }

  /* ───── ③ 兩張環圖 ───── */
  const ORG_DIMS=[{k:'company',label:'依制定公司'},{k:'division',label:'依制定本部'},{k:'department',label:'依制定部門'}];
  const DONUT_META={
    month:     {tid:'donut-month',     title:'當月已公告', desc:'統計公告日落在本月（'+CURRENT_MONTH+'）之已公告文件；環的**每一段＝一個組織**。'},
    cumulative:{tid:'donut-cumulative',title:'累積已公告', desc:'統計全部已公告文件，**不限時間**；環的每一段＝一個組織。'}
  };
  function renderDonutRegion(key){
    const meta=DONUT_META[key], dim=donutDim[key];
    const rows=donutRows(key,dim), arcs=donutArcs(rows), segs=donutSegments(arcs.map(function(a){return a.value;}));
    const total=rows.reduce(function(a,r){ return a+r.announced; },0);
    const tabs=ORG_DIMS.map(function(d){
      const on=d.k===dim;
      return `<button type="button" role="tab" id="tab-${key}-${d.k}" aria-selected="${on}" aria-controls="panel-${key}" tabindex="${on?0:-1}" onclick="setDonutDim('${key}','${d.k}')" onkeydown="onOrgDimKey(event,'${key}','${d.k}')" class="px-2.5 py-1.5 text-xs rounded-md border transition ${on?'bg-primary-50 border-primary-300 text-primary-700 font-medium':'bg-white border-slate-200 text-slate-500 hover:bg-slate-50'}">${d.label}</button>`;
    }).join('');
    const merged=arcs.length&&arcs[arcs.length-1].label===SEG_OTHER? arcs[arcs.length-1] : null;
    /* 🔴 「靜默 top-N 才是缺陷」：截斷時必須說清楚**被合併幾個組織／合計幾份／憑什麼是這 8 段**，
       並指出完整清單在哪。未截斷時本行仍在，但明說「未達合併上限」，使其負向斷言有鑑別力。 */
    const trunc = merged
      ? `圖形僅繪出份數最多的 <span class="mono">${DONUT_TOP_N}</span> 個組織（排序＝已公告份數由多至少），其餘 <span class="mono">${merged.merged}</span> 個組織合併為「<strong class="text-slate-600">${SEG_OTHER}</strong>」，已公告合計 <span class="mono">${merged.value}</span> 份。<strong class="text-slate-600">下方圖例仍逐列列出全部 ${rows.length} 個組織</strong>，沒有任何數字只存在於圖形裡。`
      : `本維度共 <span class="mono">${rows.length}</span> 個組織，未達 <span class="mono">${DONUT_TOP_N}</span> 段之合併上限，圖形已繪出全部組織（無「${SEG_OTHER}」段）。`;
    const body = total===0
      ? emptyState(key==='month'?('本月（'+CURRENT_MONTH+'）尚無已公告之 ICSOP 文件'):'目前尚無已公告之 ICSOP 文件',
                   '文件於「ICSOP 文件管理」建立並設定公告日期後，公告日一到即會出現在此。')
      : `<div class="flex items-start gap-4">
          <div class="relative shrink-0 w-[140px] h-[140px]">
            <svg viewBox="0 0 140 140" class="w-[140px] h-[140px]" aria-hidden="true" focusable="false">
              <circle cx="70" cy="70" r="${DONUT_R}" fill="none" stroke="#F1F5F9" stroke-width="18"></circle>
              ${arcs.map(function(a,i){
                return `<circle cx="70" cy="70" r="${DONUT_R}" fill="none" stroke="${a.color}" stroke-width="18" stroke-dasharray="${segs[i].length.toFixed(3)} ${(DONUT_C-segs[i].length).toFixed(3)}" stroke-dashoffset="${(-segs[i].offset).toFixed(3)}" transform="rotate(-90 70 70)"></circle>`;
              }).join('')}
            </svg>
            <div class="absolute inset-0 flex flex-col items-center justify-center pointer-events-none">
              <span data-donut-total class="text-2xl font-bold text-slate-900 mono">${total}</span>
              <span class="text-[10px] text-slate-400">已公告合計（份）</span>
            </div>
          </div>
          <div class="min-w-0 flex-1">
            <p data-donut-truncation class="text-[11px] leading-relaxed text-slate-500">${trunc}</p>
            <p class="mt-2 text-[11px] leading-relaxed text-slate-400 flex items-start gap-1.5"><i data-lucide="info" class="w-3.5 h-3.5 mt-0.5 shrink-0"></i><span>「進度中」不分時間（＝當下尚未到公告日）⇒ <strong class="text-slate-500">同一個組織在「當月已公告」與「累積已公告」兩張圖上的「進度中」必為同值</strong>，這是同一個事實，不是重複貼上。</span></p>
          </div>
        </div>
        <ul role="list" data-testid="donut-legend" class="mt-3 max-h-[184px] overflow-y-auto pr-1 border-t border-slate-100 divide-y divide-slate-100">
          ${rows.map(function(r,i){
            const dot=i<DONUT_TOP_N?DONUT_PALETTE[i%DONUT_PALETTE.length]:DONUT_OTHER_COLOR;
            return `<li role="listitem" data-testid="donut-legend-row" data-org-key="${esc(r.key)}" class="flex items-center gap-2 py-1.5">
              <span aria-hidden="true" class="w-2.5 h-2.5 rounded-full shrink-0" style="background:${dot}"></span>
              <span data-testid="legend-org-name" class="text-xs text-slate-700 flex-1 truncate" title="${esc(r.label)}">${esc(r.label)}</span>
              <span data-testid="legend-announced" class="text-xs mono whitespace-nowrap" style="color:${C_ANNOUNCED}">已公告 ${r.announced}</span>
              <span data-testid="legend-in-progress" class="text-xs mono whitespace-nowrap" style="color:${C_IN_PROGRESS}">進度中 ${r.inProgress}</span>
            </li>`;
          }).join('')}
        </ul>`;
    document.getElementById(key==='month'?'donutMonth':'donutCumulative').innerHTML=
      `<div class="flex items-center gap-2 mb-1"><i data-lucide="target" class="w-4 h-4 text-primary-600"></i><h2 class="font-semibold text-slate-900">${meta.title}</h2></div>
       <p class="text-xs text-slate-400 mb-3">${meta.desc.replace(/\*\*(.+?)\*\*/g,'<strong class="text-slate-500">$1</strong>')}</p>
       <div role="tablist" aria-label="制定組織維度" data-testid="org-dimension-tabs" class="flex flex-wrap gap-1.5 mb-3">${tabs}</div>
       <div role="tabpanel" id="panel-${key}" data-testid="donut-panel" aria-labelledby="tab-${key}-${dim}" tabindex="0">${body}</div>`;
  }
  /* 🔒 `AC-G44`：可手動切換、**不記憶**（不寫 localStorage／sessionStorage／偏好表）；
     重新整理或重新進入首頁一律回到**職位預設值**。 */
  function setDonutDim(key,dim){
    donutDim[key]=dim;
    renderDonutRegion(key);
    lucide.createIcons();
    const el=document.getElementById('tab-'+key+'-'+dim);
    if(el) el.focus();
  }
  /* `AC-G31`：←／→ 切換；Enter／Space 由 `<button>` 原生觸發 click。 */
  function onOrgDimKey(e,key,dim){
    const i=ORG_DIMS.map(function(d){return d.k;}).indexOf(dim);
    let j=-1;
    if(e.key==='ArrowRight'||e.key==='Right') j=(i+1)%ORG_DIMS.length;
    else if(e.key==='ArrowLeft'||e.key==='Left') j=(i-1+ORG_DIMS.length)%ORG_DIMS.length;
    else return;
    e.preventDefault();
    setDonutDim(key,ORG_DIMS[j].k);
  }

  /* ───── ④ 最新公告（ICSOP 版本更新）───── */
  const LATEST_LIMIT=10;
  const EDITION_NONE_TEXT='未設版次';   /* 🔒 沿用 F042 既有常數，禁止新增第二個 */
  function renderLatest(){
    const role=document.body.dataset.role;
    const pool=scenarioDocs().filter(function(d){ return d.status==='active'&&d.date; });
    const rows=latestAnnouncements(scenarioDocs(),LATEST_LIMIT);
    /* 🔒 `AC-G58`：閘門**讀矩陣**（`ICSOP_DOCUMENT_MANAGEMENT` / read），禁止寫成角色清單。
       🔴 導向**不帶狀態篩選**——連結叫「查看更多」，帶篩選會看到更少。 */
    const more=canPerform(role,'ICSOP_DOCUMENT_MANAGEMENT','read')
      ? `<a role="link" href="13-document-list.html?sortBy=announcedDate&amp;sortDir=desc" class="ml-auto inline-flex items-center gap-1 text-xs text-primary-600 hover:text-primary-700 hover:underline">查看更多<i data-lucide="arrow-right" class="w-3.5 h-3.5"></i></a>`
      : '';
    const body = rows.length===0
      ? emptyState('目前沒有可呈現的 ICSOP 版本更新','清單來源＝「ICSOP 文件管理」中儲存狀態為有效、且已設定公告日期之文件；依公告日降冪排列。')
      : `<div class="overflow-x-auto">
          <table role="table" class="w-full text-sm">
            <thead class="text-xs text-slate-500 border-b border-slate-200">
              <tr>
                <th role="columnheader" scope="col" class="text-left font-medium px-3 py-2 whitespace-nowrap">公告日</th>
                <th role="columnheader" scope="col" class="text-left font-medium px-3 py-2 whitespace-nowrap">版次</th>
                <th role="columnheader" scope="col" class="text-left font-medium px-3 py-2">程序書書名</th>
                <th role="columnheader" scope="col" class="text-left font-medium px-3 py-2 whitespace-nowrap">狀態</th>
              </tr>
            </thead>
            <tbody class="divide-y divide-slate-100">
              ${rows.map(function(d){
                const st=deriveDisplayStatus(d.status,d.date,TODAY);
                const pill=st==='announced'
                  ? `<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-xs font-medium whitespace-nowrap" style="color:${C_ANNOUNCED};background:#D1FAE5"><i data-lucide="megaphone" class="w-3 h-3"></i>${DISPLAY_LABEL[st]}</span>`
                  : `<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-xs font-medium whitespace-nowrap" style="color:${C_IN_PROGRESS};background:#EAF1FA"><i data-lucide="clock" class="w-3 h-3"></i>${DISPLAY_LABEL[st]}</span>`;
                return `<tr data-doc-id="${d.id}">
                  <td class="px-3 py-2 mono text-slate-600 whitespace-nowrap">${d.date}</td>
                  <td class="px-3 py-2 mono text-slate-600 whitespace-nowrap">${d.ed? esc(d.ed) : EDITION_NONE_TEXT}</td>
                  <td class="px-3 py-2 text-slate-700 max-w-[340px] truncate" title="${esc(d.name)}">${esc(d.name)}</td>
                  <td class="px-3 py-2">${pill}</td>
                </tr>`;
              }).join('')}
            </tbody>
          </table>
        </div>
        <p class="mt-2 text-[11px] text-slate-400">依公告日降冪排列，共 <span class="mono">${pool.length}</span> 份符合條件，此處呈現最新 <span class="mono">${rows.length}</span> 份。⚠ 公告日在未來者（狀態為「進度中」）依降冪排在最上方，屬正常。</p>`;
    document.getElementById('latestAnnouncements').innerHTML=
      `<div class="flex items-center gap-2 mb-3"><i data-lucide="megaphone" class="w-4 h-4 text-primary-600"></i><h2 class="font-semibold text-slate-900">最新公告（ICSOP 版本更新）</h2>${more}</div>${body}`;
  }

  /* ───── ⑤ 依業務/功能類別分布 ───── */
  const CATEGORY_LIMIT=10;
  function renderCategory(){
    const role=document.body.dataset.role, host=document.getElementById('categoryHost');
    /* 🔒 `AC-G66`：閘門**讀矩陣值**（`BUSINESS_CATEGORY_MANAGEMENT` / read），明文禁止寫成
       `role !== 'deptcontact'` 之角色清單。部門窗口在該功能鍵為 `NONE` ⇒ 整個 `<section>` 不進 DOM。 */
    if(!canPerform(role,'BUSINESS_CATEGORY_MANAGEMENT','read')){ host.innerHTML=''; return; }
    const all=categoryDistribution(scenarioDocs(),scenarioCategories());
    const shown=categoryExpanded? all : all.slice(0,CATEGORY_LIMIT);
    const max=all.reduce(function(m,r){ return r.total>m?r.total:m; },0);
    const poolBtn=`<button type="button" onclick="toggleCategoryDemoPool()" class="ml-auto text-[11px] px-2 py-1 rounded border border-slate-200 text-slate-500 hover:bg-slate-50">${categoryDemoPool?'示範語料：完整類別池（14 類）':'示範語料：預設類別池（4 類）'}</button>`;
    const body = all.length===0
      ? emptyState('目前沒有可呈現的業務/功能類別','長條來源＝「業務/功能類別管理」中狀態為啟用、且掛有有效文件之類別；停用之類別與掛載數為 0 者不列出。')
      : `<p class="text-xs text-slate-400 mb-3 flex items-start gap-1.5"><i data-lucide="info" class="w-3.5 h-3.5 mt-0.5 shrink-0"></i><span>統計單位＝<strong class="text-slate-500">類別</strong>（非節點），同一份文件在同一類別內只計一次；僅計入儲存狀態為<strong class="text-slate-500">有效</strong>之文件。⚠ 一份文件可掛多個類別（會各計一次），未掛任何類別之文件不出現 ⇒ <strong class="text-slate-500">各類別合計與上方卡片刻意不相等</strong>。</span></p>
        <div class="flex items-center gap-3 mb-2 text-xs">
          <span class="inline-flex items-center gap-1"><span aria-hidden="true" class="w-2.5 h-2.5 rounded-sm" style="background:${C_ANNOUNCED}"></span><span class="text-slate-500">已公告</span></span>
          <span class="inline-flex items-center gap-1"><span aria-hidden="true" class="w-2.5 h-2.5 rounded-sm" style="background:${C_IN_PROGRESS}"></span><span class="text-slate-500">進度中</span></span>
        </div>
        <ul role="list" class="divide-y divide-slate-100 border-t border-slate-100">
          ${shown.map(function(r){
            const w=barWidths(r.announced,r.inProgress,max);
            return `<li role="listitem" data-testid="category-bar-row" data-category-id="${esc(r.id)}" class="py-2">
              <div class="flex items-center gap-2">
                <span data-testid="bar-category-name" class="text-sm text-slate-700 flex-1 truncate" title="${esc(r.label)}">${esc(r.label)}</span>
                <span data-testid="bar-announced" class="text-xs mono whitespace-nowrap" style="color:${C_ANNOUNCED}">已公告 ${r.announced}</span>
                <span data-testid="bar-in-progress" class="text-xs mono whitespace-nowrap" style="color:${C_IN_PROGRESS}">進度中 ${r.inProgress}</span>
              </div>
              <svg viewBox="0 0 100 8" preserveAspectRatio="none" class="mt-1.5 w-full h-2" aria-hidden="true" focusable="false">
                <rect x="0" y="0" width="100" height="8" fill="#F1F5F9"></rect>
                <rect x="0" y="0" width="${w.announced.toFixed(3)}" height="8" fill="${C_ANNOUNCED}"></rect>
                <rect x="${w.announced.toFixed(3)}" y="0" width="${w.inProgress.toFixed(3)}" height="8" fill="${C_IN_PROGRESS}"></rect>
              </svg>
            </li>`;
          }).join('')}
        </ul>
        ${all.length>CATEGORY_LIMIT
          ? (categoryExpanded
              ? `<div class="mt-3"><button type="button" onclick="toggleCategoryExpand()" class="inline-flex items-center gap-1 text-xs text-primary-600 hover:text-primary-700 hover:underline">僅顯示前 ${CATEGORY_LIMIT} 類<i data-lucide="arrow-right" class="w-3.5 h-3.5"></i></button></div>`
              : `<div class="mt-3"><p class="text-[11px] text-slate-500">目前顯示總數最多的前 <span class="mono">${CATEGORY_LIMIT}</span> 類（排序＝已公告＋進度中之總數由多至少），另有 <span class="mono">${all.length-CATEGORY_LIMIT}</span> 類未列出。</p><button type="button" onclick="toggleCategoryExpand()" class="mt-1 inline-flex items-center gap-1 text-xs text-primary-600 hover:text-primary-700 hover:underline">顯示全部類別<i data-lucide="arrow-right" class="w-3.5 h-3.5"></i></button></div>`)
          : `<p class="mt-3 text-[11px] text-slate-400">共 <span class="mono">${all.length}</span> 類，未達 <span class="mono">${CATEGORY_LIMIT}</span> 類之顯示上限，已全部列出。</p>`}`;
    host.innerHTML=`<section role="region" aria-label="依業務/功能類別分布" data-testid="category-distribution" class="bg-white border border-slate-200 rounded-xl p-5">
      <div class="flex items-center gap-2 mb-1"><i data-lucide="shapes" class="w-4 h-4 text-primary-600"></i><h2 class="font-semibold text-slate-900">依業務/功能類別分布</h2>${poolBtn}</div>
      <div class="mt-2">${body}</div>
    </section>`;
  }
  /* 🔒 `AC-G65`：展開狀態**不跨 session 記憶**（與 `AC-G44` 同紀律）。 */
  function toggleCategoryExpand(){ categoryExpanded=!categoryExpanded; renderCategory(); lucide.createIcons(); }
  function toggleCategoryDemoPool(){ categoryDemoPool=!categoryDemoPool; categoryExpanded=false; renderCategory(); lucide.createIcons(); }

  /* ───── 原型專用之模擬器 ───── */
  function setDefaultDimension(v){
    defaultDim=normalizeDefaultDimension(v);
    renderDash();
  }
  function setDemoScenario(v){ demoScenario=v; categoryExpanded=false; renderDash(); }

  /* ───── 儀表板總繪 ───── */
  function renderDash(){
    const role=document.body.dataset.role;
    const [label,color,icon]=ROLE_META[role];
    document.getElementById('roleBadge').innerHTML=`<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-xs font-medium text-white" style="background:${color}"><i data-lucide="${icon}" class="w-3 h-3"></i>${label}</span>`;
    /* 🔒 `AC-G42`／`AC-G44`：每次完整重繪一律回到**端點回傳之 `defaultDimension`**，不記憶上次的選擇。 */
    const def=normalizeDefaultDimension(defaultDim);
    donutDim.month=def; donutDim.cumulative=def;
    renderStatCards();
    renderDonutRegion('month');
    renderDonutRegion('cumulative');
    renderLatest();
    renderCategory();
    /* 🔒 `AC-G22`／`OQ-D44-05`：「最近活動」區塊**一字不動**。 */
    document.getElementById('activityList').innerHTML=ACTIVITY.map(([ic,txt,time,col])=>`
      <div class="flex items-center gap-3 px-4 py-3">
        <span class="w-8 h-8 rounded-full bg-slate-50 flex items-center justify-center shrink-0"><i data-lucide="${ic}" class="w-4 h-4" style="color:${col}"></i></span>
        <span class="text-sm text-slate-700 flex-1">${txt}</span>
        <span class="text-xs text-slate-400 mono shrink-0">${time}</span>
      </div>`).join('');
    lucide.createIcons();
  }

  function setRole(r){
    document.body.dataset.role=r;
    document.getElementById('blockOverlay').classList.toggle('hidden',r!=='user');
    renderSidebar();
    if(r!=='user') renderDash();
    lucide.createIcons();
  }

  function toast(type,msg,code){
    const map={success:['check-circle-2','#059669'],error:['alert-circle','#DC2626'],info:['info','#365C97']};
    const [ic,color]=map[type]||map.info;
    const el=document.createElement('div');
    el.className='flex items-start gap-2 bg-white border border-slate-200 shadow-lg rounded-lg px-4 py-3 text-sm max-w-sm';
    el.style.borderLeft='4px solid '+color;
    el.innerHTML=`<i data-lucide="${ic}" class="w-4 h-4 mt-0.5" style="color:${color}"></i><div><span class="text-slate-700">${msg}</span>${code?`<div class="text-[10px] mono text-slate-400 mt-0.5">${code}</div>`:''}</div>`;
    document.getElementById('toastWrap').appendChild(el);lucide.createIcons();
    setTimeout(()=>{el.style.transition='opacity .3s';el.style.opacity='0';setTimeout(()=>el.remove(),300);},4000);
  }

  renderSidebar(); renderDash(); lucide.createIcons();
</script>
</body>
</html>
