<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>循環池管理 · 後台</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = { theme: { extend: {
    fontFamily: { sans: ['Inter','Noto Sans TC','sans-serif'] },
    colors: { primary: { 50:'#F3F7FC',100:'#EAF1FA',200:'#CFDFF3',300:'#98B6E4',400:'#6E96D4',500:'#4A72AE',600:'#365C97',700:'#2A4A7E' } }
  }}}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono&display=swap" rel="stylesheet" />
<script src="https://unpkg.com/lucide@latest"></script>
<style>
  body{font-family:'Inter','Noto Sans TC',sans-serif;color:#334155;background:#FFFFFF;}
  .mono{font-family:'JetBrains Mono',monospace;}
  body:not([data-role="icsop_admin"]) .write-only{display:none !important;}
  /* admin shell sidebar */
  #sidebar{width:240px;transition:width .2s ease;}
  body{padding-left:240px;transition:padding-left .2s ease;}
  body.sb-collapsed{padding-left:60px;}
  body.sb-collapsed #sidebar{width:60px;}
  body.sb-collapsed .sb-label{display:none;}
  body.sb-collapsed #sidebarNav .sb-item{justify-content:center;padding-left:0;padding-right:0;}
</style>
</head>
<body data-role="icsop_admin" class="min-h-screen">

<!-- ===== Admin shell sidebar ===== -->
<aside id="sidebar" class="fixed left-0 top-0 bottom-0 z-50 bg-white border-r border-slate-200 flex flex-col">
  <div class="h-14 flex items-center gap-2 px-3 border-b border-slate-200 shrink-0">
    <div class="w-8 h-8 rounded-lg bg-primary-600 flex items-center justify-center text-white shrink-0"><i data-lucide="file-text" class="w-5 h-5"></i></div>
    <span class="sb-label font-bold text-slate-900 text-sm truncate">ICSOP 後台</span>
  </div>
  <nav id="sidebarNav" class="flex-1 overflow-y-auto py-2 px-2 space-y-0.5"></nav>
  <div class="border-t border-slate-200 p-2 shrink-0">
    <button onclick="openPublic()" title="瀏覽文件網頁（開新視窗）" class="sb-item w-full flex items-center gap-2.5 px-2.5 py-2 rounded-md text-sm text-slate-600 hover:bg-slate-50">
      <i data-lucide="external-link" class="w-4 h-4 shrink-0"></i><span class="sb-label truncate">瀏覽文件網頁</span></button>
  </div>
</aside>

<!-- Top bar -->
<header class="sticky top-0 z-30 bg-white border-b border-slate-200">
  <div class="h-14 px-4 flex items-center gap-3">
    <button onclick="toggleSidebar()" title="收合/展開選單" class="text-slate-400 hover:text-slate-600"><i data-lucide="panel-left" class="w-5 h-5"></i></button>
    <div class="leading-tight min-w-0">
      <div class="text-xs text-slate-400 flex items-center gap-1"><span>循環管理</span><i data-lucide="chevron-right" class="w-3 h-3"></i><span>循環池</span></div>
      <div class="font-semibold text-slate-900 text-sm truncate">循環（Life Cycle）池管理</div>
    </div>
    <div class="ml-auto flex items-center gap-2">
      <button onclick="openCreate()" class="write-only inline-flex items-center gap-1.5 px-3 py-1.5 rounded-md bg-primary-600 text-white text-sm font-medium hover:bg-primary-700"><i data-lucide="plus" class="w-4 h-4"></i>新增循環</button>
      <div class="flex items-center gap-1.5 pl-2 border-l border-slate-200">
        <i data-lucide="users" class="w-4 h-4 text-slate-400"></i>
        <select id="roleSel" onchange="setRole(this.value)" class="text-sm border border-slate-300 rounded-md px-2 py-1.5 bg-white">
          <option value="icsop_admin">ICSOP 管理員</option>
          <option value="supervisor">主管（唯讀）</option>
          <option value="sysadmin">系統管理員（唯讀）</option>
          <option value="deptcontact">部門窗口</option>
          <option value="user">一般使用者</option>
        </select>
      </div>
      <div class="hidden xl:flex items-center gap-1.5 text-sm text-slate-500 pl-2 border-l border-slate-200"><i data-lucide="user-circle" class="w-4 h-4"></i><span>李慧玲</span></div>
      <button title="登出" class="w-8 h-8 rounded-full hover:bg-slate-100 flex items-center justify-center text-slate-500"><i data-lucide="log-out" class="w-4 h-4"></i></button>
    </div>
  </div>
  <!-- readonly banner -->
  <div id="roBanner" class="hidden bg-cyan-50 border-t border-cyan-200 text-cyan-800 text-sm px-4 py-2 items-center gap-2">
    <i data-lucide="eye" class="w-4 h-4"></i>唯讀模式 · 此角色僅可檢視循環與節點，無法新增/編輯/刪除。
  </div>
</header>

<!-- blocked overlay -->
<div id="blockOverlay" class="hidden fixed inset-0 z-40 bg-slate-50/90 backdrop-blur-sm flex items-center justify-center">
  <div class="text-center max-w-xs">
    <div class="w-14 h-14 rounded-full bg-red-50 flex items-center justify-center mx-auto mb-3"><i data-lucide="lock" class="w-7 h-7 text-red-500"></i></div>
    <h3 class="font-semibold text-slate-900">無循環管理權限</h3>
    <p class="text-sm text-slate-500 mt-1" id="blockMsg"></p>
    <p class="text-xs mono text-slate-400 mt-2">PERMISSION_DENIED · 403</p>
  </div>
</div>

<main class="px-4 py-6">
  <!-- toolbar -->
  <div class="flex flex-wrap items-center gap-2 mb-4">
    <div class="relative flex-1 min-w-[200px]">
      <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-3 top-1/2 -translate-y-1/2"></i>
      <input id="kw" oninput="renderTable()" type="search" placeholder="搜尋循環名稱…" class="w-full pl-9 pr-3 py-2 rounded-md border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-primary-600 focus:border-primary-600" />
    </div>
    <select id="fStatus" onchange="renderTable()" class="px-3 py-2 rounded-md border border-slate-300 text-sm bg-white">
      <option value="">所有狀態</option><option value="active">啟用</option><option value="inactive">停用</option>
    </select>
    <span id="countText" class="ml-auto text-sm text-slate-500"></span>
  </div>

  <div class="bg-white border border-slate-200 rounded-xl overflow-hidden">
    <div class="overflow-x-auto">
    <table class="w-full text-sm min-w-[720px]">
      <thead class="bg-slate-50 text-slate-500 text-xs uppercase tracking-wide">
        <tr>
          <th class="text-left font-medium px-4 py-2.5">循環名稱</th>
          <th class="text-left font-medium px-4 py-2.5">狀態</th>
          <th class="text-left font-medium px-4 py-2.5">節點數</th>
          <th class="text-left font-medium px-4 py-2.5">掛載文件</th>
          <th class="text-left font-medium px-4 py-2.5">最後更新</th>
          <th class="text-left font-medium px-4 py-2.5">操作</th>
        </tr>
      </thead>
      <tbody id="tbody" class="divide-y divide-slate-100"></tbody>
    </table>
    </div>
    <div id="emptyState" class="hidden text-center py-14">
      <i data-lucide="inbox" class="w-10 h-10 text-slate-300 mx-auto mb-2"></i>
      <p class="text-slate-500 text-sm">查無符合結果</p>
    </div>
  </div>
</main>

<!-- create / edit modal -->
<div id="lcModal" class="fixed inset-0 z-50 hidden items-center justify-center bg-slate-900/40 p-4">
  <div class="bg-white rounded-xl shadow-xl w-full max-w-md p-6">
    <h3 id="lcTitle" class="font-semibold text-slate-900 mb-4">新增循環</h3>
    <div class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">循環名稱 <span class="text-red-500">*</span></label>
        <input id="lcName" type="text" placeholder="請輸入循環名稱" class="w-full px-3 py-2 rounded-md border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-primary-600" />
        <p id="lcNameErr" class="hidden mt-1 text-xs text-red-600 items-center gap-1"><i data-lucide="alert-circle" class="w-3.5 h-3.5"></i>循環名稱不可為空（LIFECYCLE_NAME_REQUIRED）</p>
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">說明</label>
        <textarea id="lcDesc" rows="3" placeholder="選填" class="w-full px-3 py-2 rounded-md border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-primary-600"></textarea>
      </div>
    </div>
    <div class="flex justify-end gap-2 mt-6">
      <button onclick="closeLc()" class="px-4 py-2 rounded-md border border-slate-300 text-sm hover:bg-slate-50">取消</button>
      <button onclick="submitLc()" class="px-4 py-2 rounded-md bg-primary-600 text-white text-sm hover:bg-primary-700">儲存</button>
    </div>
  </div>
</div>

<!-- confirm modal -->
<div id="confirmModal" class="fixed inset-0 z-50 hidden items-center justify-center bg-slate-900/40 p-4">
  <div class="bg-white rounded-xl shadow-xl w-full max-w-md p-6">
    <div class="flex items-start gap-3">
      <div class="w-10 h-10 rounded-full bg-red-50 flex items-center justify-center shrink-0"><i data-lucide="alert-triangle" class="w-5 h-5 text-red-500"></i></div>
      <div><h3 class="font-semibold text-slate-900" id="cfTitle"></h3><p class="text-sm text-slate-500 mt-1" id="cfBody"></p></div>
    </div>
    <div class="flex justify-end gap-2 mt-6">
      <button onclick="closeConfirm()" class="px-4 py-2 rounded-md border border-slate-300 text-sm hover:bg-slate-50">取消</button>
      <button id="cfOk" class="px-4 py-2 rounded-md bg-red-600 text-white text-sm hover:bg-red-700">確認</button>
    </div>
  </div>
</div>

<div id="toastWrap" class="fixed top-16 right-4 z-[60] space-y-2"></div>

<script>
  /* ===== admin shell sidebar ===== */
  const MENU=[
    {id:'account',label:'帳號管理',icon:'users',roles:{sysadmin:'CRUD',icsop_admin:'唯讀'}},
    {id:'lifecycle',label:'循環管理',icon:'workflow',roles:{sysadmin:'唯讀',icsop_admin:'CRUD',supervisor:'唯讀'}},
    {id:'document',label:'ICSOP 文件管理',icon:'file-text',roles:{sysadmin:'唯讀',icsop_admin:'CRUD',supervisor:'唯讀',deptcontact:'唯讀'}},
    {id:'usageform',label:'使用表單管理',icon:'files',roles:{sysadmin:'唯讀',icsop_admin:'CRUD'}},
    {id:'appendix',label:'附錄管理',icon:'paperclip',roles:{sysadmin:'唯讀',icsop_admin:'CRUD'}},
    {id:'docindex',label:'文件索引管理',icon:'database',roles:{sysadmin:'唯讀',icsop_admin:'CRUD'}},
    {id:'audit',label:'文件調閱歷程',icon:'history',roles:{sysadmin:'唯讀',icsop_admin:'唯讀'}},
    {id:'changehistory',label:'文件變更歷程',icon:'git-compare',roles:{sysadmin:'唯讀',icsop_admin:'唯讀'}},
    {id:'orgsync',label:'組織人員異動管理',icon:'refresh-cw',roles:{sysadmin:'CRUD',icsop_admin:'唯讀'}},
    {id:'settings',label:'系統參數設定',icon:'settings',roles:{sysadmin:'CRUD'}}
  ];
  const CURRENT_MODULE='lifecycle';
  function renderSidebar(){
    const role=document.body.dataset.role;
    const items=MENU.filter(m=>m.roles[role]);
    document.getElementById('sidebarNav').innerHTML = items.length? items.map(m=>{
      const active=m.id===CURRENT_MODULE, acc=m.roles[role], ro=acc!=='CRUD';
      return `<a href="#" onclick="return navTo('${m.id}','${m.label}')" title="${m.label}" class="sb-item flex items-center gap-2.5 px-2.5 py-2 rounded-md text-sm ${active?'bg-primary-50 text-primary-700 font-medium':'text-slate-600 hover:bg-slate-50'}"><i data-lucide="${m.icon}" class="w-4 h-4 shrink-0 ${active?'text-primary-600':'text-slate-400'}"></i><span class="sb-label flex-1 truncate">${m.label}</span>${ro?`<span class="sb-label text-[10px] px-1 py-0.5 rounded bg-slate-100 text-slate-500">${acc}</span>`:''}</a>`;
    }).join('') : `<div class="sb-label px-2.5 py-3 text-xs text-slate-400">此角色無後台功能權限</div>`;
    lucide.createIcons();
  }
  function navTo(id,label){ if(id==='changehistory'&&CURRENT_MODULE!=='changehistory'){location.href='23-change-history.html';return false;} shellToast(id===CURRENT_MODULE?('目前已在「'+label+'」功能區'):('導向「'+label+'」（原型本輪未含此頁）')); return false; }
  function toggleSidebar(){ document.body.classList.toggle('sb-collapsed'); }
  function openPublic(){ shellToast('已於新視窗開啟前台瀏覽頁（03-public-list）'); }
  function shellToast(msg){ if(typeof toast==='function'){toast('info',msg);} else {alert(msg);} }

  /* ===== lifecycle data ===== */
  let seq=9;
  let LIFECYCLES=[
    {id:'lc1',name:'銷售及收款循環',status:'active',nodes:7,updated:'2026-06-18 15:02',docs:8},
    {id:'lc2',name:'採購及付款循環',status:'active',nodes:1,updated:'2026-05-05 10:20',docs:3},
    {id:'lc3',name:'產品企劃循環',status:'active',nodes:3,updated:'2026-06-01 09:15',docs:5},
    {id:'lc4',name:'薪工循環',status:'active',nodes:3,updated:'2026-04-28 16:40',docs:4},
    {id:'lc5',name:'融資循環',status:'active',nodes:4,updated:'2026-05-20 11:00',docs:2},
    {id:'lc6',name:'不動產、廠房及設備循環',status:'active',nodes:1,updated:'2026-03-30 14:12',docs:2},
    {id:'lc7',name:'投資循環',status:'active',nodes:4,updated:'2026-05-14 08:30',docs:3},
    {id:'lc8',name:'電腦化資訊系統控制作業',status:'active',nodes:4,updated:'2026-06-10 13:44',docs:4},
    {id:'lc9',name:'管理性控制作業',status:'active',nodes:4,updated:'2026-06-25 09:50',docs:3}
  ];
  let editingId=null;

  function statusPill(s){
    return s==='active'
      ? `<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-xs font-medium" style="color:#047857;background:#D1FAE5">● 啟用</span>`
      : `<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-xs font-medium bg-slate-100 text-slate-500">● 停用</span>`;
  }

  function renderTable(){
    const kw=(document.getElementById('kw').value||'').trim().toLowerCase();
    const st=document.getElementById('fStatus').value;
    const rows=LIFECYCLES.filter(l=> (!kw||l.name.toLowerCase().includes(kw)) && (!st||l.status===st));
    document.getElementById('countText').textContent=`共 ${rows.length} 個循環`;
    document.getElementById('emptyState').classList.toggle('hidden',rows.length>0);
    document.getElementById('tbody').innerHTML=rows.map(l=>`
      <tr class="hover:bg-slate-50">
        <td class="px-4 py-3"><div class="font-medium text-slate-800">${l.name}</div></td>
        <td class="px-4 py-3">
          <div class="flex items-center gap-2">
            ${statusPill(l.status)}
            <button onclick="openTree('${l.name}')" title="檢視樹狀圖預覽（開新分頁）" aria-label="檢視「${l.name}」樹狀圖預覽" class="w-7 h-7 rounded hover:bg-primary-50 text-primary-600 flex items-center justify-center shrink-0"><i data-lucide="git-fork" class="w-4 h-4"></i></button>
          </div>
        </td>
        <td class="px-4 py-3 text-slate-600">${l.nodes}</td>
        <td class="px-4 py-3">${l.docs>0?`<span class="text-slate-600">${l.docs} 份</span>`:`<span class="text-slate-400">—</span>`}</td>
        <td class="px-4 py-3 text-slate-500 mono text-xs">${l.updated}</td>
        <td class="px-4 py-3">
          <div class="flex items-center justify-start gap-3 text-sm whitespace-nowrap">
            <button onclick="enterCanvas('${l.id}')" class="text-primary-600 hover:text-primary-700 hover:underline font-medium">DAG 畫布</button>
            <button onclick="openEdit('${l.id}')" class="write-only text-slate-600 hover:text-primary-700 hover:underline">編輯</button>
            <button onclick="toggleStatus('${l.id}')" class="write-only text-slate-600 hover:text-primary-700 hover:underline">${l.status==='active'?'停用':'啟用'}</button>
            <button onclick="delLc('${l.id}')" class="write-only text-red-600 hover:text-red-700 hover:underline">刪除</button>
          </div>
        </td>
      </tr>`).join('');
    lucide.createIcons();
  }

  function enterCanvas(id){ shellToast('進入循環「'+LIFECYCLES.find(l=>l.id===id).name+'」的 DAG 畫布編輯頁（11-dag-canvas）'); }

  // 循環名稱 → 代碼（第 2 段），供樹狀圖預覽頁帶入
  const CYC_CODE={'銷售及收款循環':'SRC','採購及付款循環':'PUC','產品企劃循環':'PPC','薪工循環':'LWC','融資循環':'FC','不動產、廠房及設備循環':'FAC','投資循環':'IC','電腦化資訊系統控制作業':'CIPS','管理性控制作業':'GCA'};
  function openTree(name){ const code=CYC_CODE[name]||''; window.open('22-lifecycle-tree-preview.html'+(code?('?cycle='+code):''),'_blank'); }

  function openCreate(){ editingId=null; document.getElementById('lcTitle').textContent='新增循環'; document.getElementById('lcName').value=''; document.getElementById('lcDesc').value=''; hideNameErr(); showLc(); }
  function openEdit(id){ const l=LIFECYCLES.find(x=>x.id===id); editingId=id; document.getElementById('lcTitle').textContent='編輯循環'; document.getElementById('lcName').value=l.name; document.getElementById('lcDesc').value=''; hideNameErr(); showLc(); }
  function showLc(){const m=document.getElementById('lcModal');m.classList.remove('hidden');m.classList.add('flex');lucide.createIcons();}
  function closeLc(){const m=document.getElementById('lcModal');m.classList.add('hidden');m.classList.remove('flex');}
  function hideNameErr(){const e=document.getElementById('lcNameErr');e.classList.add('hidden');e.classList.remove('flex');document.getElementById('lcName').classList.remove('border-red-500');}
  function submitLc(){
    const name=document.getElementById('lcName').value.trim();
    if(!name){const e=document.getElementById('lcNameErr');e.classList.remove('hidden');e.classList.add('flex');document.getElementById('lcName').classList.add('border-red-500');return;}
    const now='2026-07-15 '+new Date().toTimeString().slice(0,5);
    if(editingId){ const l=LIFECYCLES.find(x=>x.id===editingId); l.name=name; l.updated=now; closeLc(); renderTable(); toast('success','已更新循環，updatedAt 已更新'); }
    else { LIFECYCLES.unshift({id:'lc'+(++seq),name,status:'active',nodes:0,updated:now,docs:0}); closeLc(); renderTable(); toast('success','已建立循環（配發 UUID），導向 DAG 畫布編輯頁'); }
  }

  function toggleStatus(id){ const l=LIFECYCLES.find(x=>x.id===id); l.status=l.status==='active'?'inactive':'active'; renderTable(); toast('info','循環狀態已切為「'+(l.status==='active'?'啟用':'停用')+'」；既有掛載關係不受影響'); }

  // OQ-E03-03 定案：允許刪除循環，但需先解除全部文件掛載（非「僅能停用」）；停用選項仍保留於列上操作
  function delLc(id){
    const l=LIFECYCLES.find(x=>x.id===id);
    if(l.docs>0){
      toast('error','此循環仍有 '+l.docs+' 份文件掛載，需先解除全部掛載才能刪除','LIFECYCLE_HAS_DOCUMENTS');
      openConfirm('「'+l.name+'」仍有 '+l.docs+' 份文件掛載',
        '需先解除全部掛載才能刪除（LIFECYCLE_HAS_DOCUMENTS · 409）。請至「ICSOP 文件管理」將這些文件改掛其他循環，或於此示範一鍵解除全部掛載；亦可改用列上的「停用」保留此循環。',
        ()=>{ l.docs=0; l.updated='2026-07-17 '+new Date().toTimeString().slice(0,5); renderTable(); toast('success','已解除「'+l.name+'」全部文件掛載，現在可刪除此循環'); });
      document.getElementById('cfOk').textContent='示範：解除全部掛載';
      return;
    }
    openConfirm('刪除循環「'+l.name+'」？','此循環已無文件掛載，刪除後將記錄稽核（不可復原）。',()=>{LIFECYCLES=LIFECYCLES.filter(x=>x.id!==id);renderTable();toast('success','循環已刪除');});
    document.getElementById('cfOk').textContent='確認刪除';
  }

  function setRole(r){
    document.body.dataset.role=r;
    const blocked=!['icsop_admin','supervisor','sysadmin'].includes(r);
    const ro=(r==='supervisor'||r==='sysadmin');
    document.getElementById('blockOverlay').classList.toggle('hidden',!blocked);
    document.getElementById('roBanner').classList.toggle('hidden',!ro);
    document.getElementById('roBanner').classList.toggle('flex',ro);
    if(blocked)document.getElementById('blockMsg').textContent={deptcontact:'部門窗口對「循環管理（DAG）」為「無」。',user:'一般使用者無後台存取權。'}[r];
    renderSidebar(); lucide.createIcons();
  }

  /* ===== confirm & toast (shared) ===== */
  function openConfirm(title,body,onOk){
    document.getElementById('cfTitle').textContent=title;document.getElementById('cfBody').textContent=body;
    const m=document.getElementById('confirmModal');m.classList.remove('hidden');m.classList.add('flex');
    const ok=document.getElementById('cfOk');const clone=ok.cloneNode(true);ok.parentNode.replaceChild(clone,ok);
    clone.addEventListener('click',()=>{closeConfirm();onOk();});lucide.createIcons();
  }
  function closeConfirm(){const m=document.getElementById('confirmModal');m.classList.add('hidden');m.classList.remove('flex');}
  function toast(type,msg,code){
    const map={success:['check-circle-2','#059669'],error:['alert-circle','#DC2626'],info:['info','#365C97']};
    const [ic,color]=map[type]||map.info;
    const el=document.createElement('div');
    el.className='flex items-start gap-2 bg-white border border-slate-200 shadow-lg rounded-lg px-4 py-3 text-sm max-w-sm';
    el.style.borderLeft='4px solid '+color;
    el.innerHTML=`<i data-lucide="${ic}" class="w-4 h-4 mt-0.5" style="color:${color}"></i><div><span class="text-slate-700">${msg}</span>${code?`<div class="text-[10px] mono text-slate-400 mt-0.5">${code}</div>`:''}</div>`;
    document.getElementById('toastWrap').appendChild(el);lucide.createIcons();
    setTimeout(()=>{el.style.transition='opacity .3s';el.style.opacity='0';setTimeout(()=>el.remove(),300);},4200);
  }
  document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeConfirm();closeLc();}});

  // init
  renderTable(); renderSidebar(); lucide.createIcons();
</script>
</body>
</html>
