<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>節點抽屜維護 · 後台</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = { theme: { extend: {
    fontFamily: { sans: ['Inter','Noto Sans TC','sans-serif'] },
    colors: { primary: { 50:'#F3F7FC',100:'#EAF1FA',200:'#CFDFF3',300:'#98B6E4',400:'#6E96D4',500:'#4A72AE',600:'#365C97',700:'#2A4A7E' } }
  }}}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono&display=swap" rel="stylesheet" />
<script src="https://unpkg.com/lucide@latest"></script>
<style>
  body{font-family:'Inter','Noto Sans TC',sans-serif;color:#334155;}
  .mono{font-family:'JetBrains Mono',monospace;}
  #viewport{background:#F8FAFC;background-image:radial-gradient(#E2E8F0 1px,transparent 1px);background-size:22px 22px;}
  .node{position:absolute;width:164px;cursor:pointer;}
  .node .body{background:#fff;border:1.5px solid #E2E8F0;border-radius:10px;box-shadow:0 1px 2px rgba(0,0,0,.04);transition:.15s;}
  .node:hover .body{border-color:#98B6E4;}
  .node.selected .body{border-color:#365C97;box-shadow:0 0 0 3px #CFDFF3;}
  .node.has-docs .body{border-left:4px solid #059669;}
  #drawer{transition:transform .3s ease;}
  /* admin shell sidebar */
  #sidebar{width:240px;transition:width .2s ease;}
  body{padding-left:240px;transition:padding-left .2s ease;}
  body.sb-collapsed{padding-left:60px;}
  body.sb-collapsed #sidebar{width:60px;}
  body.sb-collapsed .sb-label{display:none;}
  body.sb-collapsed #sidebarNav .sb-item{justify-content:center;padding-left:0;padding-right:0;}
</style>
</head>
<body data-role="icsop_admin" class="h-screen flex flex-col bg-white overflow-hidden sb-collapsed">

<!-- ===== Admin shell sidebar ===== -->
<aside id="sidebar" class="fixed left-0 top-0 bottom-0 z-40 bg-white border-r border-slate-200 flex flex-col">
  <div class="h-14 flex items-center gap-2 px-3 border-b border-slate-200 shrink-0">
    <div class="w-8 h-8 rounded-lg bg-primary-600 flex items-center justify-center text-white shrink-0"><i data-lucide="file-text" class="w-5 h-5"></i></div>
    <span class="sb-label font-bold text-slate-900 text-sm truncate">ICSOP 後台</span>
  </div>
  <nav id="sidebarNav" class="flex-1 overflow-y-auto py-2 px-2 space-y-0.5"></nav>
  <div class="border-t border-slate-200 p-2 shrink-0">
    <button onclick="openPublic()" title="瀏覽文件網頁（開新視窗）" class="sb-item w-full flex items-center gap-2.5 px-2.5 py-2 rounded-md text-sm text-slate-600 hover:bg-slate-50">
      <i data-lucide="external-link" class="w-4 h-4 shrink-0"></i><span class="sb-label truncate">瀏覽文件網頁</span></button>
  </div>
</aside>

<!-- ===== Topbar ===== -->
<header class="h-14 bg-white border-b border-slate-200 flex items-center px-4 gap-3 shrink-0 z-20">
  <button onclick="toggleSidebar()" title="收合/展開選單" class="text-slate-400 hover:text-slate-600 shrink-0"><i data-lucide="panel-left" class="w-5 h-5"></i></button>
  <div class="leading-tight min-w-0">
    <div class="text-xs text-slate-400 flex items-center gap-1"><span>循環管理</span><i data-lucide="chevron-right" class="w-3 h-3"></i><span>節點抽屜維護</span></div>
    <div class="font-semibold text-slate-900 text-sm truncate">銷售及收款循環 · 節點抽屜維護</div>
  </div>
  <div class="ml-auto flex items-center gap-2">
    <div class="flex items-center gap-1.5">
      <i data-lucide="users" class="w-4 h-4 text-slate-400"></i>
      <select id="roleSel" onchange="setRole(this.value)" class="text-sm border border-slate-300 rounded-md px-2 py-1.5 bg-white">
        <option value="icsop_admin">ICSOP 管理員</option>
        <option value="supervisor">主管（唯讀）</option>
        <option value="sysadmin">系統管理員（唯讀）</option>
        <option value="deptcontact">部門窗口</option>
        <option value="user">一般使用者</option>
      </select>
    </div>
    <div class="hidden xl:flex items-center gap-1.5 text-sm text-slate-500 pl-2 border-l border-slate-200"><i data-lucide="user-circle" class="w-4 h-4"></i><span>陳管理</span></div>
    <button title="登出" class="w-8 h-8 rounded-full hover:bg-slate-100 flex items-center justify-center text-slate-500"><i data-lucide="log-out" class="w-4 h-4"></i></button>
  </div>
</header>

<div id="roBanner" class="hidden bg-cyan-50 border-b border-cyan-200 text-cyan-800 text-sm px-4 py-2 items-center gap-2">
  <i data-lucide="eye" class="w-4 h-4"></i>唯讀模式 · 此角色僅可檢視掛載狀態，無法變更節點名稱或掛載。
</div>

<div class="flex-1 relative overflow-hidden">
  <div id="viewport" class="absolute inset-0 overflow-auto">
    <div id="world" style="position:relative;width:1100px;height:720px;">
      <svg id="edges" width="1100" height="720" style="position:absolute;inset:0;pointer-events:none;">
        <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#94A3B8"></path></marker></defs>
      </svg>
    </div>
  </div>

  <div class="absolute left-4 top-4 z-10 flex items-center gap-2 px-3 py-2 rounded-lg bg-white/90 border border-slate-200 shadow-sm text-xs text-slate-500 max-w-[240px]">
    <i data-lucide="mouse-pointer-click" class="w-4 h-4 shrink-0 text-primary-600"></i><span>點擊任一節點開啟右側抽屜，維護名稱與掛載文件。</span>
  </div>

  <div id="blockOverlay" class="hidden absolute inset-0 z-30 bg-slate-50/90 backdrop-blur-sm flex items-center justify-center">
    <div class="text-center max-w-xs">
      <div class="w-14 h-14 rounded-full bg-red-50 flex items-center justify-center mx-auto mb-3"><i data-lucide="lock" class="w-7 h-7 text-red-500"></i></div>
      <h3 class="font-semibold text-slate-900">無循環管理權限</h3>
      <p class="text-sm text-slate-500 mt-1" id="blockMsg"></p>
      <p class="text-xs mono text-slate-400 mt-2">PERMISSION_DENIED · 403</p>
    </div>
  </div>
</div>

<!-- Drawer -->
<div id="drawerOverlay" class="fixed inset-0 z-40 hidden bg-slate-900/40" onclick="cancelDrawer()"></div>
<aside id="drawer" class="fixed top-0 right-0 z-50 h-full w-[420px] max-w-full bg-white shadow-2xl translate-x-full flex flex-col">
  <div class="h-14 border-b border-slate-200 flex items-center justify-between px-4 shrink-0">
    <div class="flex items-center gap-2"><i data-lucide="git-commit-vertical" class="w-5 h-5 text-primary-600"></i><h3 class="font-semibold text-slate-900">節點維護</h3></div>
    <button onclick="cancelDrawer()" class="text-slate-400 hover:text-slate-600"><i data-lucide="x" class="w-5 h-5"></i></button>
  </div>

  <div class="flex-1 overflow-auto p-4 space-y-5">
    <!-- name -->
    <div>
      <label class="block text-sm font-medium text-slate-700 mb-1">節點名稱</label>
      <input id="nodeName" oninput="onNameInput()" type="text" placeholder="輸入節點名稱"
             class="w-full px-3 py-2 rounded-md border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-primary-600 focus:border-primary-600" />
      <p class="text-xs text-slate-400 mt-1">變更會即時反映於左側畫布。</p>
    </div>

    <!-- mounted -->
    <div>
      <div class="flex items-center justify-between mb-1.5">
        <label class="text-sm font-medium text-slate-700">目前掛載文件</label>
        <span id="mountCount" class="text-xs text-slate-400"></span>
      </div>
      <div id="mountedList" class="space-y-2"></div>
    </div>

    <!-- candidates -->
    <div>
      <div class="flex items-center justify-between mb-1.5">
        <label class="text-sm font-medium text-slate-700">候選文件</label>
      </div>
      <div class="flex items-start gap-1.5 text-xs text-slate-400 mb-2">
        <i data-lucide="filter" class="w-3.5 h-3.5 mt-0.5"></i>
        <span>僅顯示所屬循環＝<span class="text-slate-600">銷售及收款循環</span> 之文件（後端過濾，已排除其他循環 <span id="excludedCount">0</span> 筆）。</span>
      </div>
      <div class="relative mb-2">
        <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-2.5 top-1/2 -translate-y-1/2"></i>
        <input id="candKw" oninput="renderDrawer()" placeholder="搜尋候選文件…" class="w-full pl-8 pr-3 py-1.5 rounded-md border border-slate-300 text-sm" />
      </div>
      <div id="candList" class="space-y-2"></div>
    </div>
  </div>

  <div class="border-t border-slate-200 p-3 flex items-center justify-between shrink-0 bg-white">
    <span id="drawerHint" class="text-xs text-slate-400"></span>
    <div class="flex gap-2">
      <button onclick="cancelDrawer()" class="px-3 py-2 rounded-md border border-slate-300 text-sm hover:bg-slate-50">取消</button>
      <button id="saveBtn" onclick="saveDrawer()" class="px-4 py-2 rounded-md bg-primary-600 text-white text-sm font-medium hover:bg-primary-700">儲存並關閉</button>
    </div>
  </div>
</aside>

<div id="toastWrap" class="fixed top-16 right-4 z-[60] space-y-2"></div>

<script>
  /* ===== admin shell sidebar ===== */
  const MENU=[
    {id:'account',label:'帳號管理',icon:'users',roles:{sysadmin:'CRUD',icsop_admin:'唯讀'}},
    {id:'lifecycle',label:'循環管理',icon:'workflow',roles:{sysadmin:'唯讀',icsop_admin:'CRUD',supervisor:'唯讀'}},
    {id:'document',label:'ICSOP 文件管理',icon:'file-text',roles:{sysadmin:'唯讀',icsop_admin:'CRUD',supervisor:'唯讀',deptcontact:'唯讀'}},
    {id:'usageform',label:'使用表單管理',icon:'files',roles:{sysadmin:'唯讀',icsop_admin:'CRUD'}},
    {id:'appendix',label:'附錄管理',icon:'paperclip',roles:{sysadmin:'唯讀',icsop_admin:'CRUD'}},
    {id:'docindex',label:'文件索引管理',icon:'database',roles:{sysadmin:'唯讀',icsop_admin:'CRUD'}},
    {id:'audit',label:'文件調閱歷程',icon:'history',roles:{sysadmin:'唯讀',icsop_admin:'唯讀'}},
    {id:'changehistory',label:'文件變更歷程',icon:'git-compare',roles:{sysadmin:'唯讀',icsop_admin:'唯讀'}},
    {id:'orgsync',label:'組織人員異動管理',icon:'refresh-cw',roles:{sysadmin:'CRUD',icsop_admin:'唯讀'}},
    {id:'settings',label:'系統參數設定',icon:'settings',roles:{sysadmin:'CRUD'}}
  ];
  const CURRENT_MODULE='lifecycle';
  function renderSidebar(){
    const role=document.body.dataset.role;
    const items=MENU.filter(m=>m.roles[role]);
    document.getElementById('sidebarNav').innerHTML = items.length? items.map(m=>{
      const active=m.id===CURRENT_MODULE, acc=m.roles[role], ro=acc!=='CRUD';
      return `<a href="#" onclick="return navTo('${m.id}','${m.label}')" title="${m.label}" class="sb-item flex items-center gap-2.5 px-2.5 py-2 rounded-md text-sm ${active?'bg-primary-50 text-primary-700 font-medium':'text-slate-600 hover:bg-slate-50'}"><i data-lucide="${m.icon}" class="w-4 h-4 shrink-0 ${active?'text-primary-600':'text-slate-400'}"></i><span class="sb-label flex-1 truncate">${m.label}</span>${ro?`<span class="sb-label text-[10px] px-1 py-0.5 rounded bg-slate-100 text-slate-500">${acc}</span>`:''}</a>`;
    }).join('') : `<div class="sb-label px-2.5 py-3 text-xs text-slate-400">此角色無後台功能權限</div>`;
    lucide.createIcons();
  }
  function navTo(id,label){ if(id==='changehistory'&&CURRENT_MODULE!=='changehistory'){location.href='23-change-history.html';return false;} shellToast(id===CURRENT_MODULE?('目前已在「'+label+'」功能區'):('導向「'+label+'」（原型本輪未含此頁）')); return false; }
  function toggleSidebar(){ document.body.classList.toggle('sb-collapsed'); }
  function openPublic(){ shellToast('已於新視窗開啟前台瀏覽頁（03-public-list）'); }
  function shellToast(msg){ if(typeof toast==='function'){toast('info',msg);} else {alert(msg);} }

  const CYCLE='銷售及收款循環';
  const NODE_W=164,NODE_H=64;
  // 銷售及收款循環（SRC）作業群組節點：進件多 child、撥款多 parent、結束多 parent
  const nodes=[
    {id:'n1',name:'進件作業',x:468,y:20},
    {id:'n2',name:'簽約對保作業',x:270,y:140},
    {id:'n3',name:'擔保設定作業',x:668,y:140},
    {id:'n4',name:'撥款核准作業',x:468,y:260},
    {id:'n5',name:'案件執行作業',x:468,y:380},
    {id:'n6',name:'案件催收作業',x:270,y:500},
    {id:'n7',name:'案件結束作業',x:468,y:620}
  ];
  const edges=[['n1','n2'],['n1','n3'],['n2','n4'],['n3','n4'],['n4','n5'],['n5','n6'],['n5','n7'],['n6','n7']];
  // committed doc→node assignments (this lifecycle)
  let DOCS=[
    {n:'ICSOP-SRC-101-1-01',name:'車輛分期進件作業',node:'n1'},
    {n:'ICSOP-SRC-101-2-00',name:'消金審核作業',node:'n1'},
    {n:'ICSOP-SRC-102-1-01',name:'車輛分期對保作業',node:'n2'},
    {n:'ICSOP-SRC-103-1-01',name:'作服擔保設定作業',node:'n3'},
    {n:'ICSOP-SRC-104-1-01',name:'作服撥款作業（車輛）',node:'n4'},
    {n:'ICSOP-SRC-105-1-01',name:'超商收款作業',node:'n5'},
    {n:'ICSOP-SRC-106-1-01',name:'債管電催作業',node:'n6'},
    {n:'ICSOP-SRC-107-1-01',name:'作服中途結清作業',node:'n7'},
    {n:'ICSOP-SRC-101-1-03',name:'電銷進件作業',node:null},
    {n:'ICSOP-SRC-101-1-05',name:'消費分期進件作業',node:null},
    {n:'ICSOP-SRC-101-2-01',name:'消金進件審核作業',node:null}
  ];
  // docs from OTHER lifecycles — must be excluded from candidates
  const OTHER_CYCLE_DOCS=[{n:'ICSOP-PPC-101-2-02'},{n:'ICSOP-PUC-101-1-01'},{n:'ICSOP-LWC-101-1-02'}];

  let currentNode=null, draft=null; // draft = {name, docs:[{n,name,node}], unresolved:Set}
  const nodeById=id=>nodes.find(n=>n.id===id);
  const isAdmin=()=>document.body.dataset.role==='icsop_admin';

  /* canvas */
  function renderCanvas(){
    const svg=document.getElementById('edges');
    [...svg.querySelectorAll('path.edge')].forEach(p=>p.remove());
    edges.forEach(([s,t])=>{const a=nodeById(s),b=nodeById(t);
      const p=document.createElementNS('http://www.w3.org/2000/svg','path');
      p.setAttribute('class','edge');
      // 直角 elbow（垂直→水平→垂直），與 11/22/23 一致（OQ-E03-09 定案）
      const sx=a.x+NODE_W/2,sy=a.y+NODE_H,tx=b.x+NODE_W/2,ty=b.y,my=sy+(ty-sy)/2;
      p.setAttribute('d',`M ${sx} ${sy} L ${sx} ${my} L ${tx} ${my} L ${tx} ${ty}`);
      p.setAttribute('fill','none');p.setAttribute('stroke','#94A3B8');p.setAttribute('stroke-width','2');p.setAttribute('marker-end','url(#arrow)');
      svg.appendChild(p);});
    const world=document.getElementById('world');
    world.querySelectorAll('.node').forEach(n=>n.remove());
    nodes.forEach(n=>{
      const count=DOCS.filter(d=>d.node===n.id).length;
      const el=document.createElement('div');
      el.className='node'+(currentNode===n.id?' selected':'')+(count?' has-docs':'');
      el.style.left=n.x+'px';el.style.top=n.y+'px';
      el.innerHTML=`<div class="body p-2.5">
        <div class="flex items-center gap-1.5"><i data-lucide="circle-dot" class="w-3.5 h-3.5 text-slate-300"></i><span class="font-medium text-slate-800 text-sm truncate">${n.name}</span></div>
        <div class="mt-1.5 flex items-center gap-1 text-[11px] ${count?'text-emerald-600':'text-slate-400'}"><i data-lucide="${count?'file-check-2':'file-x-2'}" class="w-3.5 h-3.5"></i>${count?'掛載 '+count+' 份文件':'尚未掛載文件'}</div>
      </div>`;
      el.addEventListener('click',()=>openDrawer(n.id));
      world.appendChild(el);
    });
    lucide.createIcons();
  }

  /* drawer */
  function openDrawer(id){
    if(!(isAdmin()||['supervisor','sysadmin'].includes(document.body.dataset.role))) return; // blocked roles can't
    currentNode=id;
    const n=nodeById(id);
    draft={ name:n.name, docs:DOCS.map(d=>({...d})), unresolved:new Set(), origin:new Map(DOCS.map(d=>[d.n,d.node])) };
    document.getElementById('nodeName').value=n.name;
    document.getElementById('excludedCount').textContent=OTHER_CYCLE_DOCS.length;
    const ro=!isAdmin();
    document.getElementById('nodeName').disabled=ro;
    document.getElementById('candKw').disabled=ro;
    document.getElementById('saveBtn').style.display=ro?'none':'';
    renderDrawer(); renderCanvas();
    document.getElementById('drawerOverlay').classList.remove('hidden');
    document.getElementById('drawer').classList.remove('translate-x-full');
  }

  function onNameInput(){ if(!isAdmin())return; draft.name=document.getElementById('nodeName').value;
    const n=nodeById(currentNode); n.name=draft.name||'未命名節點'; renderCanvas(); }

  function docRow(d,kind){
    // kind: mounted | cand-free | cand-other | warn
    const other=d.node && d.node!==currentNode ? nodeById(d.node) : null;
    if(kind==='mounted'){
      const reassigned = draft.origin.get(d.n)!==currentNode;
      return `<div class="flex items-center gap-2 rounded-lg border border-emerald-200 bg-emerald-50/50 px-3 py-2">
        <i data-lucide="file-check-2" class="w-4 h-4 text-emerald-600 shrink-0"></i>
        <div class="min-w-0 flex-1"><div class="mono text-xs text-slate-500">${d.n}</div><div class="text-sm text-slate-800 truncate">${d.name}</div>
        ${reassigned?'<span class="inline-block mt-0.5 text-[10px] px-1.5 py-0.5 rounded bg-primary-50 text-primary-700">改派至此</span>':''}</div>
        ${isAdmin()?`<button onclick="unmount('${d.n}')" class="text-slate-400 hover:text-red-500" title="移除掛載"><i data-lucide="x" class="w-4 h-4"></i></button>`:''}
      </div>`;
    }
    if(draft.unresolved.has(d.n)){
      return `<div class="rounded-lg border-2 border-amber-300 bg-amber-50 px-3 py-2.5">
        <div class="flex items-start gap-2"><i data-lucide="alert-triangle" class="w-4 h-4 text-amber-600 shrink-0 mt-0.5"></i>
          <div class="min-w-0"><div class="mono text-xs text-slate-500">${d.n}</div>
          <div class="text-sm text-slate-800">${d.name}</div>
          <div class="text-xs text-amber-800 mt-1">文件已掛載於節點「${other?other.name:'其他'}」，是否改派至「${nodeById(currentNode).name}」？</div>
          <div class="text-[10px] mono text-amber-500 mt-0.5">NODE_DOC_ALREADY_ASSIGNED</div>
          <div class="flex gap-2 mt-2">
            <button onclick="confirmReassign('${d.n}')" class="px-2.5 py-1 rounded bg-amber-600 text-white text-xs">確認改派</button>
            <button onclick="cancelWarn('${d.n}')" class="px-2.5 py-1 rounded border border-slate-300 text-xs">取消</button>
          </div></div></div></div>`;
    }
    const badge = other? `<span class="text-[10px] px-1.5 py-0.5 rounded bg-slate-100 text-slate-500 border border-slate-200">已掛載於 ${other.name}</span>`
                       : `<span class="text-[10px] px-1.5 py-0.5 rounded bg-slate-50 text-slate-400 border border-slate-200">未掛載</span>`;
    return `<div class="flex items-center gap-2 rounded-lg border border-slate-200 px-3 py-2 hover:border-primary-300 ${isAdmin()?'cursor-pointer':''}" ${isAdmin()?`onclick="selectCandidate('${d.n}')"`:''}>
      <i data-lucide="file-text" class="w-4 h-4 text-slate-400 shrink-0"></i>
      <div class="min-w-0 flex-1"><div class="mono text-xs text-slate-500">${d.n}</div><div class="text-sm text-slate-700 truncate">${d.name}</div></div>
      ${badge}
      ${isAdmin()?'<i data-lucide="plus-circle" class="w-4 h-4 text-primary-600 shrink-0"></i>':''}
    </div>`;
  }

  function renderDrawer(){
    const kw=(document.getElementById('candKw').value||'').toLowerCase();
    const mounted=draft.docs.filter(d=>d.node===currentNode);
    const cands=draft.docs.filter(d=>d.node!==currentNode)
      .filter(d=>!kw || d.n.toLowerCase().includes(kw)||d.name.toLowerCase().includes(kw));
    document.getElementById('mountCount').textContent=mounted.length+' 份';
    document.getElementById('mountedList').innerHTML = mounted.length? mounted.map(d=>docRow(d,'mounted')).join('')
      : `<div class="text-sm text-slate-400 border border-dashed border-slate-200 rounded-lg px-3 py-4 text-center">此節點尚無掛載文件</div>`;
    document.getElementById('candList').innerHTML = cands.length? cands.map(d=>docRow(d,'cand')).join('')
      : `<div class="text-center border border-dashed border-slate-200 rounded-lg px-3 py-6">
           <i data-lucide="inbox" class="w-8 h-8 text-slate-300 mx-auto mb-1.5"></i>
           <p class="text-sm text-slate-500">尚無可掛載文件</p>
           <p class="text-xs text-slate-400 mt-0.5">此循環的文件皆已掛載於本節點</p></div>`;
    const unresolved=draft.unresolved.size;
    document.getElementById('drawerHint').textContent = unresolved? `${unresolved} 項改派待確認` : '關閉即送出變更';
    lucide.createIcons();
  }

  function selectCandidate(dn){
    if(!isAdmin())return;
    const d=draft.docs.find(x=>x.n===dn);
    if(d.node && d.node!==currentNode){ draft.unresolved.add(dn); renderDrawer();
      toast('info','此文件已掛載於其他節點，請確認是否改派'); return; }
    d.node=currentNode; renderDrawer(); renderCanvas();
    toast('success','已加入掛載：'+d.name);
  }
  function confirmReassign(dn){const d=draft.docs.find(x=>x.n===dn);d.node=currentNode;draft.unresolved.delete(dn);renderDrawer();renderCanvas();toast('success','已改派：'+d.name);}
  function cancelWarn(dn){draft.unresolved.delete(dn);renderDrawer();}
  function unmount(dn){const d=draft.docs.find(x=>x.n===dn);d.node=null;renderDrawer();renderCanvas();toast('info','已移除掛載：'+d.name);}

  // committed node-name snapshot (source of truth for revert)
  const COMMITTED_NAMES={}; nodes.forEach(n=>COMMITTED_NAMES[n.id]=n.name);

  function saveDrawer(){
    if(draft.unresolved.size>0){ toast('error','請先確認或取消改派警示後再儲存','NODE_DOC_ALREADY_ASSIGNED'); return; }
    DOCS=draft.docs.map(d=>({...d}));
    const nid=currentNode, nm=draft.name||'未命名節點';
    nodeById(nid).name=nm; COMMITTED_NAMES[nid]=nm;
    closeDrawer(); renderCanvas();
    toast('success','節點與掛載已儲存（交易內解除原節點並綁定新節點）');
  }
  function cancelDrawer(){ // discard: revert live canvas name to last committed
    if(currentNode) nodeById(currentNode).name=COMMITTED_NAMES[currentNode];
    closeDrawer(); renderCanvas();
  }
  function closeDrawer(){document.getElementById('drawerOverlay').classList.add('hidden');document.getElementById('drawer').classList.add('translate-x-full');currentNode=null;draft=null;}

  function setRole(r){
    document.body.dataset.role=r;
    const blocked=(r==='deptcontact'||r==='user');
    const ro=(r==='supervisor'||r==='sysadmin');
    document.getElementById('blockOverlay').classList.toggle('hidden',!blocked);
    document.getElementById('roBanner').classList.toggle('hidden',!ro);
    document.getElementById('roBanner').classList.toggle('flex',ro);
    if(blocked){document.getElementById('blockMsg').textContent={deptcontact:'部門窗口對「循環管理（DAG）」為「無」。',user:'一般使用者無後台存取權。'}[r];}
    closeDrawer(); renderSidebar(); lucide.createIcons();
  }
  function toast(type,msg,code){
    const map={success:['check-circle-2','#059669'],error:['alert-circle','#DC2626'],info:['info','#365C97']};
    const [ic,color]=map[type]||map.info;
    const el=document.createElement('div');
    el.className='flex items-start gap-2 bg-white border border-slate-200 shadow-lg rounded-lg px-4 py-3 text-sm max-w-sm';
    el.style.borderLeft='4px solid '+color;
    el.innerHTML=`<i data-lucide="${ic}" class="w-4 h-4 mt-0.5" style="color:${color}"></i><div><span class="text-slate-700">${msg}</span>${code?`<div class="text-[10px] mono text-slate-400 mt-0.5">${code}</div>`:''}</div>`;
    document.getElementById('toastWrap').appendChild(el);lucide.createIcons();
    setTimeout(()=>{el.style.transition='opacity .3s';el.style.opacity='0';setTimeout(()=>el.remove(),300);},4000);
  }
  document.addEventListener('keydown',e=>{if(e.key==='Escape')cancelDrawer();});

  renderCanvas(); renderSidebar();
</script>
</body>
</html>
