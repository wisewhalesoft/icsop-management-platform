<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>使用表單（表單池）管理 · 後台</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = { theme: { extend: {
    fontFamily: { sans: ['Inter','Noto Sans TC','sans-serif'] },
    colors: { primary: { 50:'#F3F7FC',100:'#EAF1FA',200:'#CFDFF3',300:'#98B6E4',400:'#6E96D4',500:'#4A72AE',600:'#365C97',700:'#2A4A7E' } }
  }}}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono&display=swap" rel="stylesheet" />
<script src="https://unpkg.com/lucide@latest"></script>
<style>
  body{font-family:'Inter','Noto Sans TC',sans-serif;color:#334155;background:#FFFFFF;}
  .mono{font-family:'JetBrains Mono',monospace;}
  body:not([data-role="icsop_admin"]) .write-only{display:none !important;}
  /* admin shell sidebar */
  #sidebar{width:240px;transition:width .2s ease;}
  body{padding-left:240px;transition:padding-left .2s ease;}
  body.sb-collapsed{padding-left:60px;}
  body.sb-collapsed #sidebar{width:60px;}
  body.sb-collapsed .sb-label{display:none;}
  body.sb-collapsed #sidebarNav .sb-item{justify-content:center;padding-left:0;padding-right:0;}
</style>
</head>
<body data-role="icsop_admin" class="min-h-screen">

<!-- ===== Admin shell sidebar ===== -->
<aside id="sidebar" class="fixed left-0 top-0 bottom-0 z-50 bg-white border-r border-slate-200 flex flex-col">
  <a href="07-admin-shell.html" data-to="/admin" aria-label="回到後台首頁" title="回到後台首頁" class="h-14 flex items-center gap-2 px-3 border-b border-slate-200 shrink-0 hover:bg-slate-50 focus:outline-none focus:ring-2 focus:ring-inset focus:ring-primary-600">
    <div class="w-8 h-8 rounded-lg bg-primary-600 flex items-center justify-center text-white shrink-0"><i data-lucide="file-text" class="w-5 h-5"></i></div>
    <span class="sb-label font-bold text-slate-900 text-sm truncate">ICSOP 後台</span>
  </a>
  <nav id="sidebarNav" class="flex-1 overflow-y-auto py-2 px-2 space-y-0.5"></nav>
  <div class="border-t border-slate-200 p-2 shrink-0">
    <button onclick="openPublic()" title="瀏覽文件網頁（開新視窗）" class="sb-item w-full flex items-center gap-2.5 px-2.5 py-2 rounded-md text-sm text-slate-600 hover:bg-slate-50">
      <i data-lucide="external-link" class="w-4 h-4 shrink-0"></i><span class="sb-label truncate">瀏覽文件網頁</span></button>
  </div>
</aside>

<!-- Top bar -->
<header class="sticky top-0 z-30 bg-white border-b border-slate-200">
  <div class="h-14 px-4 flex items-center gap-3">
    <button onclick="toggleSidebar()" title="收合/展開選單" class="text-slate-400 hover:text-slate-600"><i data-lucide="panel-left" class="w-5 h-5"></i></button>
    <div class="leading-tight min-w-0">
      <div class="text-xs text-slate-400 flex items-center gap-1"><a href="19-usage-form-management.html" data-to="/admin/usage-forms" class="hover:text-primary-700 hover:underline focus:outline-none focus:ring-2 focus:ring-primary-600 rounded">使用表單管理</a><i data-lucide="chevron-right" class="w-3 h-3"></i><span>表單池</span></div>
      <div class="font-semibold text-slate-900 text-sm truncate">使用表單（表單池）管理</div>
    </div>
    <div class="ml-auto flex items-center gap-2">
      <!-- 🔵 AC-X6（2026-08-27 delta）：topbar 動作區之「匯出」鈕（icon 鍵 download，
           與 24-appendix-management.html 之匯出鈕逐條同型）。
           📌 **匯出為讀取類動作**：SysAdmin 唯讀角色**允許匯出**，故本鈕**非** write-only；
              Supervisor／DeptContact／User 於本頁本就被 blockOverlay 擋下（403 PERMISSION_DENIED）。 -->
      <button onclick="doExport()" aria-label="匯出" title="匯出表單清單（CSV）" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-md border border-slate-300 text-sm text-slate-700 hover:bg-slate-50"><i data-lucide="download" class="w-4 h-4"></i>匯出</button>
      <!-- 🔴 AC-N41：導向獨立整頁（非彈窗）。可見文字逐字為「新增表單」（AC-N41 之 Given）。 -->
      <button onclick="gotoCreate()" data-create-usage-form aria-label="新增表單" class="write-only inline-flex items-center gap-1.5 px-3 py-1.5 rounded-md bg-primary-600 text-white text-sm font-medium hover:bg-primary-700"><i data-lucide="plus" class="w-4 h-4"></i>新增表單</button>
      <div class="flex items-center gap-1.5 pl-2 border-l border-slate-200">
        <i data-lucide="users" class="w-4 h-4 text-slate-400"></i>
        <select id="roleSel" onchange="setRole(this.value)" class="text-sm border border-slate-300 rounded-md px-2 py-1.5 bg-white">
          <option value="icsop_admin">ICSOP 管理員</option>
          <option value="supervisor">主管（無）</option>
          <option value="sysadmin">系統管理員（唯讀）</option>
          <option value="deptcontact">部門窗口</option>
          <option value="user">一般使用者</option>
        </select>
      </div>
      <div class="hidden xl:flex items-center gap-1.5 text-sm text-slate-500 pl-2 border-l border-slate-200"><i data-lucide="user-circle" class="w-4 h-4"></i><span>李慧玲</span></div>
      <button title="登出" class="w-8 h-8 rounded-full hover:bg-slate-100 flex items-center justify-center text-slate-500"><i data-lucide="log-out" class="w-4 h-4"></i></button>
    </div>
  </div>
  <!-- readonly banner -->
  <div id="roBanner" class="hidden bg-cyan-50 border-t border-cyan-200 text-cyan-800 text-sm px-4 py-2 items-center gap-2">
    <i data-lucide="eye" class="w-4 h-4"></i>唯讀模式 · 系統管理員僅可查詢與下載表單、檢視關聯文件，無法上傳或移除（FIELD_WRITE_FORBIDDEN）。
  </div>
</header>

<!-- blocked overlay -->
<div id="blockOverlay" class="hidden fixed inset-0 z-40 bg-slate-50/90 backdrop-blur-sm flex items-center justify-center">
  <div class="text-center max-w-xs">
    <div class="w-14 h-14 rounded-full bg-red-50 flex items-center justify-center mx-auto mb-3"><i data-lucide="lock" class="w-7 h-7 text-red-500"></i></div>
    <h3 class="font-semibold text-slate-900">無使用表單管理權限</h3>
    <p class="text-sm text-slate-500 mt-1" id="blockMsg"></p>
    <p class="text-xs mono text-slate-400 mt-2">PERMISSION_DENIED · 403</p>
  </div>
</div>

<main class="px-4 py-6">
  <!-- intro -->
  <div class="flex items-start gap-2 mb-4 text-sm text-slate-500">
    <i data-lucide="info" class="w-4 h-4 mt-0.5 text-slate-400 shrink-0"></i>
    <p>表單池集中管理各 ICSOP 文件所引用的 excel / pdf 使用表單。文件於建立/編輯時由此表單池選取關聯；本頁負責上傳、下載、檢視關聯與移除。</p>
  </div>

  <!-- toolbar -->
  <div class="flex flex-wrap items-center gap-2 mb-4">
    <div class="relative flex-1 min-w-[200px]">
      <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-3 top-1/2 -translate-y-1/2"></i>
      <input id="kw" oninput="renderTable()" type="search" placeholder="搜尋表單名稱…" class="w-full pl-9 pr-3 py-2 rounded-md border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-primary-600 focus:border-primary-600" />
    </div>
    <select id="fFmt" onchange="renderTable()" class="px-3 py-2 rounded-md border border-slate-300 text-sm bg-white">
      <option value="">所有格式</option><option value="excel">excel</option><option value="pdf">pdf</option>
    </select>
    <button id="clearBtn" onclick="clearFilters()" class="hidden px-3 py-2 rounded-md text-sm text-primary-600 hover:bg-primary-50">清除</button>
    <span id="countText" class="ml-auto text-sm text-slate-500"></span>
  </div>

  <div class="bg-white border border-slate-200 rounded-xl overflow-hidden">
    <div class="overflow-x-auto">
      <!-- 🔵 F018 AC-D1（2026-08-16 additive delta）：表頭由左至右逐字為
           表單編號／表單名稱／**制定部門**／格式／大小／上傳者 / 上傳時間／關聯文件數／操作（AC-N47 就地擴充為 8 欄）
           （**新增之「表單編號」置於首欄**）；formNumber 為 null 之列，該格顯示「—」。 -->
      <table class="w-full text-sm min-w-[1420px]">
        <thead class="bg-slate-50 text-slate-500 text-xs uppercase tracking-wide whitespace-nowrap">
          <tr>
            <th class="text-left font-medium px-4 py-2.5">表單編號</th>
            <th class="text-left font-medium px-4 py-2.5">表單名稱</th>
            <!-- 🔵 AC-N47（2026-08-20 D9 delta）：新增欄置於「表單名稱」之後，表頭逐字為「制定部門」 -->
            <th class="text-left font-medium px-4 py-2.5">制定部門</th>
            <th class="text-left font-medium px-4 py-2.5">格式</th>
            <th class="text-left font-medium px-4 py-2.5">大小</th>
            <th class="text-left font-medium px-4 py-2.5">上傳者 / 上傳時間</th>
            <th class="text-left font-medium px-4 py-2.5">關聯文件數</th>
            <th class="text-left font-medium px-4 py-2.5">操作</th>
          </tr>
        </thead>
        <tbody id="tbody" class="divide-y divide-slate-100"></tbody>
      </table>
    </div>
    <div id="emptyState" class="hidden text-center py-14">
      <i data-lucide="inbox" class="w-10 h-10 text-slate-300 mx-auto mb-2"></i>
      <p class="text-slate-500 text-sm">查無符合的表單</p>
    </div>
  </div>
</main>

<!-- confirm modal -->
<div id="confirmModal" class="fixed inset-0 z-50 hidden items-center justify-center bg-slate-900/40 p-4">
  <div class="bg-white rounded-xl shadow-xl w-full max-w-md p-6">
    <div class="flex items-start gap-3">
      <div class="w-10 h-10 rounded-full bg-red-50 flex items-center justify-center shrink-0"><i data-lucide="alert-triangle" class="w-5 h-5 text-red-500"></i></div>
      <div class="min-w-0"><h3 class="font-semibold text-slate-900" id="cfTitle"></h3><p class="text-sm text-slate-500 mt-1" id="cfBody"></p><p id="cfCode" class="hidden text-[10px] mono text-red-500 mt-1.5"></p></div>
    </div>
    <div id="cfList" class="hidden mt-3 max-h-40 overflow-y-auto rounded-md border border-slate-200 bg-slate-50 divide-y divide-slate-100"></div>
    <div class="flex justify-end gap-2 mt-6">
      <button onclick="closeConfirm()" class="px-4 py-2 rounded-md border border-slate-300 text-sm hover:bg-slate-50">取消</button>
      <button id="cfOk" class="px-4 py-2 rounded-md bg-red-600 text-white text-sm hover:bg-red-700">確認</button>
    </div>
  </div>
</div>

<div id="toastWrap" class="fixed top-16 right-4 z-[60] space-y-2"></div>

<script>
  /* ===== admin shell sidebar ===== */

    if(blocked)document.getElementById('blockMsg').textContent={
      supervisor:'主管對「使用表單管理」為「無」，無法存取表單池。',
      deptcontact:'部門窗口對「使用表單管理」為「無」。',
      user:'一般使用者無後台存取權。'
    }[r];
    if(blocked){closeConfirm();}
    renderTable();                            // AC-D17：重繪以套用「無寫入權即不渲染列內動作『編輯』」
    renderSidebar(); lucide.createIcons();
  }

  /* ===== confirm & toast (shared) ===== */
  function openConfirm(title,body,onOk,code,okLabel,listItems){
    document.getElementById('cfTitle').textContent=title;
    document.getElementById('cfBody').textContent=body;
    const cc=document.getElementById('cfCode');
    if(code){cc.textContent=code;cc.classList.remove('hidden');} else {cc.classList.add('hidden');}
    const lw=document.getElementById('cfList');
    if(listItems&&listItems.length){
      lw.innerHTML=listItems.map(d=>`<div class="flex items-center gap-2 px-3 py-1.5"><i data-lucide="file-text" class="w-3.5 h-3.5 text-slate-400 shrink-0"></i><span class="mono text-xs text-slate-600 shrink-0">${d.n}</span><span class="text-sm text-slate-700 truncate">${d.name}</span></div>`).join('');
      lw.classList.remove('hidden');
    } else { lw.classList.add('hidden'); lw.innerHTML=''; }
    const m=document.getElementById('confirmModal');m.classList.remove('hidden');m.classList.add('flex');
    const ok=document.getElementById('cfOk');const clone=ok.cloneNode(true);ok.parentNode.replaceChild(clone,ok);
    clone.textContent=okLabel||'確認';
    clone.addEventListener('click',()=>{closeConfirm();onOk();});lucide.createIcons();
  }
  function closeConfirm(){const m=document.getElementById('confirmModal');m.classList.add('hidden');m.classList.remove('flex');}
  function toast(type,msg,code){
    const map={success:['check-circle-2','#059669'],error:['alert-circle','#DC2626'],info:['info','#365C97']};
    const [ic,color]=map[type]||map.info;
    const el=document.createElement('div');
    el.className='flex items-start gap-2 bg-white border border-slate-200 shadow-lg rounded-lg px-4 py-3 text-sm max-w-sm';
    el.style.borderLeft='4px solid '+color;
    el.innerHTML=`<i data-lucide="${ic}" class="w-4 h-4 mt-0.5" style="color:${color}"></i><div><span class="text-slate-700">${msg}</span>${code?`<div class="text-[10px] mono text-slate-400 mt-0.5">${code}</div>`:''}</div>`;
    document.getElementById('toastWrap').appendChild(el);lucide.createIcons();
    setTimeout(()=>{el.style.transition='opacity .3s';el.style.opacity='0';setTimeout(()=>el.remove(),300);},4200);
  }
  document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeConfirm();}});

  // init
  renderTable(); renderSidebar(); lucide.createIcons();
</script>
</body>
</html>
