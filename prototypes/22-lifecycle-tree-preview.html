<!DOCTYPE html>
<!-- 🟢 F040 循環子分類（APPROVED — 2026-08-07 人類閘門通過）
     本檔已套用：頁首標題與切換器改用 lifecycleDisplayName；切換器選項值與 ?lifecycleId= 參數
     由「循環代碼」收斂為 lifecycleId（同名不同子分類代碼相同，代碼無法區分，F036 AC-S3）。
     規格權威＝docs/specs/features/F040-lifecycle-subcategory.md -->
<!-- 🔵 2026-08-16 additive delta（人類閘門已通過）——本檔已套用（規格權威＝F036 AC-D1～AC-D8）：
     **雙擊節點 → 唯讀側抽屜**列出該節點掛載之程序書清單
     （欄位＝程序書編號／程序書書名／版次／狀態／公告日期；點列可另開後台唯讀詳情）。
     · 抽屜自畫布右側滑出、**非 modal**、不遮擋樹狀圖；關閉鈕或 Escape 關閉（AC-D1）。
     · 🔒 **純唯讀**（AC-D4）：抽屜為 F009 節點抽屜之**唯讀孿生**，**已移除全部寫入元件**——
       無新增文件／移除掛載／改派節點／儲存／刪除，亦無任何 <input>／<select>。
     · 🔒 **單擊之「醒目標示所有下游節點」行為完全保留**（AC-D6）；雙擊時該標示先行觸發且不被取消。
     · 節點掛載數為 0 → 抽屜仍開啟並顯示空狀態（AC-D7）；本互動不新增稽核事件（AC-D8）。
     · 資料端點之權限閘門＝「循環管理」read（含 Supervisor 全公司唯讀），**不得**沿用 F009 之
       ICSOPAdmin 寫入閘門（AC-D5）。
     📌 節點之 `docs` 由計數（docs:N）改為**程序書列陣列**，每節點筆數與改動前之徽章數字逐節點相同
        （無視覺回歸）；徽章改由 docs.length 衍生，使「徽章數字」與「抽屜列數」只有一份事實。
     ⚠ [F038] 之新舊樹狀圖 diff 預覽**刻意不支援雙擊**（OQ-D18-19 裁決＝否，F038 AC-D3）。 -->
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>循環樹狀圖預覽 · ICSOP</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = { theme: { extend: {
    fontFamily: { sans: ['Inter','Noto Sans TC','sans-serif'] },
    colors: { primary: { 50:'#F3F7FC',100:'#EAF1FA',200:'#CFDFF3',300:'#98B6E4',400:'#6E96D4',500:'#4A72AE',600:'#365C97',700:'#2A4A7E' } }
  }}}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono&display=swap" rel="stylesheet" />
<script src="https://unpkg.com/lucide@latest"></script>
<style>
  body{font-family:'Inter','Noto Sans TC',sans-serif;background:#F8FAFC;color:#334155;}
  .mono{font-family:'JetBrains Mono',monospace;}
  #stage{background:#E2E8F0;}
  /* board = the "document" being viewed */
  #board{background:#fff;background-image:radial-gradient(#EEF2F7 1px,transparent 1px);background-size:22px 22px;
         box-shadow:0 4px 24px rgba(0,0,0,.08);position:relative;transform-origin:top center;transition:transform .15s ease;border-radius:12px;overflow:hidden;}
  /* diagonal tiled watermark overlay — 格式與 05-public-viewer-watermark 完全一致（45°, opacity .12, slate-500, 14px, 機密聲明另起一行）*/
  .wm-layer{position:absolute;inset:-40%;pointer-events:none;display:flex;flex-wrap:wrap;align-content:center;justify-content:center;transform:rotate(-45deg);opacity:.12;user-select:none;z-index:5;}
  .wm-layer span{color:#64748B;font-size:14px;white-space:nowrap;padding:22px 30px;font-weight:500;font-family:'JetBrains Mono',monospace;text-align:center;line-height:1.6;}
  /* DAG nodes */
  .node{position:absolute;cursor:pointer;transition:opacity .15s;}
  .node .nbody{background:#fff;border:1.5px solid #E2E8F0;border-radius:10px;box-shadow:0 1px 2px rgba(0,0,0,.05);padding:8px 11px;transition:border-color .15s,box-shadow .15s,background .15s;}
  .node.hasdocs .nbody{border-left:4px solid #059669;}
  .node.hl .nbody{border-color:#365C97;background:#EAF1FA;box-shadow:0 0 0 3px #CFDFF3;}
  .node.sel .nbody{border-color:#2A4A7E;background:#EAF1FA;box-shadow:0 0 0 3px #98B6E4, 0 0 0 7px rgba(152,182,228,.28);}
  .node.dim{opacity:.3;}
  path.edge{stroke:#94A3B8;stroke-width:2;fill:none;transition:stroke .15s,stroke-width .15s,opacity .15s;}
  path.edge.hl{stroke:#365C97;stroke-width:3;}
  path.edge.dim{opacity:.18;}
</style>
</head>
<body class="min-h-screen flex flex-col">

<!-- ===== App bar (viewer 樣式，不套後台側選單) ===== -->
<header class="sticky top-0 z-30 bg-white border-b border-slate-200 shrink-0">
  <div class="px-4 h-14 flex items-center gap-3">
    <!-- 🔴 F036 AC-D3（2026-08-17 delta）：名稱與圖示依「如何進來的」分支——
         自清單開出（有 opener）＝「關閉預覽」＋ x；直接貼網址進來＝「返回…」＋ arrow-left。
         同一個箭頭配兩種行為會誤導，故圖示一併切換。實際文字由 initBackBtn() 於載入時決定。 -->
    <button id="backBtn" onclick="goBack()" title="返回循環池" aria-label="返回循環池" class="text-slate-400 hover:text-slate-600 flex items-center"><i data-lucide="arrow-left" class="w-5 h-5"></i></button>
    <div class="w-8 h-8 rounded-lg bg-primary-600 flex items-center justify-center text-white shrink-0"><i data-lucide="git-fork" class="w-5 h-5"></i></div>
    <div class="leading-tight min-w-0">
      <div class="text-xs text-slate-400">循環樹狀圖預覽</div>
      <div class="font-semibold text-slate-900 text-sm truncate"><span id="titleName">銷售及收款循環</span> · <span class="mono text-slate-500" id="titleCode">SRC</span></div>
    </div>
    <div class="ml-auto hidden sm:flex items-center gap-2 text-sm text-slate-500">
      <i data-lucide="user" class="w-4 h-4"></i><span>李慧玲</span><span class="text-slate-300">·</span><span>ICSOP 管理員</span>
    </div>
  </div>

  <!-- toolbar：循環切換 + 縮放 -->
  <div class="px-4 h-12 border-t border-slate-100 flex items-center gap-2 text-sm overflow-x-auto">
    <label class="inline-flex items-center gap-1.5 text-slate-500 shrink-0"><i data-lucide="workflow" class="w-4 h-4"></i>循環別</label>
    <select id="cycleSel" onchange="loadCycle(this.value)" class="shrink-0 px-2.5 py-1.5 rounded-md border border-slate-300 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-primary-600"></select>
    <div class="w-px h-5 bg-slate-200 mx-1 shrink-0"></div>
    <button onclick="zoomBy(-0.1)" title="縮小" aria-label="縮小" class="w-8 h-8 rounded-md hover:bg-slate-100 flex items-center justify-center shrink-0"><i data-lucide="zoom-out" class="w-4 h-4"></i></button>
    <span id="zoomLabel" class="mono text-xs text-slate-500 w-10 text-center shrink-0">100%</span>
    <button onclick="zoomBy(0.1)" title="放大" aria-label="放大" class="w-8 h-8 rounded-md hover:bg-slate-100 flex items-center justify-center shrink-0"><i data-lucide="zoom-in" class="w-4 h-4"></i></button>
    <button onclick="resetView()" title="重設縮放" aria-label="重設縮放" class="w-8 h-8 rounded-md hover:bg-slate-100 flex items-center justify-center shrink-0"><i data-lucide="maximize" class="w-4 h-4"></i></button>
    <div class="w-px h-5 bg-slate-200 mx-1 shrink-0"></div>
    <button onclick="doAction('DOWNLOAD')" title="下載此循環樹狀圖（PDF，燒錄浮水印）" aria-label="下載" class="inline-flex items-center gap-1.5 px-2.5 py-1.5 rounded-md hover:bg-slate-100 text-slate-700 shrink-0"><i data-lucide="download" class="w-4 h-4"></i>下載</button>
    <button onclick="doAction('PRINT')" title="列印此循環樹狀圖（燒錄浮水印）" aria-label="列印" class="inline-flex items-center gap-1.5 px-2.5 py-1.5 rounded-md hover:bg-slate-100 text-slate-700 shrink-0"><i data-lucide="printer" class="w-4 h-4"></i>列印</button>
    <div class="w-px h-5 bg-slate-200 mx-1 shrink-0"></div>
    <span class="text-xs text-slate-400 shrink-0 hidden md:inline">點節點＝醒目標示其所有下游節點；點空白處取消；<strong class="text-slate-500">雙擊節點＝檢視該節點掛載之程序書清單</strong></span>
  </div>
</header>

<!-- info note（比照 05：檢視已記錄稽核）-->
<div class="px-4 py-2 bg-primary-50 border-b border-primary-100 text-xs text-primary-700 flex items-start gap-2 shrink-0">
  <i data-lucide="shield-check" class="w-4 h-4 shrink-0 mt-0.5"></i>
  <span>本預覽已<strong>寫入調閱稽核（VIEW）</strong>；畫面疊加之浮水印由<strong>伺服器端</strong>依當下登入身分與時間動態產生，格式與稽核快照一致。<strong>下載／列印</strong>時將把浮水印<strong>燒錄進 PDF 內容層</strong>並各自記錄稽核。</span>
</div>

<!-- viewer stage -->
<main id="stage" class="flex-1 overflow-auto p-4 sm:p-8 flex justify-center items-start">
  <div id="board">
    <svg id="edges" style="position:absolute;inset:0;pointer-events:none;z-index:1;">
      <defs>
        <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#94A3B8"></path></marker>
        <marker id="arrowHl" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#365C97"></path></marker>
      </defs>
    </svg>
    <div id="nodesLayer" style="position:absolute;inset:0;z-index:2;"></div>
    <!-- watermark overlay（疊於樹狀圖之上，pointer-events:none 不擋點擊）-->
    <div class="wm-layer" id="wmLayer"></div>
  </div>
</main>

<!-- ===== 🔵 F036 AC-D1～AC-D8：節點文件清單「唯讀」側抽屜（雙擊節點開啟）=====
     自畫布**右側**滑出、**非 modal**（無遮罩，不遮擋樹狀圖，樹狀圖仍可捲動／縮放／再點選）。
     🔒 AC-D4 純唯讀：本區塊內**不得**出現任何寫入類互動元件（新增／移除掛載／改派／儲存／刪除），
        亦不得有任何 <input>／<select>。它是 F009 節點抽屜之**唯讀孿生**，不得復用其可寫版本。 -->
<aside id="nodeDocDrawer" aria-hidden="true" aria-label="節點掛載之程序書清單（唯讀）"
       class="fixed right-0 top-0 bottom-0 z-40 w-full sm:w-[400px] bg-white border-l border-slate-200 shadow-2xl translate-x-full transition-transform duration-300 flex flex-col">
  <div class="h-14 shrink-0 flex items-center gap-2 px-4 border-b border-slate-200">
    <i data-lucide="file-stack" class="w-4 h-4 text-primary-600 shrink-0"></i>
    <div class="min-w-0 flex-1">
      <div id="ndTitle" class="font-semibold text-slate-900 text-sm truncate"></div>
      <div id="ndCount" class="text-[11px] text-slate-400"></div>
    </div>
    <span class="text-[10px] px-1.5 py-0.5 rounded bg-slate-100 text-slate-500 shrink-0">唯讀</span>
    <button onclick="closeNodeDrawer()" aria-label="關閉" title="關閉（Esc）" class="w-8 h-8 rounded hover:bg-slate-100 flex items-center justify-center text-slate-400 shrink-0"><i data-lucide="x" class="w-4 h-4"></i></button>
  </div>
  <div id="ndBody" class="flex-1 overflow-y-auto divide-y divide-slate-100"></div>
  <div class="shrink-0 border-t border-slate-200 px-4 py-2.5 text-[11px] text-slate-400 flex items-start gap-1.5">
    <i data-lucide="info" class="w-3.5 h-3.5 mt-0.5 shrink-0"></i>
    <span>點任一列可另開該程序書之<strong>後台唯讀詳情</strong>。本抽屜為唯讀檢視，不提供任何 DAG 編輯互動；開啟本抽屜<strong>不另記稽核事件</strong>。</span>
  </div>
</aside>

<!-- selection chip -->
<div id="selChip" class="hidden fixed left-1/2 -translate-x-1/2 bottom-5 z-40 items-center gap-2 px-4 py-2 rounded-full bg-slate-900 text-white text-sm shadow-lg">
  <i data-lucide="git-fork" class="w-4 h-4 text-primary-300"></i>
  <span id="selText"></span>
  <button onclick="clearSel()" class="ml-1 inline-flex items-center gap-1 text-slate-300 hover:text-white"><i data-lucide="x" class="w-3.5 h-3.5"></i>取消</button>
</div>

<!-- watermark format caption（比照 05）-->
<footer class="shrink-0 bg-white border-t border-slate-200 px-4 py-2.5">
  <div class="max-w-5xl mx-auto flex flex-col sm:flex-row sm:items-center gap-1.5 sm:gap-3">
    <span class="text-xs text-slate-400 shrink-0">浮水印格式（與稽核快照一致）：</span>
    <code class="mono text-xs text-slate-600 truncate" id="wmString"></code>
  </div>
</footer>

<div id="toastWrap" class="fixed top-20 right-4 z-50 space-y-2"></div>

<script>
  /* ===== 浮水印（格式與 05-public-viewer-watermark 完全一致）=====
     {員工編號}-{姓名}-{公司名稱}-{部門}-{處/室}-{固定機密聲明}-{時間}
     視覺：固定機密聲明「另起一行」；線性格式字串順序不變（與稽核快照一致）。
     身分＝當下登入之管理者（李慧玲／債權管理部 法催一室）；時間沿用示範值。
     公司名稱＝VW_HRCOMF.COMPFULLNM 全稱；部門＝部層完整名稱；處/室＝最細單位名稱。 */
  const WM_DATA   = '20233-李慧玲-和潤企業股份有限公司-債權管理部-法催一室';
  const WM_NOTICE = '僅供內部使用非經許可不得複製翻印或轉製成其他形式呈現';
  const WM_TIME   = '2026-07-16 14:32:08';
  const WM = `${WM_DATA}-${WM_NOTICE}-${WM_TIME}`;
  document.getElementById('wmString').textContent = WM + '  （時區 UTC+8）';
  function fillWatermark(){
    const b=document.getElementById('board');
    const area=(b.clientWidth||760)*(b.clientHeight||1000);
    const count=Math.min(220,Math.max(60,Math.round(area/14000)));
    document.getElementById('wmLayer').innerHTML = Array.from({length:count}).map(()=>`<span>${WM_DATA}<br>${WM_NOTICE}<br>${WM_TIME}</span>`).join('');
  }

  /* ===== F040 顯示名稱純函式（全站同一實作）===== */
  function normalizeSubcategory(v){ const s=(v==null?'':String(v)).trim(); return s?s:null; }
  function lifecycleDisplayName(lc){ if(!lc) return ''; const s=normalizeSubcategory(lc.subcategory); return s?`${lc.name}（${s}）`:lc.name; }

  /* ===== 各循環節點與連線（沿用 11-dag-canvas 之節點視覺與 DAG 資料結構）=====
     每循環：nodes[{id,name,docs}] + edges[[s,t]]；皆含 multi-parent 或 multi-child 以示意上到下 DAG。
     ⚠ F036 AC-S3：本表以 **lifecycleId 為鍵**（非循環代碼）——「銷售及收款循環」之
       消金／企金／子公司三者代碼皆為 SRC，代碼無法區分彼此。
       code 欄僅供頁首顯示 ICSOP 編號第 2 段之循環代碼（僅依 name 推導，AC-28）。 */
  const CYCLES={
    lc1:{name:'銷售及收款循環', subcategory:'消金', code:'SRC', nodes:[
      {id:'a1',name:'進件作業',docs:[{num:'ICSOP-SRC-101-1-01',name:'車輛分期進件作業',edition:"26'01",status:'有效',date:'2026-01-01'},{num:'ICSOP-SRC-101-1-06',name:'消費分期特約通路作業',edition:"25'10",status:'有效',date:'2025-10-01'}]},{id:'a2',name:'簽約對保作業',docs:[{num:'ICSOP-SRC-102-1-01',name:'車輛分期對保作業',edition:"25'11",status:'有效',date:'2025-11-01'}]},{id:'a3',name:'擔保設定作業',docs:[{num:'ICSOP-SRC-102-2-03',name:'擔保品設定登記作業',edition:"26'02",status:'有效',date:'2026-02-01'}]},
      {id:'a4',name:'撥款核准作業',docs:[{num:'ICSOP-SRC-101-2-00',name:'消金審核作業',edition:"25'12",status:'有效',date:'2025-12-01'}]},{id:'a5',name:'案件執行作業',docs:[{num:'ICSOP-SRC-104-1-05',name:'作服撥款作業（車輛）',edition:"26'03",status:'有效',date:'2026-03-01'}]},{id:'a6',name:'案件催收作業',docs:[{num:'ICSOP-SRC-105-1-02',name:'逾期案件催收作業',edition:"26'05",status:'有效',date:'2026-09-01'}]},{id:'a7',name:'案件結束作業',docs:[{num:'ICSOP-SRC-106-1-01',name:'案件結案與檔案歸還作業',edition:"24'08",status:'失效',date:'2024-08-01'}]}],
      edges:[['a1','a2'],['a1','a3'],['a2','a4'],['a3','a4'],['a4','a5'],['a5','a6'],['a5','a7'],['a6','a7']]},
    // 同名不同子分類＝彼此獨立的循環：獨立 UUID、獨立 DAG 結構、獨立文件掛載
    lc10:{name:'銷售及收款循環', subcategory:'企金', code:'SRC', nodes:[
      {id:'j1',name:'企金案件受理作業',docs:[{num:'ICSOP-SRC-103-1-01',name:'企業金融授信作業',edition:"26'02",status:'有效',date:'2026-06-01'}]},{id:'j2',name:'企業徵信作業',docs:[]},{id:'j3',name:'擔保品估價作業',docs:[]},
      {id:'j4',name:'授信核准作業',docs:[]},{id:'j5',name:'額度撥貸作業',docs:[]}],
      edges:[['j1','j2'],['j1','j3'],['j2','j4'],['j3','j4'],['j4','j5']]},
    lc11:{name:'銷售及收款循環', subcategory:'子公司', code:'SRC', nodes:[
      {id:'k1',name:'子公司案件受理作業',docs:[]},{id:'k2',name:'子公司徵信作業',docs:[]},
      {id:'k3',name:'子公司核准作業',docs:[]},{id:'k4',name:'子公司撥款作業',docs:[]}],
      edges:[['k1','k2'],['k1','k3'],['k2','k4'],['k3','k4']]},
    lc2:{name:'採購及付款循環', subcategory:null, code:'PUC', nodes:[
      {id:'b1',name:'請購申請作業',docs:[{num:'ICSOP-PUC-101-2-01',name:'請購申請與核決作業',edition:"25'07",status:'有效',date:'2025-07-01'}]},{id:'b2',name:'採購比議價作業',docs:[{num:'ICSOP-PUC-102-1-02',name:'採購比議價作業',edition:"26'01",status:'有效',date:'2026-01-15'}]},{id:'b3',name:'驗收入庫作業',docs:[{num:'ICSOP-PUC-103-1-01',name:'驗收入庫作業',edition:"25'09",status:'有效',date:'2025-09-01'}]},
      {id:'b4',name:'費用請款作業',docs:[{num:'ICSOP-PUC-101-1-01',name:'和潤-費用請款作業',edition:"26'02",status:'有效',date:'2026-05-01'},{num:'ICSOP-PUC-101-1-04',name:'員工代墊款請款作業',edition:"25'11",status:'有效',date:'2025-11-01'}]},{id:'b5',name:'付款核准作業',docs:[{num:'ICSOP-PUC-104-1-01',name:'付款核准作業',edition:"26'03",status:'有效',date:'2026-03-01'}]},{id:'b6',name:'付款執行作業',docs:[{num:'ICSOP-PUC-105-1-01',name:'付款執行與對帳作業',edition:"23'12",status:'作廢',date:'2023-12-01'}]}],

      {id:'i1',name:'法遵作業',docs:[{num:'ICSOP-GCA-100-2-00',name:'法遵作業',edition:"26'01",status:'有效',date:'2026-03-01'}]},{id:'i2',name:'法規更新作業',docs:[{num:'ICSOP-GCA-101-1-01',name:'法規更新與宣導作業',edition:"25'11",status:'有效',date:'2025-11-01'}]},{id:'i3',name:'內部稽核作業',docs:[{num:'ICSOP-GCA-102-1-01',name:'內部稽核作業',edition:"26'02",status:'有效',date:'2026-02-01'}]},{id:'i4',name:'風險評估作業',docs:[{num:'ICSOP-GCA-103-1-01',name:'風險評估作業',edition:"26'01",status:'有效',date:'2026-01-01'}]}],

  const ORDER=['lc1','lc10','lc11','lc2','lc3','lc4','lc5','lc6','lc7','lc8','lc9'];
  const DEFAULT_ID='lc1';

  const NODE_W=176, NODE_H=62, HGAP=210, VGAP=132, MARGIN=48;
  const board=document.getElementById('board'), svg=document.getElementById('edges'), nodesLayer=document.getElementById('nodesLayer');
  let CUR=DEFAULT_ID, selected=null, zoom=1, cur=null;

  /* 建立循環切換器：顯示＝lifecycleDisplayName（含子分類）、選項值＝lifecycleId（F036 AC-S1）。
     「銷售及收款循環」之消金／企金／子公司為三個相異選項，可分別開啟。 */
  document.getElementById('cycleSel').innerHTML = ORDER.map(id=>`<option value="${id}">${lifecycleDisplayName(CYCLES[id])}（${CYCLES[id].code}）</option>`).join('');

  /* ---- 由上而下分層佈局（最長路徑分層；支援多 parent/多 child）---- */
  function buildGraph(lcId){
    const cy=CYCLES[lcId]; const nodes=cy.nodes, edges=cy.edges;
    const adj={},indeg={}; nodes.forEach(n=>{adj[n.id]=[];indeg[n.id]=0;});
    edges.forEach(([s,t])=>{adj[s].push(t);indeg[t]++;});
    const level={},deg={}; nodes.forEach(n=>{level[n.id]=0;deg[n.id]=indeg[n.id];});
    const q=nodes.filter(n=>indeg[n.id]===0).map(n=>n.id);
    while(q.length){const u=q.shift(); adj[u].forEach(v=>{level[v]=Math.max(level[v],level[u]+1); if(--deg[v]===0)q.push(v);});}
    const levels={}; nodes.forEach(n=>{(levels[level[n.id]]=levels[level[n.id]]||[]).push(n.id);});
    const numLv=Math.max(...nodes.map(n=>level[n.id]))+1;
    const maxCols=Math.max(...Object.keys(levels).map(k=>levels[k].length));
    const pos={};
    Object.keys(levels).forEach(lv=>{const row=levels[lv];const count=row.length;const rowW=count*HGAP;const startX=MARGIN+(maxCols*HGAP-rowW)/2;
      row.forEach((id,i)=>{pos[id]={x:startX+i*HGAP+(HGAP-NODE_W)/2, y:MARGIN+(+lv)*VGAP};});});
    const boardW=MARGIN*2+maxCols*HGAP, boardH=MARGIN*2+(numLv-1)*VGAP+NODE_H;
    return {nodes,edges,adj,pos,boardW,boardH};
  }

  function descendants(id){ // id 及其所有下游（沿 child 邊遞移）
    const set=new Set([id]); const stack=[id];
    while(stack.length){const u=stack.pop(); (cur.adj[u]||[]).forEach(v=>{if(!set.has(v)){set.add(v);stack.push(v);}});}
    return set;
  }

  function edgeD(s,t){ // 直角（elbow / orthogonal）：垂直→水平→垂直，child 端帶箭頭
    const sx=cur.pos[s].x+NODE_W/2, sy=cur.pos[s].y+NODE_H;
    const tx=cur.pos[t].x+NODE_W/2, ty=cur.pos[t].y;
    const midY=sy+(ty-sy)/2;
    return `M ${sx} ${sy} L ${sx} ${midY} L ${tx} ${midY} L ${tx} ${ty}`;
  }

  function renderCycle(){
    // board size
    board.style.width=cur.boardW+'px'; board.style.height=cur.boardH+'px';
    svg.setAttribute('width',cur.boardW); svg.setAttribute('height',cur.boardH);
    svg.setAttribute('viewBox',`0 0 ${cur.boardW} ${cur.boardH}`);
    // edges
    [...svg.querySelectorAll('path.edge')].forEach(p=>p.remove());
    cur.edges.forEach(([s,t])=>{
      const p=document.createElementNS('http://www.w3.org/2000/svg','path');
      p.setAttribute('class','edge'); p.dataset.s=s; p.dataset.t=t;
      p.setAttribute('d',edgeD(s,t)); p.setAttribute('marker-end','url(#arrow)');
      svg.appendChild(p);
    });
    // nodes
    nodesLayer.innerHTML=cur.nodes.map(n=>{
      const p=cur.pos[n.id];
      const cnt=n.docs.length;
      // 🔵 F036 AC-D1（2026-08-16 delta）：新增 dblclick → 唯讀側抽屜；單擊之既有行為不變（AC-D6）
      return `<div class="node${cnt?' hasdocs':''}" data-id="${n.id}" style="left:${p.x}px;top:${p.y}px;width:${NODE_W}px" onclick="onNodeClick(event,'${n.id}')" ondblclick="onNodeDblClick(event,'${n.id}')" role="button" tabindex="0" aria-label="節點 ${n.name}" title="單擊＝標示所有下游節點；雙擊＝檢視此節點掛載之程序書清單">
        <div class="nbody">
          <div class="flex items-center gap-1.5">
            <i data-lucide="git-commit-vertical" class="w-3.5 h-3.5 text-slate-300 shrink-0"></i>
            <span class="font-medium text-slate-800 text-sm truncate">${n.name}</span>
          </div>
          <div class="mt-1 flex items-center gap-1 text-[11px] ${cnt?'text-emerald-600':'text-slate-400'}">
            <i data-lucide="${cnt?'file-check-2':'file-x-2'}" class="w-3.5 h-3.5"></i>${cnt?('掛載 '+cnt+' 份程序書'):'尚未掛載程序書'}
          </div>
        </div>
      </div>`;
    }).join('');
    lucide.createIcons();
    fillWatermark();
    applyHighlight();
  }

  function loadCycle(lcId){
    if(!CYCLES[lcId]) lcId=DEFAULT_ID;
    CUR=lcId; selected=null;
    closeNodeDrawer();          // 切換循環時關閉抽屜（節點集合已改變）
    cur=buildGraph(lcId);
    document.getElementById('cycleSel').value=lcId;
    // 頁首標題＝lifecycleDisplayName（含子分類）；代碼僅依名稱推導，子分類不參與（AC-28）
    document.getElementById('titleName').textContent=lifecycleDisplayName(CYCLES[lcId]);
    document.getElementById('titleCode').textContent=CYCLES[lcId].code;
    renderCycle();
    // 置中捲動
    const st=document.getElementById('stage'); st.scrollLeft=Math.max(0,(board.offsetWidth-st.clientWidth)/2);
  }

  /* ---- 點節點：醒目標示其及所有下游；其餘淡化；再點同節點/空白取消 ----
     🔒 F036 AC-D6 回歸鎖定：本段行為**完全不變**（雙擊 delta 不得改動單擊語意）。 */
  function onNodeClick(ev,id){ ev.stopPropagation(); if(selected===id){ clearSel(); } else { selected=id; applyHighlight(); } }
  function clearSel(){ selected=null; applyHighlight(); }

  /* ---- 🔵 F036 AC-D1～AC-D8（2026-08-16 additive delta）：雙擊節點 → **唯讀側抽屜** ----
     AC-D1 自畫布**右側**滑出（**非 modal**，不遮擋樹狀圖）；標題＝該節點名稱；
           點關閉鈕或按 Escape → 抽屜關閉、樹狀圖狀態不變。
     AC-D2 每列欄位逐字為 `程序書編號`／`程序書書名`／`版次`／`狀態`／`公告日期`；
           編號與版次以等寬字（mono）；狀態依 F012 衍生規則顯示徽章。
     AC-D3 點某一列 → 開啟該文件之**後台唯讀詳情**（/admin/documents/:id；原型導向 16-document-readonly.html）。
     AC-D4 🔒 **純唯讀**：抽屜內**不存在任何寫入類互動元件**——無「新增文件」「移除掛載」「改派節點」
           「儲存」「刪除」等按鈕，亦無任何 <input>／<select> 之可編輯欄位。
           本抽屜為 F009 節點抽屜之**唯讀孿生**，**不得復用其可寫版本**。
     AC-D5 資料端點之權限閘門＝功能鍵「循環管理」**read**（含 Supervisor 全公司唯讀）；
           **不得**沿用 F009 之 ICSOPAdmin 寫入閘門（誤用會使 Supervisor 於本頁遭 403）。
     AC-D6 🔒 單擊之標示下游行為於雙擊時**先行觸發且不被取消**——瀏覽器於雙擊時會先送出兩次
           click（第二次會把選取切掉），故此處**重新設定 selected 並重繪**，確保標示仍然存在。
     AC-D7 節點掛載數為 0 → 抽屜仍開啟並顯示空狀態提示（非錯誤、非空白區塊）。
     AC-D8 本互動**不新增任何 AUDIT_LOG 紀錄**（屬同一次 LIFECYCLE_VIEW 之頁內操作）。 */
  const TODAY='2026-07-17';
  function derivedStatus(d){ if(d.status!=='有效') return d.status; return d.date<=TODAY?'已公告':'進度中'; }
  function statusPill(s){
    const map={'已公告':['#047857','#D1FAE5','megaphone'],'進度中':['#365C97','#EAF1FA','clock'],'失效':['#B45309','#FEF3C7','pause-circle'],'作廢':['#B91C1C','#FEE2E2','x-circle']};
    const [t,b,ic]=map[s]||map['失效'];
    return `<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-xs font-medium whitespace-nowrap" style="color:${t};background:${b}"><i data-lucide="${ic}" class="w-3 h-3"></i>${s}</span>`;
  }
  function onNodeDblClick(ev,id){
    ev.stopPropagation(); ev.preventDefault();
    if(!cur.nodes.some(x=>x.id===id)) return;   // 節點不屬於當前循環（切換後之殘留呼叫）→ 不動任何狀態
    selected=id; applyHighlight();          // AC-D6：雙擊後標示仍然存在
    openNodeDrawer(id);
  }
  function openNodeDrawer(id){
    const n=cur.nodes.find(x=>x.id===id); if(!n) return;
    document.getElementById('ndTitle').textContent=n.name;              // AC-D1：標題＝節點名稱
    document.getElementById('ndCount').textContent=`掛載 ${n.docs.length} 份程序書`;
    document.getElementById('ndBody').innerHTML = n.docs.length
      ? n.docs.map(d=>`
        <button type="button" onclick="openDocReadonly('${d.num}')" data-node-doc-row
                class="w-full text-left px-4 py-3 hover:bg-primary-50/50 focus:outline-none focus:ring-2 focus:ring-inset focus:ring-primary-600">
          <div class="flex items-center gap-2 flex-wrap">
            <span class="mono text-xs text-slate-500">${d.num}</span>${statusPill(derivedStatus(d))}
          </div>
          <div class="text-sm text-slate-800 mt-0.5">${d.name}</div>
          <div class="mt-1 flex items-center gap-3 text-[11px] text-slate-400">
            <span>版次 <span class="mono text-slate-600">${d.edition}</span></span>
            <span>公告日期 <span class="mono text-slate-600">${d.date}</span></span>
          </div>
        </button>`).join('')
      // AC-D7：0 份亦開啟抽屜並顯示空狀態
      : `<div data-node-doc-empty class="px-4 py-10 text-center text-sm text-slate-400">
           <i data-lucide="file-x-2" class="w-8 h-8 mx-auto mb-2 text-slate-300"></i>此節點尚未掛載任何程序書
         </div>`;
    const dr=document.getElementById('nodeDocDrawer');
    dr.classList.remove('translate-x-full'); dr.setAttribute('aria-hidden','false');
    lucide.createIcons();
  }
  function closeNodeDrawer(){
    const dr=document.getElementById('nodeDocDrawer');
    dr.classList.add('translate-x-full'); dr.setAttribute('aria-hidden','true');   // AC-D1：樹狀圖狀態不變
  }
  function openDocReadonly(num){ location.href='16-document-readonly.html'; }      // AC-D3：/admin/documents/:id
  function applyHighlight(){
    const set = selected? descendants(selected) : null;
    nodesLayer.querySelectorAll('.node').forEach(el=>{
      const id=el.dataset.id;
      el.classList.toggle('hl', !!set && set.has(id));
      el.classList.toggle('sel', id===selected);
      el.classList.toggle('dim', !!set && !set.has(id));
    });
    svg.querySelectorAll('path.edge').forEach(p=>{
      const on = !!set && set.has(p.dataset.s) && set.has(p.dataset.t);
      p.classList.toggle('hl', on); p.classList.toggle('dim', !!set && !on);
      p.setAttribute('marker-end', on?'url(#arrowHl)':'url(#arrow)');
    });
    const chip=document.getElementById('selChip');
    if(set){
      const n=cur.nodes.find(x=>x.id===selected);
      document.getElementById('selText').textContent=`已標示「${n.name}」及其 ${set.size-1} 個下游節點`;
      chip.classList.remove('hidden'); chip.classList.add('flex');
    }else{ chip.classList.add('hidden'); chip.classList.remove('flex'); }
  }
  // 點空白處取消
  document.getElementById('stage').addEventListener('click',()=>{ if(selected)clearSel(); });

  /* ---- zoom ---- */
  function applyZoom(){ board.style.transform='scale('+zoom+')'; document.getElementById('zoomLabel').textContent=Math.round(zoom*100)+'%'; }
  function zoomBy(d){ zoom=Math.max(0.5,Math.min(1.8,+(zoom+d).toFixed(2))); applyZoom(); }
  function resetView(){ zoom=1; applyZoom(); }

  /* 🔴 F036 AC-D3（2026-08-17 delta）：本頁是以 window.open 開出的**獨立分頁**，來源清單分頁
     仍在背後開著 ⇒ 離開語意＝**關閉本分頁**，不是在本分頁內導覽。
     若導覽回清單，使用者會得到兩個內容一模一樣的清單分頁，且每看一次樹狀圖就多一個
     （使用者回報之「無限長出新分頁」）。關閉則直接露出原本那個清單分頁，其篩選/排序/頁碼原封不動。
     ⚠ 原 `history.back()` 分支在實作（SPA）中不可用：window.open 開出的分頁 history.length===1。
     ⚠ 直接貼網址進來者沒有 opener、close() 會被拒 ⇒ 退回依 ?from= 導覽（白名單鍵，非任意網址）。 */
  function goBack(){
    if(window.opener){ window.close(); }
    const from=new URLSearchParams(location.search).get('from');
    setTimeout(function(){ location.href = from==='documents' ? '13-document-list.html' : '10-lifecycle-list.html'; }, 200);
  }
  /* 按鈕之名稱／圖示依來源分支（見按鈕處註解）。 */
  function initBackBtn(){
    const btn=document.getElementById('backBtn'); if(!btn) return;
    const from=new URLSearchParams(location.search).get('from');
    const label = window.opener ? '關閉預覽'
                : (from==='documents' ? '返回文件清單' : '返回循環池');
    btn.title=label; btn.setAttribute('aria-label',label);
    btn.innerHTML='<i data-lucide="'+(window.opener?'x':'arrow-left')+'" class="w-5 h-5"></i>';
  }

  function doAction(kind){
    const label={DOWNLOAD:'下載',PRINT:'列印'}[kind]||kind;
    const cyc=document.getElementById('titleName')?.textContent||'';
    toast('success',`已${label}「${cyc}」循環樹狀圖：伺服器端已將浮水印燒錄進 PDF 內容層（非僅前端疊加），並寫入 ${kind} 稽核紀錄`);
  }

  function toast(type,msg){
    const map={success:['check-circle-2','#059669'],info:['info','#365C97'],error:['alert-circle','#DC2626']};
    const [ic,color]=map[type]||map.info;
    const el=document.createElement('div');
    el.className='flex items-start gap-2 bg-white border border-slate-200 shadow-lg rounded-lg px-4 py-3 text-sm max-w-sm';
    el.style.borderLeft='4px solid '+color;
    el.innerHTML=`<i data-lucide="${ic}" class="w-4 h-4 mt-0.5" style="color:${color}"></i><span class="text-slate-700">${msg}</span>`;
    document.getElementById('toastWrap').appendChild(el);lucide.createIcons();
    setTimeout(()=>{el.style.transition='opacity .3s';el.style.opacity='0';setTimeout(()=>el.remove(),300);},4000);
  }
  // AC-D1：Escape 先關抽屜（不動樹狀圖狀態）；抽屜已關閉時才沿用既有之取消標示行為
  document.addEventListener('keydown',e=>{
    if(e.key!=='Escape') return;
    const dr=document.getElementById('nodeDocDrawer');
    if(dr && !dr.classList.contains('translate-x-full')){ closeNodeDrawer(); return; }
    if(selected) clearSel();
  });

  /* init：由 10（循環池）或 13（文件清單第二入口）帶入的 ?lifecycleId=<lifecycleId> 為預設選中。
     F036 AC-S3：參數為 lifecycleId 而非循環代碼——同名不同子分類之代碼相同，
     以代碼帶入將無法區分「消金」「企金」「子公司」，可能誤開另一子分類之循環。 */
  const qId=new URLSearchParams(location.search).get('lifecycleId')||DEFAULT_ID;
  loadCycle(CYCLES[qId]?qId:DEFAULT_ID);
  initBackBtn(); lucide.createIcons();
  window.addEventListener('resize',()=>{ const st=document.getElementById('stage'); st.scrollLeft=Math.max(0,(board.offsetWidth-st.clientWidth)/2); });
</script>
</body>
