# 正式/容器版：nginx 靜態伺服 SPA，並反代 API 到後端容器（compose 服務名 backend:3000）。
# 對應 dev 之 Vite proxy：同源（同一 host:port）→ httpOnly session cookie 正常流通。
#
# ⚠ /admin 同時是後端 API 路徑與 SPA 前端路由（如 /admin/documents）。整頁導覽/重新整理
#   （瀏覽器 Accept: text/html）須回 index.html 交 React Router；API fetch（Accept: application/json）
#   才代理到後端——與 vite.config.ts 之 spaBypass 同一策略，否則整頁導覽 /admin/* 會顯示後端 JSON。
#   /auth 無 SPA 路由（login/callback 為後端 HTML/轉址、logout 清 cookie 後轉址回 SPA、me 為 JSON），
#   全數代理至後端。logout 之 Location 為【相對】'/'，nginx 預設 proxy_redirect 不改寫相對值 →
#   瀏覽器沿用原 host:port 落回 SPA（同 absolute_redirect off 的理由，勿改成絕對 URL）。
#
# ⚠ 快取策略：雜湊資產（/assets/index-<hash>.js|css）immutable 長快取；index.html 一律 no-cache
#   （每次 revalidate）→ 部署新版後瀏覽器即時取得新 shell，不會卡在舊版需硬重載（實測踩到）。

map $http_accept $admin_is_html_nav {
  default 0;
  "~*text/html" 1;
}

# ⚠ 前門 edge 代理終結 TLS 後以【明文 http】轉進本容器，故本層的 $scheme 恆為 http。
#   若各 location 直接送 X-Forwarded-Proto $scheme，會把 edge 已標記的 https 覆寫成 http，
#   後端便無從得知使用者實際走 HTTPS。故：上游有帶就原樣傳遞，沒帶（本機直連）才用 $scheme。
map $http_x_forwarded_proto $fwd_proto {
  default $scheme;
  "~^https?$" $http_x_forwarded_proto;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  proxy_http_version 1.1;

  # 上傳上限須 ≥ 後端 MAX_FILE_SIZE_BYTES（50MB，見 backend/src/storage/file-rules.ts）。
  # nginx 預設僅 1m —— 不設則 XLS／PDF／附錄上傳一過 1MB 就被 nginx 擋在門外回 413，
  # 請求根本到不了後端（dev 走 Vite proxy 無此限制，故只在容器部署才會踩）。留 10m 餘裕給 multipart 邊界。
  client_max_body_size 60m;

  # ⚠ 反向轉址一律相對（Location 不含 host:port）。否則裸 /admin（及補尾斜線）之 301 會用 nginx
  #   自身 listen port(80) 產生【絕對】轉址 http://host/admin/，於非 80 對外埠（dev 5173→80、LB 後）
  #   掉 port → 瀏覽器導向死埠。相對轉址（Location: /admin/）則保留原 host:port。（實測踩到）
  absolute_redirect off;

  # /auth：全數代理至後端（OIDC 握手、session）。
  location /auth/ {
    proxy_pass http://backend:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $fwd_proto;
  }

  # /admin：整頁導覽 → SPA；API fetch → 後端。
  location /admin/ {
    if ($admin_is_html_nav) {
      rewrite ^ /index.html last;
    }
    proxy_pass http://backend:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $fwd_proto;
  }

  # 檔案類端點（下載／匯出／列印／內嵌 PDF）：瀏覽器以 Accept: text/html 導覽請求時
  #   （右鍵「另存連結」、「在新分頁開啟」、檢視器 iframe），若套 /public/ 與 /admin/ 之 SPA bypass
  #   會誤收 index.html —— 使用者拿到副檔名 .pdf／.csv 而內容是 HTML 的檔案，**靜默、無錯誤**。
  #   故以 regex location 優先攔截（regex 優先於 prefix），永遠代理至後端。
  #
  # 🔴 **以「路徑結尾動詞」為規則，不逐一列舉端點**：本 repo 已四次踩到白名單漏列
  #   （/public、/org-units、/persons＋/documents、本次），逐條列舉必然再漏。凡最末段為
  #   download／export／print／pdf 者一律視為檔案端點。SPA 路由無一以此四字為完整末段
  #   （/admin/documents/:id/edit、/public/documents/:id/view 等皆不符），故不會誤攔整頁導覽。
  #   ⚠ 末段須「整段相符」：`/admin/documents/:id/attachments/icsop-pdf`（上傳）之末段為
  #   `icsop-pdf` ≠ `pdf`，不匹配——這是刻意的，勿把 `/` 前綴拿掉。
  #   ⚠ 兩條分開寫（不寫成 `^/(admin|public)/…`）：`proxy-coverage.test.ts` 以 location 字面之
  #   第一段比對兩份代理設定，合併寫法會解析出 `(admin|public)` 這個不存在的前綴而誤報。
  #
  # 注意 :id/view 為 SPA 檢視器路由，不納入此處（仍走 /public/ 之 Accept bypass）。
  location ~ ^/public/documents/.+/(pdf|download|print)$ {
    proxy_pass http://backend:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $fwd_proto;
  }

  # 後台檔案端點。實際涵蓋（2026-08-16 逐一比對後端 @Controller 之結果）：
  #   /admin/appendices/export、/admin/appendices/:id/download、
  #   /admin/change-history/documents/export、/admin/change-history/lifecycles/export、
  #   /admin/change-history/lifecycles/:id/changes/:cid/tree-diff/download、
  #   /admin/lifecycles/:id/tree-preview/download｜print、/admin/access-history/export、
  #   /admin/usage-forms/:id/download。
  location ~ ^/admin/.+/(download|export|print|pdf)$ {
    proxy_pass http://backend:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $fwd_proto;
  }

  # /public：整頁導覽（清單03/詳情04/檢視器05 之 SPA 路由）→ SPA；API fetch（Accept: json）→ 後端。
  #   與 /admin 同一 Accept-header 策略——/public/documents[/:id] 同時是後端 API 與 SPA 路由。
  #   （此前僅代理 /auth、/admin，導致前台 /public/documents、/org-units 回 index.html → 前端 JSON 解析失敗。）
  location /public/ {
    if ($admin_is_html_nav) {
      rewrite ^ /index.html last;
    }
    proxy_pass http://backend:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $fwd_proto;
  }

  # /org-units：純後端 API（無同名 SPA 路由）→ 全數代理。前台部門篩選與文件建立/編輯之 org 下拉來源。
  location /org-units {
    proxy_pass http://backend:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $fwd_proto;
  }

  # /companies、/job-titles：純後端 API（無同名 SPA 路由）→ 全數代理。F003 手動帳號基本資料之
  #   公司／職位主檔（AC-P15／AC-P14）：建立/編輯帳號之公司下拉、職位下拉與清單公司篩選器之唯一來源。
  #   漏代理時 fetch 收到 index.html → JSON 解析失敗 → .catch 收斂為空陣列 → 三處下拉「永遠沒有選項」
  #   且無任何錯誤訊息（與 /persons 同一坑）。
  location /companies {
    proxy_pass http://backend:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $fwd_proto;
  }

  location /job-titles {
    proxy_pass http://backend:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $fwd_proto;
  }

  # /persons：純後端 API（無同名 SPA 路由；SPA 側為 /admin/*、/public/*）→ 全數代理。
  #   F014 當責室長候選之唯一來源。漏代理時 fetch 收到 index.html → 前端 JSON 解析失敗 →
  #   .catch 收斂為空陣列 → 下拉「永遠查無人員」且無錯誤訊息（實測踩到）。
  location /persons {
    proxy_pass http://backend:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $fwd_proto;
  }

  # /documents：純後端 API（無同名 SPA 路由——SPA 為 /admin/documents 與 /public/documents）→ 全數代理。
  #   涵蓋 /documents/:id/usage-forms、/documents/:id/appendices 及其 download、/documents/attachments/download。
  location /documents {
    proxy_pass http://backend:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $fwd_proto;
  }

  # pdf.js 執行期資產（`cmaps/*.bcmap`、`standard_fonts/*.pfb`）——由 `prebuild` 之
  #   `scripts/copy-pdfjs-assets.mjs` 自 `node_modules/pdfjs-dist` 複製進 `public/pdfjs/`，
  #   `postbuild` 之 `verify-pdfjs-assets.mjs` 驗證確實進了 `dist/`。前端以
  #   `CMAP_URL='/pdfjs/cmaps/'`／`STANDARD_FONT_DATA_URL='/pdfjs/standard_fonts/'` 取用。
  #
  # 🔴 **必須以 `=404` 收尾，不得落入 SPA fallback**：檔案存在時 `location /` 的
  #   `try_files $uri` 本來就會先命中真檔，所以正常路徑「看起來」不需要本區塊——
  #   問題出在**缺檔時**：沒有本區塊就會落進 `/index.html`，pdf.js 於是收到一份
  #   `200 text/html` 的「cmap」。**它不會拋錯，而是靜默缺字**（中文變空白／方塊），
  #   與 `@pdf-lib/fontkit` 短 loca 截斷那次同一形狀（使用者親自發現、閘門全綠）。
  #   `/assets/` 寫 `=404` 正是同一理由；本 repo 之既有教訓亦逐字記著「新檔案端點被
  #   SPA fallback 吃掉 ⇒ 拿到副檔名正確、內容是 HTML 的檔案」。
  #
  # ⚠ **刻意不下 `immutable` 長快取**（與 `/assets/` 之唯一差異）：本目錄之檔名由
  #   pdfjs-dist 版本決定、**不含內容雜湊**，升版後同名檔內容會變；`immutable` 會讓瀏覽器
  #   整年不回頭檢查而卡在舊版資產。改以 nginx 預設之 `Last-Modified`／`ETag` 重新驗證
  #   （命中即 304，成本極低——pdf.js 每份文件通常只取 1～2 個 bcmap）。
  #
  # 📌 本區塊為**靜態檔服務、非 API 代理**（無 `proxy_pass`），與 `/assets/` 同性質。
  #   dev 端由 Vite 直接靜態服務 `frontend/public/pdfjs/`，故**不該**出現在 `vite.config.ts` 的
  #   `server.proxy`——把它加進去反而會讓 dev 端 pdf.js 去打後端 :3000 拿 cmap 而 404。
  #   ⚠ 因此新增本 location **確實會**打到 `proxy-coverage.test.ts` 的「兩份設定彼此一致」
  #   （該測試機械抽出全部 `location` 前綴，不分靜態或代理）。**當時實跑即為紅**；
  #   經申訴後由 test 作者於 `18cd385` 將排除清單自單一硬寫值改為具名 `STATIC_LOCATIONS`
  #   常數（`src/api/proxy-coverage.test.ts`，`assets` 與 `pdfjs` 各附理由，另有一條守衛
  #   要求清單項目必須確實存在於本檔）。⇒ **要動本區塊或改名，該常數必須同步**。
  #   📝 本段原文曾把「不受影響」寫成既成結論而未實跑，事後證明為誤——保留此註記提醒：
  #      `npx vitest run src/api/proxy-coverage.test.ts` 只要 5 秒，推論不能代替驗證。
  location /pdfjs/ {
    try_files $uri =404;
  }

  # 🔴 ES module 資產（`.mjs`）之 MIME —— 2026-08-21 使用者於真瀏覽器實測揪出，前台檢視器整個掛掉：
  #     載入失敗 · Setting up fake worker failed:
  #     "Failed to fetch dynamically imported module: …/assets/pdf.worker-<hash>.mjs"
  #
  #   根因：**nginx 之 `mime.types` 沒有 `.mjs` 對映**（實測 nginx/1.31.2 內 `grep -w mjs` 命中 0），
  #   於是落到 `default_type`＝`application/octet-stream`。而瀏覽器對 **ES module 有嚴格 MIME 檢查**：
  #   非 JavaScript MIME 的模組**一律拒絕執行** ⇒ 症狀是「Failed to fetch dynamically imported
  #   module」而**不是 404**（檔案其實在、2,209,730 bytes、回 200）。
  #   pdf.js 之 worker 由 Vite 以 `?url` 打包為 `dist/assets/pdf.worker-<hash>.mjs`
  #   （`PublicViewerPage.tsx:4`），並以 `new Worker(url, { type: 'module' })` 載入 ⇒ 正中此規則。
  #
  # ⚠ **為何用獨立 regex location 而非在 `server` 層加 `types`**：nginx 之 `types` 為區塊型指令，
  #   **在某層宣告即「取代」而非「附加」該層繼承來的整份對映表** ⇒ 在 `server` 層寫
  #   `types { text/javascript mjs; }` 會把 `html`／`css`／`js`／`png` 全部打回
  #   `application/octet-stream`，整站崩潰。故只在**僅會匹配 `.mjs`** 的 location 內覆寫，
  #   炸不到別的副檔名（已於拋棄式容器逐格實測，見實作日誌 §九）。
  #
  # ⚠ regex location 優先於 prefix location ⇒ 本區塊會**取代** `/assets/` 對 `.mjs` 之處理，
  #   故此處必須**自行複製** `/assets/` 之 immutable 長快取，否則 worker 會悄悄失去快取。
  #   （`.mjs` 檔名含內容雜湊，immutable 對它是安全的——與 `/pdfjs/` 那組非雜湊檔名不同。）
  location ~ ^/assets/.+\.mjs$ {
    types { text/javascript mjs; }
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # 雜湊資產：內容改變即檔名改變 → 可 immutable 長快取。
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # SPA index.html 及 fallback：一律 no-cache（部署後即時生效）。
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
