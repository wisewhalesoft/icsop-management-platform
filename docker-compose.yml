# ICSOP 文件管理平台 — docker compose
#
# 決策（2026-07-21）：
#  - 應用自身 DB（MSSQL）不入容器，dev 亦連【外部】MSSQL（APP_MSSQL_*，見 .env）。
#  - RAG 向量庫 pgvector 納入容器。
#  - 上游 HR MSSQL、Azure Blob、Azure AD 皆為外部，不入 compose。
#
# 一鍵啟動（app 服務）：      docker compose up --build
# DB schema + 種子（需先備妥外部 app MSSQL，並填好 .env 之 APP_MSSQL_*）：
#                            docker compose --profile init up --build migration seed

services:
  # RAG 向量庫（Postgres + pgvector）
  pgvector:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${PGVECTOR_DATABASE:-icsop_rag}
      POSTGRES_USER: ${PGVECTOR_USER:-icsop}
      POSTGRES_PASSWORD: ${PGVECTOR_PASSWORD:-change-me-pgvector}
    ports:
      - '5432:5432'
    volumes:
      - pgvector-data:/var/lib/postgresql/data
      - ./infra/pgvector-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U ${PGVECTOR_USER:-icsop} -d ${PGVECTOR_DATABASE:-icsop_rag}']
      interval: 10s
      timeout: 5s
      retries: 5

  # 後端 NestJS
  backend:
    build: ./backend
    env_file: .env
    environment:
      PORT: '3000'
    ports:
      - '3000:3000'
    # 讓容器可連本機的外部 app MSSQL（APP_MSSQL_HOST=host.docker.internal）
    extra_hosts:
      - 'host.docker.internal:host-gateway'

  # 前端 React（nginx 靜態伺服）
  frontend:
    build: ./frontend
    ports:
      - '5173:80'
    depends_on:
      - backend

  # --- 一次性初始化（對外部 app MSSQL），opt-in profile：--profile init ---
  migration:
    build: ./backend
    profiles: ['init']
    env_file: .env
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    command: ['npm', 'run', 'migration:run:prod']
    restart: 'no'

  seed:
    build: ./backend
    profiles: ['init']
    env_file: .env
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    command: ['npm', 'run', 'seed:prod']
    depends_on:
      migration:
        condition: service_completed_successfully
    restart: 'no'

volumes:
  pgvector-data:
