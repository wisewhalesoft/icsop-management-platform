# ICSOP 文件管理平台 — docker compose
#
# 決策（2026-07-21）：
#  - 應用自身 DB（MSSQL）不入容器，dev 亦連【外部】MSSQL（APP_MSSQL_*，見 .env）。
#  - RAG 向量庫 pgvector 納入容器。
#  - 上游 HR MSSQL、Azure Blob、Azure AD 皆為外部，不入 compose。
#
# 一鍵啟動（app 服務）：      docker compose up --build
# DB schema + 種子（全新空庫；需先備妥外部 app MSSQL，並填好 .env 之 APP_MSSQL_*）：
#                            docker compose --profile init up --build seed-doc-catalog
#
# 遠端部署（testicsop.hfcfinance.com.tw）：見 README「部署至遠端測試環境」與 .env.deploy.example。
#   對外由 edge 反向代理（cdmp-mvp/edge，獨佔 80/443、終結 TLS）依 Host 分流進 icsop-frontend。
#   *_PUBLISH 用於錯開共用主機上的既有 port（cdmp-api 已佔 3000）並限縮綁定位址，
#   例：BACKEND_PUBLISH=127.0.0.1:3100 → 只有本機可直連後端，外部一律經 edge。

# 固定 compose 專案名，不隨 clone 出來的目錄名浮動。
# 網路因此恆為 icsop_default —— edge 前門以 external network 接入時吃的就是這個名字，
# 部署主機把 repo clone 成別的資料夾名也不會讓 edge 連不到（502）。
name: icsop

services:
  # RAG 向量庫（Postgres + pgvector）
  pgvector:
    image: pgvector/pgvector:pg16
    container_name: icsop-pgvector
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PGVECTOR_DATABASE:-icsop_rag}
      POSTGRES_USER: ${PGVECTOR_USER:-icsop}
      POSTGRES_PASSWORD: ${PGVECTOR_PASSWORD:-change-me-pgvector}
    ports:
      - '${PGVECTOR_PUBLISH:-5432}:5432'
    volumes:
      - pgvector-data:/var/lib/postgresql/data
      - ./infra/pgvector-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U ${PGVECTOR_USER:-icsop} -d ${PGVECTOR_DATABASE:-icsop_rag}']
      interval: 10s
      timeout: 5s
      retries: 5

  # 後端 NestJS
  backend:
    build: ./backend
    container_name: icsop-backend
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: '3000'
    ports:
      - '${BACKEND_PUBLISH:-3000}:3000'
    # 讓容器可連本機的外部 app MSSQL（APP_MSSQL_HOST=host.docker.internal）
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    # NFR-008 AC4：健康檢查供編排判斷存活。node:22-alpine 無 curl，用 busybox wget。
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/health >/dev/null || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # 前端 React（nginx 靜態伺服 + 反代後端）
  frontend:
    build: ./frontend
    container_name: icsop-frontend
    restart: unless-stopped
    ports:
      - '${FRONTEND_PUBLISH:-5173}:80'
    depends_on:
      - backend
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1/ >/dev/null || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # --- 一次性初始化（對外部 app MSSQL），opt-in profile：--profile init ---
  #
  # 執行序（以 service_completed_successfully 串成單一鏈路，任一步失敗即中斷後續）：
  #   migration → seed-roles → org-sync → bootstrap-admin → seed-lifecycle → seed-doc-catalog
  #
  # 順序由兩條硬相依決定，不可調換：
  #   ① FK_ACCOUNT_role（ACCOUNT.roleCode → ROLE.code）：角色必須先於組織同步。
  #   ② bootstrap-admin 需帳號已存在（帳號由組織同步自上游寫入），故必須後於同步。
  #   ③ FK_ICSOP_DOCUMENT_lifecycle：循環必須先於程序書目錄匯入。
  # 每一步皆冪等，整條鏈重跑安全。
  #
  # 一次跑完：docker compose --profile init up --build seed-doc-catalog
  #   （depends_on 會自動帶起前面所有步驟；亦可只指定其中一步做局部重跑）
  migration:
    build: ./backend
    profiles: ['init']
    env_file: .env
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    command: ['npm', 'run', 'migration:run:prod']
    restart: 'no'

  # ① 5 角色（參照資料）。必須先於 org-sync，否則帳號寫入撞 FK_ACCOUNT_role。
  seed-roles:
    build: ./backend
    profiles: ['init']
    env_file: .env
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    command: ['npm', 'run', 'seed:roles:prod']
    depends_on:
      migration:
        condition: service_completed_successfully
    restart: 'no'

  # ② 首次全量組織同步（ORG_UNIT / ACCOUNT）。app 內另有每日 02:00 排程，
  #    但新環境不能等到隔天，且手動觸發端點需 SysAdmin——而此時尚無任何帳號，故以 CLI 起手。
  org-sync:
    build: ./backend
    profiles: ['init']
    env_file: .env
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    command: ['npm', 'run', 'sync:once:prod']
    depends_on:
      seed-roles:
        condition: service_completed_successfully
    restart: 'no'

  # ③ 將 DEV_ADMIN_EMAIL 對應之帳號升為 SysAdmin（系統唯一的權限起點，之後由其在 UI 指派）。
  #    未設該環境變數時本步驟直接跳過並回傳成功，不中斷鏈路。
  bootstrap-admin:
    build: ./backend
    profiles: ['init']
    env_file: .env
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    command: ['npm', 'run', 'seed:bootstrap-admin:prod']
    depends_on:
      org-sync:
        condition: service_completed_successfully
    restart: 'no'

  # ④ 循環本體（14 種，自程序書目錄之循環別推導）。DAG 節點與邊不入種子，由使用者單位於 UI 建立。
  seed-lifecycle:
    build: ./backend
    profiles: ['init']
    env_file: .env
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    command: ['npm', 'run', 'seed:lifecycle:prod']
    depends_on:
      bootstrap-admin:
        condition: service_completed_successfully
    restart: 'no'

  # ⑤ 程序書目錄匯入（591 筆）。組織對應表填補後可單獨重跑本步驟補寫。
  seed-doc-catalog:
    build: ./backend
    profiles: ['init']
    env_file: .env
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    command: ['npm', 'run', 'seed:doc-catalog:prod']
    depends_on:
      seed-lifecycle:
        condition: service_completed_successfully
    restart: 'no'

volumes:
  pgvector-data:

# ⚠ 固定網段為 172.30.0.0/16，避開遠端 app MSSQL 所在網段（172.20.x）。
# 否則 compose 預設可能分到 172.20.0.0/16 → 容器誤把 DB IP（172.20.202.212）視為 on-link
# → EHOSTUNREACH（實測踩到；隔壁 cdmp-mvp 分到 172.18.x 故無此問題）。
# 部署主機同時跑 cdmp 時亦不衝突（cdmp 172.18.x）；若該主機已有 172.30.x 網段，改設別的私有段。
networks:
  default:
    ipam:
      config:
        - subnet: 172.30.0.0/16
