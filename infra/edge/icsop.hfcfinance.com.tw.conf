# 站台：ICSOP 文件管理平台【正式環境】（icsop.hfcfinance.com.tw）
#
# 本檔為權威副本；部署時複製到 edge 前門的 conf.d：
#   cp infra/edge/icsop.hfcfinance.com.tw.conf  <cdmp-mvp repo>/edge/conf.d/
# 並在 edge/docker-compose.yml 的 networks 掛上 icsop_default，然後
#   docker compose -f <cdmp-mvp repo>/edge/docker-compose.yml up -d --force-recreate
#
# ⚠ 上一行的 --force-recreate 不可省：networks 是【容器建立時】才決定的屬性，
#   只跑 up -d 時 compose 會判定容器 up-to-date 而不重建，edge 就不會真的加入 icsop_default，
#   本站台一律 502（edge error log：`icsop-frontend could not be resolved (2: Server failure)`）。
#   2026-08-21 正式站事故即此。急救可用 `docker network connect icsop_default edge-nginx`（零停機），
#   但那是執行期狀態，edge 一被重建就失效，仍須補做 --force-recreate。見 README 疑難排解。
#
# 測試站設定為 infra/edge/testicsop.hfcfinance.com.tw.conf；兩檔【僅 server_name 不同】，
# 其餘指令逐字相同——改動其一時請同步另一份。
#
# ⚠ 與同一台 edge 上的 cdmp 站台的差異：CDMP 由 edge 自行分流（/api → cdmp-api、其餘 → cdmp-web）；
#   ICSOP 的 frontend 容器內已是一台完整 nginx，自己處理 SPA fallback 與
#   /auth、/admin、/public、/org-units、/persons、/documents 的後端反代
#   （含 Accept: text/html 的整頁導覽判斷）。故 edge 這層【只做一件事】：
#   終結 TLS 後把全部請求原樣交給 icsop-frontend:80。切勿在此另建 /admin 之類的分流規則，
#   會與容器內那層策略打架（整頁導覽會拿到後端 JSON 而非 SPA）。
#
# ⚠ 本站不使用 edge 共用的 conf.d/00-map.conf 所定義之 $connection_upgrade（websocket 用）：
#   ICSOP 無 WebSocket。該檔屬 edge 自身設定，不由本 repo 維護。

# HTTP → HTTPS 轉址
server {
    listen 80;
    server_name icsop.hfcfinance.com.tw;
    return 301 https://$host$request_uri;
}

# HTTPS
server {
    listen 443 ssl;
    http2 on;
    server_name icsop.hfcfinance.com.tw;

    # 與同機 cdmp 共用同一張 wildcard *.hfcfinance.com.tw 憑證（由 ../certs 掛載）
    ssl_certificate     /etc/nginx/certs/2026/STAR_hfcfinance.com.tw.pem;
    ssl_certificate_key /etc/nginx/certs/2026/STAR_hfcfinance.com.tw.key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    # 上傳上限須 ≥ 後端 MAX_FILE_SIZE_BYTES（50MB）。此值須與 frontend/nginx.conf 同步，
    # 任一層留 nginx 預設 1m，超過 1MB 的 PDF／XLS／附錄上傳就會在該層被擋成 413。
    client_max_body_size 60m;

    # docker 內建 DNS + 變數 proxy_pass → 後端容器重建換 IP 也不會卡舊 IP（避免 502）
    resolver 127.0.0.11 valid=30s ipv6=off;

    location / {
        set $upstream_icsop icsop-frontend;
        proxy_pass http://$upstream_icsop:80;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 使用者實際走 HTTPS；此標頭一路傳到後端（frontend nginx 以 $fwd_proto 原樣轉遞）。
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;

        # 大檔上傳／XLS 匯入／組織全量同步等長工作，避免預設 60s 逾時中斷。
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # 後端登入轉址（Location）一律相對路徑，proxy_redirect 預設不改寫相對值 →
        # 瀏覽器沿用 https://icsop...，不會掉回 http 或掉 port。勿改為絕對 URL。
    }
}
